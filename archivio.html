

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archivio — Le Cronache di Gwernia</title>
<style>
:root{
  --gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:#9a7535;
  --bg:#06060f;--cream:#f0e6d3;--cream-dim:#bba98c;
  --border:rgba(201,168,76,.42);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06060f;color:var(--cream);font-family:Georgia,'Times New Roman',serif;font-size:18px;overflow-x:hidden;min-height:100vh}

/* STELLE */
#stars-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* PARETE */
#wall-left{position:absolute;top:0;left:0;width:3vw;z-index:2;pointer-events:none;background:#0e0804}
#wall-center{position:absolute;top:0;left:17vw;right:17vw;z-index:2;pointer-events:none;background:linear-gradient(180deg,#0e0804,#180d06 50%,#0e0804)}
#wall-right{position:absolute;top:0;right:0;width:3vw;z-index:2;pointer-events:none;background:#0e0804}

/* FINESTRE */
#win-left{position:absolute;top:0;left:3vw;width:14vw;z-index:3;pointer-events:none;overflow:hidden}
#win-right{position:absolute;top:0;right:3vw;width:14vw;z-index:3;pointer-events:none;overflow:hidden}
.win-inner{position:absolute;top:0;left:-10px;right:-10px;border:10px solid #5a3210;border-bottom:none;border-radius:50% 50% 0 0 / 7vw 7vw 0 0;overflow:hidden;box-shadow:inset 0 0 0 5px #3a1e08,inset 0 0 0 12px #7a4820,0 0 40px rgba(0,0,0,.8)}
.win-sky{position:absolute;inset:0;background:rgba(3,2,10,.06)}
.win-bar-h1{position:absolute;top:35%;left:0;right:0;height:13px;background:linear-gradient(180deg,#7a4818,#4a2a0c 50%,#7a4818);box-shadow:0 3px 10px rgba(0,0,0,.8)}
.win-bar-h2{position:absolute;top:65%;left:0;right:0;height:13px;background:linear-gradient(180deg,#7a4818,#4a2a0c 50%,#7a4818);box-shadow:0 3px 10px rgba(0,0,0,.8)}
.win-bar-v{position:absolute;top:0;bottom:0;left:50%;width:13px;transform:translateX(-50%);background:linear-gradient(90deg,#7a4818,#4a2a0c 50%,#7a4818);box-shadow:3px 0 10px rgba(0,0,0,.8)}
.win-frame{position:absolute;inset:0;border:7px solid #4a2a0c;border-bottom:none;border-radius:50% 50% 0 0 / 7vw 7vw 0 0;pointer-events:none}

/* BACK BTN */
.back-btn{position:absolute;top:1.2rem;left:50%;transform:translateX(-50%);z-index:200;background:rgba(6,4,16,.92);border:1px solid rgba(201,168,76,.35);color:var(--gold-dim);font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;padding:.5rem 1.4rem;cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}

/* LAYOUT */
.archive-wrap{position:relative;z-index:10;min-height:100vh;padding:5rem 2rem 6rem}
.archive-header{text-align:center;margin-bottom:3.5rem}
.archive-title{font-family:'Palatino Linotype',serif;font-size:clamp(2rem,4vw,3.5rem);color:var(--gold-light);text-shadow:0 0 40px rgba(201,168,76,.4);margin-bottom:.8rem}
.archive-intro{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1.1rem;color:var(--cream-dim);line-height:1.8}
.archive-divider{display:flex;align-items:center;justify-content:center;gap:1rem;margin:1.2rem auto}
.archive-divider::before,.archive-divider::after{content:'';flex:1;max-width:200px;height:1px}
.archive-divider::before{background:linear-gradient(90deg,transparent,rgba(201,168,76,.4))}
.archive-divider::after{background:linear-gradient(90deg,rgba(201,168,76,.4),transparent)}

/* ═══ SCAFFALE A NICCHIE ═══ */
.bookshelf{max-width:none;width:100%;margin:0;padding:0 18vw;display:flex;flex-direction:column;gap:0}

/* Una mensola = pannello di legno con nicchie scavate */
.shelf-row{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  padding:16px 18px 22px;
  /* legno */
  background:
    repeating-linear-gradient(91deg,rgba(255,210,120,.045) 0px,transparent 3px,transparent 46px,rgba(0,0,0,.16) 46px,rgba(0,0,0,.16) 49px),
    linear-gradient(180deg,#5a3414 0%,#46280f 50%,#3a200b 100%);
  border-top:3px solid rgba(255,200,90,.28);
  border-bottom:3px solid rgba(0,0,0,.7);
  box-shadow:inset 0 14px 40px rgba(0,0,0,.6),inset 0 -14px 40px rgba(0,0,0,.7),0 10px 40px rgba(0,0,0,.85);
}
/* riflesso superiore sul legno */
.shelf-row::before{
  content:'';position:absolute;top:0;left:0;right:0;height:8px;
  background:linear-gradient(90deg,transparent,rgba(255,230,140,.32) 30%,rgba(255,240,160,.4) 50%,rgba(255,230,140,.32) 70%,transparent);
  pointer-events:none
}

/* La nicchia: incavo scuro nel legno con leggera profondità */
.niche{
  position:relative;
  border-radius:6px;
  padding:14px 14px 13px;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(0,0,0,.15),rgba(0,0,0,.55) 90%),
    linear-gradient(180deg,#1c0f05,#120a04);
  box-shadow:
    inset 0 4px 12px rgba(0,0,0,.85),
    inset 0 -3px 8px rgba(0,0,0,.7),
    inset 4px 0 9px rgba(0,0,0,.6),
    inset -4px 0 9px rgba(0,0,0,.6),
    0 1px 0 rgba(255,210,120,.16);
  display:flex;flex-direction:column;align-items:center;
}
/* bordo interno chiaro: spessore del legno scavato */
.niche::before{
  content:'';position:absolute;inset:3px;border-radius:4px;
  border-top:2px solid rgba(0,0,0,.6);
  border-left:2px solid rgba(255,200,100,.1);
  border-right:2px solid rgba(0,0,0,.5);
  border-bottom:2px solid rgba(255,200,100,.14);
  pointer-events:none
}

/* COPERTINA FRONTALE */
.cover-book{
  position:relative;width:100%;aspect-ratio:3/4;cursor:pointer;
  border-radius:4px 6px 6px 4px;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),filter .35s,box-shadow .35s;
  transform-origin:center center;
  box-shadow:0 10px 24px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.6);
  overflow:hidden;
}
.cover-book::after{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none;z-index:3}
.cover-book img{width:100%;height:100%;object-fit:cover;display:block}
.cover-book:hover{transform:scale(1.02);filter:brightness(1.07)}

/* etichetta titolo sotto la copertina */
.niche-label{
  font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;
  font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold-light);text-align:center;line-height:1.4;
  text-shadow:0 1px 4px rgba(0,0,0,.9);min-height:2em;
}
.niche-sub{display:block;font-size:.58rem;letter-spacing:.04em;color:var(--cream-dim);text-transform:none;font-style:italic;margin-top:.15rem}

/* ═══ LIBRO BLOCCATO ═══ */
.cover-book.locked{cursor:default;background:linear-gradient(160deg,#241a12,#15100a);display:flex;align-items:center;justify-content:center}
.cover-book.locked:hover{transform:none;filter:none;box-shadow:0 10px 24px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.6)}
.cover-book.locked::before{
  content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Palatino Linotype',serif;font-size:7rem;font-weight:700;
  color:rgba(201,168,76,.3);text-shadow:0 2px 14px rgba(0,0,0,.8);z-index:2
}
/* trama decorativa tenue sul libro bloccato */
.cover-book.locked .locked-deco{
  position:absolute;inset:10px;border:1px solid rgba(201,168,76,.13);border-radius:3px;
}
.cover-book.locked .locked-deco::before{
  content:'';position:absolute;inset:6px;border:1px solid rgba(201,168,76,.08);border-radius:2px
}
.niche-label.locked-label{color:rgba(187,169,140,.45);font-style:italic}

/* Vista admin: copertina visibile ma offuscata, per riconoscere il libro */
.cover-book.locked.admin-peek img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.35) saturate(.5) blur(1.5px)}
.cover-book.locked.admin-peek::before{font-size:4.5rem;color:rgba(201,168,76,.55)}
.cover-book.locked.admin-peek .locked-deco{inset:6px}

/* ═══ READER ═══ */
.book-reader-overlay{position:fixed;inset:0;z-index:9990;background:rgba(2,1,8,.97);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .28s ease}
.book-reader-overlay.open{display:flex}
.book-reader-overlay.visible{opacity:1}

.book-cover-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:2rem}
.book-cover-page img{max-height:74vh;max-width:84vw;object-fit:contain;border-radius:6px;box-shadow:0 24px 80px rgba(0,0,0,.95);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.book-cover-page img:hover{transform:scale(1.02)}

.book-reading{display:flex;flex-direction:column;align-items:center;gap:1.4rem;width:min(1240px,96vw)}

/* Libro aperto */
.book-open{
  display:grid;grid-template-columns:1fr 1fr;
  width:100%;height:min(84vh,860px);
  background:#1a0f04;
  border:1px solid rgba(201,168,76,.2);
  border-radius:3px;
  box-shadow:0 0 0 5px rgba(75,35,6,.7),0 0 0 8px rgba(45,18,3,.55),0 38px 110px rgba(0,0,0,.98),0 0 90px rgba(0,0,0,.55);
  overflow:hidden;position:relative;perspective:2600px
}
.book-open::before{content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:54px;background:linear-gradient(90deg,transparent 0%,rgba(12,4,0,.4) 22%,rgba(5,1,0,.82) 44%,rgba(3,0,0,.9) 50%,rgba(5,1,0,.82) 56%,rgba(12,4,0,.4) 78%,transparent 100%);pointer-events:none;z-index:5}
.book-open::after{content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:2px;background:linear-gradient(180deg,rgba(200,135,38,.18),rgba(150,90,22,.42) 50%,rgba(200,135,38,.18));pointer-events:none;z-index:6}

.book-page{
  display:flex;flex-direction:column;padding:2.8rem 3.4rem 2rem;
  background:
    radial-gradient(ellipse at 18% 10%,rgba(255,252,228,.7) 0%,transparent 48%),
    radial-gradient(ellipse at 78% 90%,rgba(192,158,108,.32) 0%,transparent 44%),
    repeating-linear-gradient(0deg,transparent,transparent 27.4px,rgba(145,105,50,.04) 27.4px,rgba(145,105,50,.04) 28.4px),
    linear-gradient(168deg,#fefae8 0%,#f9eeda 42%,#f2e3c6 100%);
  color:#271508;font-family:Georgia,'Times New Roman',serif;font-size:1.04rem;line-height:1.88;
  position:relative;overflow:hidden
}
.book-page::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(75,34,6,.22) 0%,transparent 10%,transparent 90%,rgba(75,34,6,.18) 100%),linear-gradient(180deg,rgba(75,34,6,.2) 0%,transparent 13%,transparent 87%,rgba(75,34,6,.28) 100%);pointer-events:none;z-index:1}
.book-page:first-child{background:radial-gradient(ellipse at 82% 10%,rgba(255,252,228,.7) 0%,transparent 48%),radial-gradient(ellipse at 18% 90%,rgba(192,158,108,.32) 0%,transparent 44%),repeating-linear-gradient(0deg,transparent,transparent 27.4px,rgba(145,105,50,.04) 27.4px,rgba(145,105,50,.04) 28.4px),linear-gradient(12deg,#fefae8 0%,#f9eeda 42%,#f2e3c6 100%)}
.book-page:first-child::before{background:linear-gradient(90deg,rgba(75,34,6,.18) 0%,transparent 10%,transparent 82%,rgba(40,12,1,.5) 100%),linear-gradient(180deg,rgba(75,34,6,.2) 0%,transparent 13%,transparent 87%,rgba(75,34,6,.28) 100%)}

.book-page-title{font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;font-size:.58rem;font-weight:600;color:rgba(88,40,7,.5);text-align:center;margin:0 0 1.4rem;padding-bottom:.75rem;letter-spacing:.28em;text-transform:uppercase;flex-shrink:0;position:relative;z-index:2}
.book-page-title::after{content:'';position:absolute;bottom:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(135,72,14,.38) 25%,rgba(190,128,44,.62) 50%,rgba(135,72,14,.38) 75%,transparent)}

.book-page-content{flex:1;overflow:hidden;position:relative;z-index:2}
.book-page-content p{margin:.7rem 0;text-align:justify;font-size:1.05rem;line-height:1.9}
.book-page-content p:first-child{margin-top:0}
.book-page-content strong{font-weight:normal;color:inherit}
.book-page-content em{font-style:italic;color:#5a3410}

.book-page-num{font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;font-size:.54rem;color:rgba(88,40,7,.4);letter-spacing:.14em;text-align:center;flex-shrink:0;margin-top:.8rem;position:relative;z-index:2}
.book-page-num:not(:empty)::before{content:'— '}
.book-page-num:not(:empty)::after{content:' —'}

.book-reader-controls{display:flex;align-items:center;gap:1.5rem}
.book-nav-btn{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.4);color:var(--gold);width:50px;height:50px;font-size:1.4rem;cursor:pointer;transition:background .2s,transform .15s;display:flex;align-items:center;justify-content:center;border-radius:3px}
.book-nav-btn:hover:not(:disabled){background:rgba(201,168,76,.25);border-color:var(--gold);transform:scale(1.06)}
.book-nav-btn:active:not(:disabled){transform:scale(.94)}
.book-nav-btn:disabled{opacity:.25;cursor:default}
.book-close-btn{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);color:var(--gold-dim);padding:.6rem 1.8rem;font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .2s;border-radius:3px}
.book-close-btn:hover{background:rgba(201,168,76,.2);color:var(--gold)}
.book-reader-page-info{font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);min-width:80px;text-align:center}

/* ═══ SFOGLIATURA 3D ═══ */
.book-flip-wrap{position:absolute;top:0;bottom:0;width:50%;z-index:10;pointer-events:none}
.book-flip-inner{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.book-flip-front,.book-flip-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.book-flip-back{transform:rotateY(180deg)}
.book-flip-front::after{content:'';position:absolute;inset:0;background:linear-gradient(to left,rgba(0,0,0,.16) 0%,transparent 26%);pointer-events:none;z-index:4}
.book-flip-back::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.14) 0%,transparent 26%);pointer-events:none;z-index:4}

@media(max-width:1100px){.bookshelf{padding:0 8vw}.shelf-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.bookshelf{padding:0 6vw}.shelf-row{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 12px 16px}.book-open{grid-template-columns:1fr}.book-page:first-child{display:none}}

/* ═══ ADMIN LOGIN ═══ */
.admin-login-btn{position:fixed;top:1.2rem;right:2rem;z-index:200;background:rgba(6,4,16,.92);border:1px solid rgba(201,168,76,.35);color:var(--gold-dim);font-size:1.05rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;opacity:.7}
.admin-login-btn:hover{border-color:var(--gold);color:var(--gold);opacity:1}
.admin-login-btn.is-admin{color:#7fd87f;opacity:1}
.adm-overlay{position:fixed;inset:0;z-index:9980;background:rgba(2,1,8,.85);backdrop-filter:blur(10px);display:none}
.adm-overlay.open{display:block}
.adm-modal{position:fixed;z-index:9981;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(8,5,20,.97);border:2px solid var(--border);border-top:3px solid var(--gold-dim);max-width:520px;width:92%;max-height:86vh;overflow-y:auto;padding:2rem 2.2rem;display:none;box-shadow:0 24px 64px rgba(0,0,0,.9)}
.adm-modal.open{display:block}
.adm-modal-title{font-family:'Palatino Linotype',serif;font-size:1.1rem;color:var(--gold-light);margin:0 0 .9rem}
.adm-modal-close{position:absolute;top:.8rem;right:1rem;background:none;border:none;color:var(--gold-dim);font-size:1.3rem;cursor:pointer;line-height:1}
.adm-modal-close:hover{color:var(--gold)}
.adm-field{margin-bottom:.9rem}
.adm-field label{font-family:'Palatino Linotype', 'Book Antiqua', Palatino,serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);display:block;margin-bottom:.35rem}
.adm-field input[type=text],.adm-field input[type=email],.adm-field input[type=password],.adm-field textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.3);padding:.55rem .7rem;color:var(--cream);font-family:Georgia,'Times New Roman',serif;font-size:.95rem;outline:none;resize:vertical;box-sizing:border-box;transition:border-color .2s}
.adm-field input:focus,.adm-field textarea:focus{border-color:rgba(201,168,76,.7)}
.adm-field textarea{min-height:160px;line-height:1.6}
.adm-field-hint{font-size:.72rem;color:var(--cream-dim);margin-top:.3rem;font-style:italic}
.adm-toggle-row{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}
.adm-toggle-row label{font-family:'Palatino Linotype', 'Book Antiqua', Palatino,serif;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-dim);cursor:pointer}
.adm-switch{position:relative;width:42px;height:22px;flex-shrink:0;cursor:pointer}
.adm-switch input{opacity:0;width:0;height:0;position:absolute}
.adm-switch-track{position:absolute;inset:0;background:rgba(255,255,255,.12);border:1px solid rgba(201,168,76,.35);border-radius:11px;transition:background .2s}
.adm-switch-track::before{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--gold-dim);transition:transform .2s,background .2s}
.adm-switch input:checked+.adm-switch-track{background:rgba(127,216,127,.25);border-color:#7fd87f}
.adm-switch input:checked+.adm-switch-track::before{transform:translateX(20px);background:#7fd87f}
.adm-modal-actions{display:flex;gap:.8rem;margin-top:.5rem}
.adm-btn{flex:1;padding:.6rem;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.5);color:var(--gold);font-family:'Palatino Linotype', 'Book Antiqua', Palatino,serif;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s}
.adm-btn:hover{background:rgba(201,168,76,.28);border-color:var(--gold)}
.adm-btn-danger{border-color:rgba(255,80,80,.5);color:#ff8080}
.adm-btn-danger:hover{background:rgba(255,80,80,.15);border-color:#ff8080}
#adm-login-error{color:#ff8080;font-size:.8rem;display:none;margin:.4rem 0 0}

/* ═══ ADMIN CONTROLS SUI LIBRI ═══ */
.admin-only{display:none}
body.is-admin .admin-only{display:flex}
.niche{position:relative}
.book-admin-bar{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:6;display:none;gap:4px;background:rgba(4,3,12,.94);border:1px solid rgba(201,168,76,.4);padding:3px;border-radius:3px}
body.is-admin .niche:hover .book-admin-bar{display:flex}
.book-admin-btn{width:26px;height:26px;background:none;border:none;color:var(--gold);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:2px}
.book-admin-btn:hover{background:rgba(201,168,76,.2)}
body.is-admin .cover-book.locked{opacity:.7}
.add-book-btn{position:fixed;bottom:2rem;right:2rem;z-index:150;width:56px;height:56px;border-radius:50%;background:rgba(201,168,76,.18);border:1px solid rgba(201,168,76,.55);color:var(--gold-light);font-size:1.6rem;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.7);transition:background .2s}
body.is-admin .add-book-btn{display:flex}
.add-book-btn:hover{background:rgba(201,168,76,.32)}
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<div id="wall-left"></div>
<div id="wall-center"></div>
<div id="wall-right"></div>

<div id="win-left"><div class="win-inner"><div class="win-sky"></div><div class="win-bar-h1"></div><div class="win-bar-h2"></div><div class="win-bar-v"></div><div class="win-frame"></div></div></div>
<div id="win-right"><div class="win-inner"><div class="win-sky"></div><div class="win-bar-h1"></div><div class="win-bar-h2"></div><div class="win-bar-v"></div><div class="win-frame"></div></div></div>

<a class="back-btn" href="https://helvorn92.github.io/World/gwernia">Torna al Sito</a>

<!-- ═══ ADMIN LOGIN ═══ -->
<button class="admin-login-btn" id="admin-login-btn" onclick="openAdminLogin()" title="Accedi">⚿</button>
<div class="adm-overlay" id="admin-login-overlay" onclick="if(event.target===this)closeAdminLogin()"></div>
<div class="adm-modal" id="admin-login-modal">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCCfucSV5KmGd4M9Bg7mD4UPhbBK4ce0-k",
    authDomain: "gwernia.firebaseapp.com",
    projectId: "gwernia",
    storageBucket: "gwernia.firebasestorage.app",
    messagingSenderId: "442880358118",
    appId: "1:442880358118:web:71b180258d8dc98d786d27",
    measurementId: "G-4TEN29F7HG"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);

  window.fbIsAdmin = false;
  setPersistence(fbAuth, browserLocalPersistence).catch(()=>{});

  onAuthStateChanged(fbAuth, user => {
    window.fbIsAdmin = !!user;
    document.body.classList.toggle('is-admin', !!user);
    window.dispatchEvent(new CustomEvent('admin-state-changed', { detail: { isAdmin: !!user, email: user ? user.email : null } }));
  });

  window.fbAdminLogin = (email, password) => signInWithEmailAndPassword(fbAuth, email, password);
  window.fbAdminLogout = () => signOut(fbAuth);
  window.fbSaveBook = (id, data) => setDoc(doc(fbDb, 'books', id), data, { merge: true });
  window.fbSubscribeBooks = cb => onSnapshot(collection(fbDb, 'books'), snap => {
    const out = {};
    snap.forEach(d => { out[d.id] = d.data(); });
    cb(out);
  }, err => console.error('Firestore books error:', err));
</script>

<script>
/* ═══ ADMIN LOGIN UI ═══ */
function openAdminLogin(){
  document.getElementById('admin-login-overlay').classList.add('open');
  document.getElementById('admin-login-modal').classList.add('open');
  document.getElementById('adm-login-error').style.display='none';
}
function closeAdminLogin(){
  document.getElementById('admin-login-overlay').classList.remove('open');
  document.getElementById('admin-login-modal').classList.remove('open');
}
function adminLogin(){
  const email = document.getElementById('admin-login-email').value.trim();
  const password = document.getElementById('admin-login-password').value;
  const errEl = document.getElementById('adm-login-error');
  errEl.style.display='none';
  if(!email || !password) return;
  window.fbAdminLogin(email, password).then(()=>{
    document.getElementById('admin-login-password').value='';
    closeAdminLogin();
  }).catch(()=>{
    errEl.textContent = 'Credenziali non valide.';
    errEl.style.display='block';
  });
}
function adminLogout(){
  window.fbAdminLogout();
  closeAdminLogin();
}
window.addEventListener('admin-state-changed', e => {
  const btn = document.getElementById('admin-login-btn');
  const form = document.getElementById('admin-login-form');
  const loggedIn = document.getElementById('admin-logged-in');
  const title = document.getElementById('admin-login-title');
  if(e.detail.isAdmin){
    btn.classList.add('is-admin');
    form.style.display='none';
    loggedIn.style.display='block';
    title.textContent='Amministratore';
    document.getElementById('admin-logged-email').textContent = e.detail.email;
  } else {
    btn.classList.remove('is-admin');
    form.style.display='block';
    loggedIn.style.display='none';
    title.textContent='Accesso Amministratore';
  }
  if(window.renderShelf) window.renderShelf();
});
</script>

<script>
/* ═══ STELLE ═══ */
const canvas=document.getElementById('stars-canvas'),ctx=canvas.getContext('2d');
let W,H,stars=[],meteors=[],starsOffsetY=0,targetOffsetY=0;
window.addEventListener('scroll',function(){targetOffsetY=window.scrollY*0.25;},{passive:true});
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;initStars()}
function initStars(){stars=[];var count=Math.floor((W*H)/3800);for(var i=0;i<count;i++){var bright=Math.random()<0.12;stars.push({x:Math.random()*W,y:Math.random()*H,r:bright?Math.random()*.8+1:Math.random()*.9+.2,pulse:Math.random()*Math.PI*2,speed:Math.random()*.8+.4,bright:bright,gp:Math.random()*Math.PI*2});}}
function spawnMeteor(){meteors.push({x:Math.random()*W*.6+W*.2,y:Math.random()*H*.3,vx:Math.random()*3+2,vy:Math.random()*2+1,len:Math.random()*80+60,a:1})}
function drawStars(){ctx.clearRect(0,0,W,H);starsOffsetY+=(targetOffsetY-starsOffsetY)*.06;var t=Date.now()*.001;stars.forEach(function(s){var dy=((s.y-starsOffsetY)%H+H)%H;var alpha=s.bright?.55+.45*Math.sin(t*s.speed+s.pulse):.25+.35*Math.sin(t*s.speed*.6+s.pulse);ctx.beginPath();ctx.arc(s.x,dy,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,245,210,'+alpha+')';ctx.fill();if(s.bright){var ga=.18+.18*Math.sin(t*s.speed+s.gp),g=ctx.createRadialGradient(s.x,dy,0,s.x,dy,s.r*5);g.addColorStop(0,'rgba(201,168,76,'+ga+')');g.addColorStop(1,'rgba(201,168,76,0)');ctx.beginPath();ctx.arc(s.x,dy,s.r*5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}});meteors=meteors.filter(function(m){m.x+=m.vx;m.y+=m.vy;m.a-=.015;if(m.a<=0)return false;var g=ctx.createLinearGradient(m.x-m.vx*m.len/m.vx,m.y-m.vy*m.len/m.vx,m.x,m.y);g.addColorStop(0,'rgba(201,168,76,0)');g.addColorStop(1,'rgba(201,168,76,'+m.a*.7+')');ctx.beginPath();ctx.moveTo(m.x-m.vx*m.len/5,m.y-m.vy*m.len/5);ctx.lineTo(m.x,m.y);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.stroke();return true;});requestAnimationFrame(drawStars);}
window.addEventListener('resize',resize);resize();drawStars();
setInterval(function(){if(Math.random()<.45)spawnMeteor();},2200);

const ARCHIVE_BOOKS = {
"b1":{"title":"Pactum Regis","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846673/Pactum_Regis_sbipy4.png","paragraphs":["Durante la <strong>3ª Era</strong>, i sovrani dei territori più influenti di <strong>Gwernia</strong> stipularono un Trattato politico e commerciale con l'intento di porre fine al ciclo di conflitti e diffidenze tra i Regni. Tale accordo mirava a favorire una <em>cooperazione strategica</em> e una globalizzazione vantaggiosa per il progresso collettivo.","Sotto la guida visionaria dei Re <strong>Andor Ulrick</strong>, <strong>Mithrandir Mornil</strong>, <strong>Draedan Ghexiros</strong> e <strong>Dulgroff Tallforge</strong>, vennero abbattute molte delle barriere culturali che avevano diviso le loro razze per secoli. La collaborazione tra queste figure di spicco portò a una prosperità senza precedenti.","Circa dieci anni dopo la ratifica del Trattato, una profonda crisi politica, innescata da una disputa sul controllo delle <em>rotte commerciali chiave</em> e delle risorse naturali, coinvolse i Regni. La situazione si aggravò ulteriormente quando emersero prove di una possibile <em>cospirazione</em> orchestrata da qualcuno nel <strong>Consiglio Mondiale</strong>, che cercava di manipolare le politiche commerciali a proprio vantaggio.","Questo generò un'ondata di sfiducia reciproca, dovuta anche a conflitti di interesse. L'escalation culminò nella <em>dissoluzione ufficiale del Pactum Regis</em>, segnando la fine di un periodo di cooperazione e il ritorno a una politica di isolazionismo e sospetto reciproco."]},
"b2":{"title":"La Testuggine Dragona","sub":"di Lisbet Morwen","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846669/La_Testuggine_Dragona_ufhkmu.png","paragraphs":["All'alba di una notte insonne mi trovai a fissare l'orizzonte di un nuovo mistero. Tra il rum scadente e i sogni infranti, il racconto di un uomo mi scaldò il cuore. <em>\"Rogue Island\"</em>, conosciuta anche come <em>\"l'Isola Sfuggente\"</em> o <em>\"l'Isola Galleggiante\"</em>, un enigma che danzava sulle onde del mare.","I porti di <strong>Eldoria</strong>, <strong>Ysgar</strong> e <strong>Murondhir</strong> divennero teatro della mia ricerca. Un viaggio di prove e tribolazioni che mi condussero tra le braccia di <strong>Bartholomew</strong>, un pirata distinto, un uomo che rompeva ogni stereotipo con la sua erudizione e il suo fascino. La sua proposta fu una folgorazione, una promessa di avventura che superava ogni mia aspettativa.","Unirsi alla sua ciurma era un salto nel buio, un passo verso l'ignoto che accettai con un coraggio che non sapevo di possedere. I giorni in mare divennero mesi, e la nave di <strong>Bartholomew</strong> fu il mio mondo, un mondo in cui l'orizzonte era tanto inafferrabile quanto affascinante.","Quando finalmente l'Isola Galleggiante si delineò all'orizzonte, il cuore mi balzò in petto. Ma l'isola era un miraggio che sfuggiva a ogni tentativo di avvicinamento, un enigma che si svelò solo sotto l'abile guida marinaresca di <strong>Bartholomew</strong>. La rivelazione fu tanto meravigliosa quanto inaspettata: quell'Isola Galleggiante non era altro che una <strong>Testuggine Dragona</strong>, una creatura di proporzioni mitiche che portava sul suo dorso un microcosmo di vita.","La fauna e la flora che prosperavano sul dorso della <strong>Testuggine Dragona</strong> erano testimonianze viventi dell'adattabilità della natura. Il perché non si muovesse al di sotto della superficie del mare resta un mistero. <strong>Bartholomew</strong> navigava tra le correnti del destino, portando con sé tesori e sogni ogni volta che ritornava dalle sue avventure.","<strong>L'Oede</strong> — Una curiosa pianta che produce un unico frutto all'anno. Consumandolo, tutte le ferite vengono rimarginate, si guarisce da ogni malattia inclusa quella di origine magica, e si è liberati da ogni condizione come avvelenamento, cecità, ammaliamento, paralisi e sordità. Il frutto mantiene le sue proprietà per <em>una settimana dalla raccolta</em>, a meno che la sua essenza non venga estratta con <em>Strumenti da Alchimista o Erborista</em>.","<strong>La Morwen Ambrata</strong> — Una straordinaria pianta in grado di produrre una densa linfa color ambra che, se ingerita, <em>migliora permanentemente la caratteristica più alta dell'organismo</em>. Sulla Testuggine esiste un solo esemplare, capace di generare al massimo due dosi. Prelevarne una sola consente alla pianta di rigenerarsi nell'arco di un anno. <em>Ogni individuo può beneficiarne una sola volta nella vita.</em>"]},
"b3":{"title":"Il Santuario delle Lacrime","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846670/Il_Santuario_delle_Lacrime_xibn9j.png","paragraphs":["Il libro racconta la toccante vicenda di <strong>Xandria</strong>, una nobile <strong>Elfa dei Boschi</strong> destinata a sposare un <strong>Elfo Alto</strong>. Un matrimonio imposto, concepito per sancire il rinnovo di un'antica alleanza tra due popoli un tempo divisi da profondi conflitti.","Frustrata dalla vita che le era stata imposta, decise di ritagliarsi uno spazio tutto suo. In una valle remota scoprì un lago, le cui acque placide parevano accogliere con benevolenza le sue lacrime di amarezza. Un giorno, in quel luogo incantato, <strong>Xandria</strong> incontrò un <strong>Drow</strong>, Elfo Oscuro scampato alle ombre oppressive del <strong>Sottosuolo</strong>.","Il loro primo incontro fu carico di timore: lei, sorpresa e impaurita, cercò di allontanarsi, ma il <strong>Drow</strong> non mostrava ostilità. Al contrario, portava un'aura di solitudine che rifletteva la propria. Lentamente, le barriere si sciolsero e i due iniziarono a condividere storie di profonda intimità, tessendo un <em>legame proibito ma irresistibile</em>.","Ma i giorni di segreto finirono quando il padre di <strong>Xandria</strong>, insospettito dalle sue frequenti assenze, scoprì la verità. Per gli Elfi, i <strong>Drow</strong> erano un popolo maledetto, una razza in guerra con la luce. Fu così che l'ordine di morte fu emesso, e l'amato di <strong>Xandria</strong> cadde sotto la lama di una sentenza inesorabile.","Devastata dal dolore, <strong>Xandria</strong> si rivolse agli Dei, pregando di riavere il suo amato. Ma il silenzio divino fu l'unica risposta. Nella disperazione, trovò conforto un'ultima volta presso il lago, e con un gesto estremo, scelse di unirsi alle profondità delle sue acque, lasciando che il suo spirito si fondesse con la natura stessa.","Oggi, quel luogo è considerato sacro dagli <strong>Alti Elfi</strong> e dagli <strong>Elfi dei Boschi</strong> del nord di <strong>Arinthel</strong>, che ne proteggono gelosamente l'ubicazione. Si racconta che, in tempi recenti, abbia acquisito <em>proprietà straordinarie</em>, capaci di estendere la vita degli Elfi che meditano in quelle acque, concedendo loro una <em>longevità senza pari</em>."]},
"b4":{"title":"Oracolo di Nihilsar","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846670/L_Oracolo_di_Nihilsar_iigzvm.png","paragraphs":["Pochi sono gli scritti che menzionano l'<strong>Oracolo</strong>, e nessuno rivela con certezza la sua natura. Le notizie che ci giungono provengono da racconti tramandati a voce, da pellegrini e viandanti che giurano d'aver udito il suo sussurro.","Si narra che il <strong>Tumulo di Nihilsar</strong>, se davvero esiste, sia stato innalzato nella <strong>Prima Era</strong>, ma la sua ubicazione rimane celata. I racconti sostengono che l'Oracolo sia in grado di suscitare <em>visioni tali da spezzare e ricomporre la coscienza stessa</em>, ma di queste esperienze non restano che pergamene lacere, mappe incerte e simboli consumati dal tempo.","Secondo alcune interpretazioni, <strong>Nihilsar</strong> incarna il concetto di <em>nulla</em>, il vuoto, la non-esistenza. Il prefisso <em>\"Nihil-\"</em> richiama il <strong>nichilismo</strong>, la corrente filosofica che sostiene l'assenza di significato, scopo o valore intrinseco nella vita. Questo Oracolo rappresenta dunque la <em>negazione dell'essere</em>.","Alcuni testi più criptici accennano all'esistenza di un <em>secondo Oracolo</em>, che potrebbe simboleggiare l'esatto opposto del <strong>Tumulo di Nihilsar</strong>, rappresentando invece l'essenza della pienezza. Se dovesse esistere, i due Oracoli rifletterebbero temi filosofici profondi riguardanti <em>l'esistenza e la non-esistenza</em>. Nessuna prova ne dimostra però la realtà."]},
"b5":{"title":"Le Pietre di Contenimento","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846674/Le_Pietre_di_Contenimento_qyukrf.png","paragraphs":["<em>Trascritto dagli appunti personali di <strong>Krivaxtheralzis</strong>, Maestro Cristallomante, con la sapienza di <strong>Veridia Fiammaramata</strong>, Guardiana della Conoscenza. 325° Arco Ciclico — Pyraxis.</em>","Durante una spedizione nelle profondità di <strong>Khaz-Moran</strong>, <strong>Krivaxtheralzis</strong> rinvenne quattro Cristalli di purezza straordinaria, sepolti in una vena di roccia che nessun piccone aveva mai toccato. Le analisi rivelarono una struttura cristallina così stabile da renderli <em>contenitori naturali di energia arcana</em>, capaci di trattenerla senza dispersione.","Fu dato il via al progetto delle <strong>Pietre di Contenimento</strong>, un'iniziativa ambiziosa per creare focus arcani in grado di offrire agli incantatori una riserva di magia. Ulteriori studi rivelarono che i cristalli potevano anche <em>assorbire e trattenere potere elementale puro</em>.\n\n<strong>La Pietra Ardencia</strong> — Immersa nelle Pozze di Magma del <strong>Monte Ignaryx</strong>, Piano Elementale del Fuoco. Il rituale durò tre giorni ininterrotti.\n\n<strong>La Pietra Acquasilva</strong> — Immersa nelle acque del <strong>Ghiacciaio Piangente</strong>, Piano Elementale dell'Acqua. Le temperature estreme sfinirono l'officiante.","<strong>La Pietra Zephyris</strong> — Esposta alle tempeste perpetue della <strong>Vetta del Fulmine</strong>. L'officiante fu colpito 28 volte da scariche di intensità anomala, salvato solo dall'intervento di <strong>Veridia</strong>.\n\n<strong>La Pietra Lithogea</strong> — Immersa nelle <strong>Paludi Acide di Xil'thrax</strong>, Piano Elementale della Terra. Il processo risultò più rapido grazie all'esperienza accumulata.","I test sistematici rivelarono due proprietà straordinarie. La prima: <em>risonanza e amplificazione</em> — usata come focus, la pietra amplifica significativamente la magia dell'elemento corrispondente. La seconda: <em>assorbimento e rilascio</em> — la pietra può assorbire un attacco elementale immagazzinandone l'energia, che può poi essere rilasciata come raggio. <em>Nel libro sono annotati i passaggi per la Risonanza Prismatica.</em>"]},
"b6":{"title":"Gli Echi di Kael'Zor","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846675/Gli_Echi_di_Kael_Zor_olcb2t.png","paragraphs":["Tutto ebbe inizio a <strong>Pyraxis</strong>, la prima Capitale di <strong>Draconia</strong>. Situata in una vasta pianura circondata da montagne ricche di purissimi cristalli magici, prosperava grazie alla capacità dei suoi abitanti di sfruttare quei cristalli per approfondire le arti arcane.","A governarla c'era <strong>Kael'Zor</strong>, il leggendario <strong>Drago di Cristallo</strong>, guardiano delle montagne e maestro dei <strong>Dragonidi</strong> nell'arte di canalizzare l'energia. Unico nel suo genere, era temuto e incompreso dagli altri draghi, sia metallici che cromatici, poiché la sua Magia sembrava interferire con il loro potere indebolendoli.","Intorno all'<strong>800 a.C.</strong> accadde l'irreparabile. Un gruppo di <strong>Dragonidi</strong>, sedotti dal potere e dalle promesse dei <strong>Draghi Cromatici</strong>, cospirò per distruggere <strong>Kael'Zor</strong>. Sapevano che l'unico modo era annientare il suo <em>Cuore di Cristallo</em>, la fonte stessa della sua Magia.","Dopo una lunga e sanguinosa impresa, riuscirono nel loro intento, ma il prezzo fu catastrofico. Alla frantumazione del <em>Cuore</em>, una <em>risonanza magica incontrollata</em> si diffuse attraverso i cristalli della regione, liberando onde di pura energia che devastarono ogni cosa. Frane, valanghe e mutazioni colpirono terre, bestie e <strong>Dragonidi</strong>.","Il <em>Cuore di Cristallo</em> si divise in <strong>cinque frammenti</strong>, mentre il corpo del drago si disperse in schegge minute per tutta <strong>Pyraxis</strong>. I pochi sopravvissuti abbandonarono le terre devastate, oggi note come <em>\"Terre Infrante\"</em>, e fondarono <strong>Drakelang</strong>, erigendola a nuova capitale del Regno.","Dalla contaminazione lasciata dalla Magia di <strong>Kael'Zor</strong> nacquero i primi <strong>Draghi e Dragonidi Gemmati</strong>. Alcuni di loro fondarono <em>\"I Custodi di Kael'Zor\"</em>, un ordine devoto a recuperare i Frammenti del Cuore di Drago e a preservare la sacra eredità di <strong>Kael'Zor</strong>, affinché la sua magia non fosse mai dimenticata né profanata."]},
"b7":{"title":"Il Mito dei Draghi","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846674/Il_Mito_dei_Draghi_vt8slg.png","paragraphs":["I <strong>Draghi</strong>, creature mitiche e mastodontiche dotate di grande potere magico e notevole intelligenza, pare popolino il mondo da prima delle Ere. Si dividono principalmente in due categorie: i <strong>Draghi Cromatici</strong>, noti per la loro natura malevola e aggressiva, e i <strong>Draghi Metallici</strong>, riconosciuti per la loro bontà e altruismo.","Col passare dei secoli, molti popoli tentarono di sfidare i Draghi, ma nulla riuscì mai a intaccare la loro supremazia, se non una calamità nota come <em>\"Fearg-An\"</em>, una misteriosa piaga che scatenò un'anomalia nei Draghi. Questa malattia li condusse sull'orlo dell'estinzione, un destino poi sigillato dai <strong>Nani</strong>, che riuscirono, grazie alle loro <strong>balliste</strong>, a porre fine al caos.","La perdita dei Draghi fu un colpo durissimo, poiché già in passato i <strong>Dragonidi</strong> avevano affrontato la tragedia della distruzione di <strong>Pyraxis</strong> nella <strong>2ª Era</strong>.","Oggi tutto ciò che rimane dell'antica stirpe dei Draghi è rappresentato dai <strong>Dragonidi</strong>. Questi discendenti conservano l'antico legame con i loro progenitori, portando avanti l'eredità di nobiltà e potenza che un tempo dominava i cieli e le terre di <strong>Gwernia</strong>. Non a caso, il <em>Draconico</em> è una delle lingue più utilizzate nel campo della Magia."]},
"b8":{"title":"Sylvandor","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846672/Sylvandor_nhgdf2.png","paragraphs":["Nelle mistiche terre di <strong>Arinthel</strong> si estende l'antica <strong>Foresta di Sylvandor</strong>, dove alberi altissimi, le cui fronde toccano il cielo, prendono vita come <strong>Treant</strong>, esseri arborei senzienti che hanno assistito agli albori del tempo. Questa foresta sacra viene venerata dagli <strong>Elfi dei Boschi</strong>, i cui sforzi sono dedicati a preservarne l'equilibrio e la magia.","Durante la <strong>Prima Era</strong>, gli <strong>Elfi Alti</strong> intravidero nella <strong>Foresta di Sylvandor</strong> una fonte di potere magico da mettere al servizio della civiltà. Decisero quindi di stabilire una colonia nella foresta per studiarne la magia. Tuttavia, gli <strong>Elfi dei Boschi</strong> percepirono questo come una violazione della sacralità del luogo, rischiando di alterarne l'equilibrio naturale.","I tentativi di dialogo non portarono risultati, e gli <strong>Elfi dei Boschi</strong> iniziarono a ostacolare l'insediamento, aggravando le tensioni. Con il passare del tempo il conflitto raggiunse un punto critico: gli <strong>Elfi dei Boschi</strong> eseguirono un potente rituale per isolare la foresta, ma gli <strong>Elfi Alti</strong> interferirono, causando una devastante <em>frattura nella trama magica</em> e la moria dei <strong>Treant</strong>.","L'incidente spinse entrambe le fazioni a comprendere che la loro ostilità stava distruggendo ciò che entrambe volevano preservare. Fu convocato un consiglio tra gli <strong>Alti Saggi degli Elfi dei Boschi</strong> e il <strong>Re degli Elfi Alti</strong>.","L'accordo stabilì: la creazione di un <em>piccolo insediamento comune</em>, l'accesso alla Foresta regolato a <em>periodi specifici dell'anno</em>, il divieto dell'<em>uso eccessivo della magia</em> e l'istituzione di un <em>rito di unione tra i lignaggi elfici</em>. Questo accordo ha permesso alla <strong>Foresta di Sylvandor</strong> di risanarsi e alla sua sacralità di perdurare attraverso le generazioni."]},
"b9":{"title":"La Grande Faida","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846667/La_Grande_Faida_plhqnx.png","paragraphs":["Nel corso della storia, numerosi conflitti hanno segnato le relazioni tra <strong>Nani</strong> ed <strong>Elfi</strong>. Tra questi, spicca quello tra i <strong>Nani di Moghurn</strong> e gli <strong>Elfi dei Boschi di Illfnor</strong>, nato per l'ottenimento del prezioso <em>Mithril</em>.","Affascinati da questo raro minerale, i <strong>Nani</strong> convinsero gli <strong>Elfi</strong> a consentire l'avvio di attività minerarie nel loro territorio, promettendo una parte del materiale estratto. Tuttavia, le prime operazioni si rivelarono invasive e dannose per l'ambiente. A causa della fragilità delle rocce locali, diversi crolli nelle miniere provocarono numerose vittime, tra cui degli <em>schiavi</em>, un atto intollerabile agli occhi degli Elfi.","Questo evento spinse gli <strong>Elfi</strong> a interrompere immediatamente l'accordo, costringendo i <strong>Nani</strong> a lasciare le loro terre. Offesi e umiliati, i <strong>Nani</strong> reagirono con un approccio bellicoso, tentando di riconquistare le miniere con la forza. Dopo anni di scontri, gli <strong>Elfi</strong> riuscirono infine a espellerli definitivamente.","Da quella sconfitta, i <strong>Nani</strong> cercarono nelle proprie terre giacimenti di <em>Mithril</em> simili. Fu durante lo scavo più profondo che abbandonarono questa caccia: si imbatterono in qualcosa di così oscuro e pericoloso che la miniera fu immediatamente sigillata.","Oggi, il <em>Mithril</em> estratto dalle terre di <strong>Illfnor</strong> rimane <em>l'unico disponibile al mondo</em>, rendendolo estremamente prezioso."]},
"b10":{"title":"Accordo delle 4 Cime","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846667/L_Accordo_delle_4_Cime_j6bdrv.png","paragraphs":["In passato, le città Naniche erano indipendenti e costantemente in competizione tra loro. Tuttavia, un Clan in particolare, sconfitto in un violento conflitto, fu costretto a rifugiarsi nelle profondità della terra, nell'oscuro e inospitale <strong>Underdark</strong>.","Generazioni trascorse in quell'ambiente ostile trasformarono radicalmente la loro cultura e fisiologia, dando origine agli odierni <strong>Nani Grigi</strong> conosciuti come <strong>Duergar</strong>. Spinti da un inestinguibile desiderio di vendetta, iniziarono a sabotare le miniere dei Clan Nanici in superficie, paralizzando le economie delle città.","Fu nell'<strong>840 a.C.</strong> che <strong>Darnak Thaurgrim</strong>, Capo Clan di <strong>Helstrom</strong>, convocò gli altri tre leader più influenti di <strong>Murondir</strong>, le cui città erano scavate nelle montagne più alte del territorio. Riuscì a convincerli a mettere da parte le rivalità e unire le forze per scongiurare la rovina del popolo nanico.","Dopo anni di sanguinosi conflitti, i <strong>Duergar</strong> furono costretti a ritirarsi e molte delle loro vie d'accesso al sottosuolo vennero sigillate o attentamente sorvegliate.","Questa vittoria segnò l'inizio di una nuova società Nanica. I legami tra i Clan si rafforzarono e <strong>Darnak Thaurgrim</strong> fu proclamato <em>primo Re dei Nani</em>. La sua città, simbolo di unità e forza, divenne la capitale del Regno."]},
"b11":{"title":"Yuan-Ti - Miti e Misteri","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846666/Yuan-Ti_Miti_e_Misteri_zgup0k.png","paragraphs":["L'origine degli <strong>Yuan-Ti</strong> risale agli albori del mondo, quando nacquero le prime razze e si formarono le fondamenta della civiltà. Da allora, queste creature si sono evolute, adattandosi agli ambienti più estremi e sviluppando caratteristiche uniche.","Si è consapevoli dell'esistenza di due distinte tipologie: gli <strong>Yuan-Ti Henophidi</strong>, che abitano le zone desertiche di <strong>Aralynn</strong>, noti per le loro scaglie bianche e gli occhi azzurri; e gli <strong>Yuan-Ti Caenophidi</strong>, che vivono nelle regioni tropicali di <strong>Belaver</strong>, distinguibili per le scaglie verdi e gli occhi gialli.","Sebbene possano apparire come creature istintive e mostruose, entrambe le stirpi possiedono una struttura sociale <em>rigidamente organizzata</em>, forgiata da millenni di selezione naturale e rituali cruenti. Il fine di tali rituali rimane avvolto nel mistero. I sacerdoti del <strong>Pantheon Egizio</strong> sostengono che dietro le loro pratiche si celi <strong>Apophis</strong>, il grande serpente simbolo del caos e dell'oscurità.","Tra gli <strong>Yuan-Ti</strong> più conosciuti vi sono i <em>Meticci</em>, nati da rituali falliti o unioni interrazziali con gli umani. Rinnegati sia dal loro popolo che dalle altre razze, vivono isolati, nascondendo la loro vera natura per sfuggire a persecuzioni.","Tuttavia, ad <strong>Aralynn</strong> i <em>Meticci</em> godono di una certa tolleranza, in quanto la loro natura ibrida li rende utili come intermediari tra il mondo degli <strong>Yuan-Ti</strong> e quello delle altre razze."]},
"b12":{"title":"Divinità Occulte","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846669/Divinit%C3%A0_Occulte_p4re5h.png","paragraphs":["Le <strong>Divinità Occulte</strong>, così chiamate per la loro natura avvolta nel mistero, rappresentano un enigma controverso per i teologi e gli studiosi del mondo. Non esistono cronache antiche né testi sacri che ne descrivano l'origine o il ruolo, eppure la loro presenza si percepisce come un'<em>ombra persistente</em>, insinuata nelle pieghe della realtà di <strong>Gwernia</strong>.","Si dice che operino dai loro <em>Piani di Esistenza</em>, luoghi fuori dalla portata dei mortali, ma stranamente vicini al mondo materiale. Le rare testimonianze che esistono provengono da visioni, sogni e rivelazioni di fedeli ai limiti della sanità.","<strong>Thaleus</strong>, un devoto di <strong>Vecna</strong>, dichiarò sotto tortura che la vera natura delle <strong>Divinità Occulte</strong> rappresenta al tempo stesso <em>la fonte del loro immenso potere e la loro più grande vulnerabilità</em>. Questa rivelazione gli costò la vita. Morì lasciando dietro di sé più interrogativi che certezze.","Ad oggi, l'esistenza di solo due di queste Divinità è stata confermata: <strong>Vecna</strong> e <strong>Pelor</strong>, i cui seguaci dimostrano concretamente la realtà del loro potere. Le altre restano nell'ombra, <em>misteri da svelare nel corso dell'avventura</em>."]},
"b13":{"title":"Madame Bovary","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846671/Madame_Bovary_ivlpew.png","paragraphs":["Fin dall'alba dei tempi, gli esseri viventi hanno sempre cercato un modo per scrutare nel futuro della propria esistenza. Questa inesauribile curiosità ha dato vita, attraverso i secoli, a metodi di divinazione sempre più bizzarri: <em>Dadi della Predizione</em>, <em>Ossa Profetiche</em> e, tra i più celebri, la <strong>Cartomanzia</strong>, la divinazione attraverso i Tarocchi.","Questa forma di divinazione nacque nel <strong>1250 a.C.</strong> con <strong>Madame Bovary</strong>, una cartomante di talento ineguagliabile, la cui fama raggiunse ogni angolo del globo. Vagava per il mondo con un solo scopo: offrire risposte a coloro che erano tormentati dai quesiti della vita.","Ma la sua abilità non era ordinaria. Il suo <em>mazzo di tarocchi</em> era in grado di predire il futuro con una precisione spaventosa. Con esso rivelò destini e svelò segreti oscuri, guadagnandosi una reputazione <em>temuta ma rispettata</em> in ogni angolo di <strong>Gwernia</strong>."]},
"b14":{"title":"Ill Omen","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846665/Ill_Omen_u9q9k9.png","paragraphs":["Ho attraversato tutta <strong>Prohelide</strong>, mosso dalla determinazione di comprendere l'influenza che le Divinità esercitano sul nostro mondo. Alla fine, ho trovato la risposta che cercavo, ma insieme a essa è emersa una verità che non riuscirò mai ad accettare.","Le Divinità, sebbene potenti oltre ogni immaginazione, sono vincolate da <em>leggi cosmiche</em> che limitano il loro intervento diretto. Per proteggerci dalle catastrofi, hanno creato quattro emissari: i <strong>Cavalieri dell'Apocalisse</strong>. Queste entità appaiono nei momenti di crisi globale, non solo come araldi di distruzione, ma come <em>simboli di speranza</em> e avvertimento.","<strong>Il Cavaliere Bianco — Giudizio</strong><br>Il corno che porta è un segnale, un richiamo a risvegliarsi e riconoscere l'importanza del momento, preparando il terreno per ciò che deve venire.\n\n<strong>Il Cavaliere Rosso — Guerra</strong><br>La sua <em>Spada Bramasangue</em> è il simbolo della distruzione che taglia via il marcio per permettere la guarigione. La sua presenza infiamma gli animi, spingendo al cambiamento attraverso il conflitto.","<strong>Il Cavaliere Verde — Carestia</strong><br>La <em>Bilancia</em> che porta è un promemoria costante che, alla fine, tutti sono uguali di fronte alle forze dell'universo. Le prove della carestia spingono gli individui a riflettere e adattarsi insieme.\n\n<strong>Il Cavaliere Nero — Morte</strong><br>La sua <em>Falce Eterea</em> non raccoglie vite, ma Anime. È colui che recide ciò che è stato da ciò che sarà.","Oggi è l'anno <strong>730 a.C.</strong> e il <em>Morbo Spettrale</em> dilaga, mietendo vite con una velocità spaventosa. Un tempo <strong>Prohelide</strong> era il centro di ogni cultura conosciuta, un luogo dove razze diverse convivevano e commerciavano. Oggi di tutto questo resta solo il ricordo. Le strade sono vuote, i mercati abbandonati, le torri che un tempo rappresentavano potere giacciono in rovina."]},
"b15":{"title":"Le Cronache di Prohelide","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846666/Le_Cronache_di_Prohelide_sancy8.png","paragraphs":["Al calare di una pallida nebbia, raggiunsi i confini di <strong>Vraithgar</strong>, un luogo avvolto da un silenzio innaturale e custode dei segreti del <strong>Regno di Prohelide</strong>. Vraithgar è un territorio ostile, infestato da creature deformi e flagellato da malattie insidiose. Tra rovine e biblioteche date alle fiamme, raccolsi frammenti di conoscenze ormai dimenticate.","Al centro di tutto, <strong>Erypolis</strong>, cuore pulsante di <strong>Prohelide</strong>. Grazie a magie di decifrazione, interpretai iscrizioni che parlano di una <em>Magocrazia</em>: un consiglio di cinque potenti maghi a capo del regno. La magia non era solo un mezzo, ma la stessa essenza della vita. Fu allora che nacque la religione per il dio <strong>Pelor</strong>, venerato come portatore di guarigione e speranza.","Nelle visioni apparve un bambino segnato dalla tragedia: dopo aver assistito alla morte della madre sul rogo, crebbe con il cuore avvelenato dal desiderio di vendetta. Diventato uno dei <strong>Maghi supremi</strong>, scatenò il <em>Morbo Spettrale</em>, un'epidemia letale che trasformò <strong>Prohelide</strong> in un <strong>Regno di morte</strong>.","Oggi <strong>Vraithgar</strong> non è altro che un'immensa landa desolata, infestata da orrori e maledizioni antiche. Nessuno osa attraversare i passi di <strong>Brumalvento</strong>, <strong>Durin'skald</strong> e <strong>Northgul</strong>.","Nonostante gli orrori incontrati, tramanderò queste conoscenze affinché il passato possa insegnare qualcosa. <em>Chi dimentica la storia è condannato a ripeterla.</em>"]},
"b16":{"title":"Il Grande Clockout","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846664/Il_Grande_Clockout_biipi4.png","paragraphs":["Il <strong>Grande Clockout</strong> fu un evento catastrofico che segnò indelebilmente la storia di <strong>Aresil</strong>, generando un clima di paura e diffidenza verso i <strong>Forgiati</strong>. L'incidente avvenne durante l'<em>Esposizione Meccanomagica</em>, quando un pericoloso criminale sabotò il sistema di controllo dei <strong>Forgiati</strong> nel tentativo di sottrarne alcuni esemplari.","Il sabotaggio innescò comportamenti imprevedibili nei <strong>Forgiati</strong>, causando gravi danni alle strutture e ferendo numerosi spettatori. Un incendio accidentale, provocato da un difetto di progettazione in uno dei <strong>Forgiati</strong>, amplificò il caos e aumentò il bilancio delle vittime.","In seguito al <strong>Clockout</strong>, le autorità introdussero regolamentazioni più rigide sull'uso e la manutenzione dei <strong>Forgiati</strong>. L'evento provocò una spaccatura nella comunità di <strong>Aresil</strong>: da un lato i sostenitori dell'innovazione tecnologica; dall'altro movimenti di resistenza che promuovevano un ritorno ai metodi tradizionali.","Il <strong>Grande Clockout</strong> sollevò anche un dibattito etico riguardo alla crescente autonomia dei <strong>Forgiati</strong>. Alcuni esperti sostennero che il malfunzionamento potesse derivare da una <em>primitiva forma di autocontrollo</em> sviluppatasi nei modelli più avanzati, progettati per apprendere e adattarsi.","L'idea che i <strong>Forgiati</strong> potessero evolvere una sorta di <em>volontà propria</em> inquietò ulteriormente la popolazione, alimentando il timore che un giorno potessero sfuggire al controllo. Il dibattito, mai risolto, continua ancora oggi."]},
"b17":{"title":"Alleanza dei Vertici","sub":"di Aurelion Duval","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846672/Alleanza_dei_Vertici_k8t8op.png","paragraphs":["Ci fu un tempo in cui cinque individui, eredi delle <em>Oscure Materie</em>, spinti da un'ambizione senza pari, usarono la loro maestria nel manipolare tali forze per aspirare a dominare le altre razze.","Correva l'<strong>Arco Ciclico 950</strong> quando la loro presenza gettò le terre in un susseguirsi di <em>Guerre, Carestie e Morte</em>. Furono gli uomini a riconoscere il pericolo che gli eredi rappresentavano per l'equilibrio del mondo. Sfruttando l'alleanza nata dal <strong>Pactum Regis</strong>, si unirono con l'obiettivo di neutralizzare la minaccia.","Con ingegno e determinazione, furono forgiate <strong>cinque Reliquie</strong>, ognuna capace di assorbire i loro poteri, rendendoli inermi a qualunque offensiva. La battaglia che ne seguì fu ardua, ma alla fine <em>trionfarono i Vertici</em>.","Gli eredi furono sconfitti e le reliquie furono distrutte. Il <strong>Re degli uomini Andor</strong>, l'eroe indomito che guidò il mondo verso la luce di una nuova alba, cancellò ogni traccia di quella tirannia, segnando <em>l'inizio di una nuova era di pace</em>."]},
"b18":{"title":"I 12 Astri dello Zodiaco","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846668/I_12_Astri_dello_Zodiaco_th9fhw.png","paragraphs":["Nel silenzioso buio che precede l'alba, alcuni astri diventano i protagonisti della volta celeste: lo <strong>Zodiaco Bianco</strong> e lo <strong>Zodiaco Nero</strong>, <strong>12 Costellazioni</strong> la cui scoperta fu merito dell'astronomo <strong>Basileus</strong>, un uomo il cui genio era superato solo dalla sua ossessione.","Le Costellazioni dello Zodiaco sono l'eco di <em>Anime Mortali divenute Semidivine</em> a causa delle loro azioni incredibilmente gloriose o atroci. <strong>Basileus</strong> proveniva da una famiglia di astronomi e matematici, ma era sempre stato considerato il più brillante. La sua sete di conoscenza lo portò alla scrittura del <em>Cosmocron</em> e alla costruzione di un <em>Astrolabio</em> capace di canalizzare il potere delle costellazioni.","Questa sua geniale invenzione non fu accolta con ammirazione dai <strong>Chierici di Pelor</strong>. Per paura che il congegno potesse essere usato per incanalare il potere dello <strong>Zodiaco Nero</strong>, fu condannato al rogo insieme al <em>Cosmocron</em>, affinché nessuno potesse replicarlo.","Si narra che mentre le fiamme lo consumavano, il suo grido di agonia echeggiò attraverso il cielo notturno, e per un momento le <strong>Costellazioni</strong> brillarono più intensamente, come se il cosmo stesse piangendo la perdita del suo più devoto osservatore.","Le <em>storie dei dodici Astri</em> sono descritte in dettaglio nel <em>Cosmocron</em>, andato perduto. Frammenti del libro continuano ad apparire in posti inattesi, custoditi da chi comprende il valore di ciò che <strong>Basileus</strong> ha sacrificato."]},
"b19":{"title":"Sancta Fides - I Solacri di Pelor","cover":"https://res.cloudinary.com/dkvotcvo6/image/upload/v1773846666/Sancta_Fides_dnm3sd.png","paragraphs":["Il <strong>Sancta Fides</strong> è la religione ufficiale di <strong>Eldoria</strong>, che ha quasi completamente soppiantato i tre principali Pantheon: <strong>Norreno</strong>, <strong>Egizio</strong> e <strong>Greco</strong>. Questo predominio è dovuto al sostegno della famiglia reale e alle donazioni di nobili, mercanti e fedeli. Al vertice si trova un'unica figura: la <em>Voce di Pelor</em>, nota anche come <strong>Sommo Padre</strong>.","Questa religione si diffuse a <strong>Eldoria</strong> nel <strong>640 a.C.</strong> grazie ai <strong>Solacri di Pelor</strong>: <strong>Elyon</strong>, <strong>Kainor</strong>, <strong>Perseus</strong>, <strong>Daryos</strong> e <strong>Vastor</strong>, individui benedetti dall'essenza del sole, il cui potere consentiva di tenere sotto controllo la piaga della necromanzia usata per scopi ignobili.","Il numero dei <strong>Solacri</strong> è sempre rimasto invariato, in omaggio ai <em>cinque raggi del sole di Pelor</em>. Quando uno di loro moriva prematuramente, veniva resuscitato dai suoi compagni, a meno che la morte non fosse dovuta a cause naturali; in tal caso veniva scelto un degno successore.","Tuttavia, anche un sole può non brillare per sempre. Una piaga mise in ginocchio persino i <strong>Solacri</strong>, portandone uno a una <em>morte senza ritorno</em>. Con la fede in <strong>Pelor</strong> vacillante, la necromanzia maligna si rafforzò, e i <strong>Solacri</strong>, un tempo custodi della luce, videro il loro potere svanire.","E come in un circolo vizioso, <em>con l'affievolimento dei poteri, si affievoliva anche la loro fede in Pelor</em>. Il futuro del <strong>Sancta Fides</strong> e dei suoi Solacri rimane oggi avvolto nell'incertezza."]}
};

/* ═══ COSTRUZIONE SCAFFALE (con merge Firestore) ═══ */
let BOOKS = {};
function buildStaticBooks(){
  const out = {};
  Object.entries(ARCHIVE_BOOKS).forEach(([id, b]) => {
    out[id] = Object.assign({}, b, { locked: STATIC_LOCKED[id] === true, order: parseInt(id.replace(/\D/g,''),10) || 999 });
  });
  return out;
}
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }
function buildShelf(){
  var shelf=document.getElementById('bookshelf');
  if(!shelf) return;
  var entries = Object.entries(BOOKS).filter(function(e){ return !e[1].deleted; });
  // Sbloccati in cima, bloccati in fondo (stabile: conserva l'ordine dentro ogni gruppo)
  entries.sort(function(a,b){
    var la=a[1].locked===true?1:0, lb=b[1].locked===true?1:0;
    if(la!==lb) return la-lb;
    return (a[1].order||999)-(b[1].order||999);
  });
  var perRow=3;
  var html='';
  for(var r=0;r<entries.length;r+=perRow){
    html+='<div class="shelf-row">';
    for(var i=r;i<r+perRow && i<entries.length;i++){
      var id=entries[i][0], b=entries[i][1];
      var isLocked = b.locked===true;
      html+='<div class="niche">';
      html+='<div class="book-admin-bar">'+
        '<button class="book-admin-btn" title="Modifica" onclick="event.stopPropagation();openBookEdit(\''+id+'\')">✎</button>'+
        '<button class="book-admin-btn" title="'+(isLocked?'Sblocca':'Blocca')+'" onclick="event.stopPropagation();toggleBookLocked(\''+id+'\')">'+(isLocked?'🔓':'🔒')+'</button>'+
        '<button class="book-admin-btn" title="Elimina" onclick="event.stopPropagation();deleteBook(\''+id+'\')">🗑</button>'+
      '</div>';
      if(isLocked){
        if(window.fbIsAdmin){
          html+='<div class="cover-book locked admin-peek"><img src="'+escAttr(b.cover)+'" alt="" loading="lazy"><div class="locked-deco"></div></div>';
        } else {
          html+='<div class="cover-book locked"><div class="locked-deco"></div></div>';
        }
      }else{
        html+='<div class="cover-book" onclick="openBook(\''+id+'\')"><img src="'+escAttr(b.cover)+'" alt="'+escAttr(b.title)+'" loading="lazy"></div>';
      }
      html+='</div>';
    }
    html+='</div>';
  }
  shelf.innerHTML=html;
  setTimeout(setWallHeights,50);
}
window.renderShelf = buildShelf;
BOOKS = buildStaticBooks();
buildShelf();
(function waitForFirebase(){
  if(!window.fbSubscribeBooks){ setTimeout(waitForFirebase, 30); return; }
  window.fbSubscribeBooks(function(fsBooks){
    var STATIC = buildStaticBooks();
    var merged = Object.assign({}, STATIC);
    Object.entries(fsBooks).forEach(function(entry){
      var id=entry[0], d=entry[1];
      if(d.deleted) delete merged[id];
      else merged[id] = Object.assign({}, merged[id]||{}, d);
    });
    BOOKS = merged;
    buildShelf();
  });
})();

/* ═══ ADMIN: CRUD LIBRI ═══ */
let _editingBookId = null;
function openBookEdit(id){
  _editingBookId = id;
  var isNew = !id;
  document.getElementById('book-edit-title').textContent = isNew ? 'Nuovo Libro' : 'Modifica Libro';
  document.getElementById('be-delete-btn').style.display = isNew ? 'none' : 'block';
  var b = id ? (BOOKS[id]||{}) : {};
  document.getElementById('be-title').value = b.title || '';
  document.getElementById('be-cover').value = b.cover || '';
  document.getElementById('be-paragraphs').value = (b.paragraphs||[]).join('\n\n');
  document.getElementById('be-locked').checked = b.locked === true;
  document.getElementById('book-edit-overlay').classList.add('open');
  document.getElementById('book-edit-modal').classList.add('open');
}
function closeBookEdit(){
  document.getElementById('book-edit-overlay').classList.remove('open');
  document.getElementById('book-edit-modal').classList.remove('open');
  _editingBookId = null;
}
function saveBookFromModal(){
  if(!window.fbIsAdmin) return;
  var title = document.getElementById('be-title').value.trim();
  var cover = document.getElementById('be-cover').value.trim();
  var paragraphs = document.getElementById('be-paragraphs').value
    .split(/\n\s*\n/).map(function(p){return p.trim();}).filter(Boolean);
  var locked = document.getElementById('be-locked').checked;
  if(!title || !cover || !paragraphs.length){ alert('Titolo, copertina e testo sono obbligatori.'); return; }
  var id = _editingBookId;
  var extra = {};
  if(!id){
    id = 'b_' + Date.now();
    extra = { order: Date.now() };
  }
  window.fbSaveBook(id, Object.assign({title, cover, paragraphs, locked}, extra))
    .catch(function(e){ alert('Errore nel salvataggio: '+e.message); });
  closeBookEdit();
}
function toggleBookLocked(id){
  if(!window.fbIsAdmin) return;
  var b = BOOKS[id]; if(!b) return;
  window.fbSaveBook(id, {locked: b.locked !== true})
    .catch(function(e){ alert('Errore nel salvataggio: '+e.message); });
}
function deleteBook(id){
  if(!window.fbIsAdmin || !confirm('Eliminare definitivamente questo libro?')) return;
  window.fbSaveBook(id, {deleted:true})
    .catch(function(e){ alert('Errore nel salvataggio: '+e.message); });
}
function deleteBookFromModal(){
  if(_editingBookId) deleteBook(_editingBookId);
  closeBookEdit();
}

/* ═══ READER MIGLIORATO ═══ */
var _curBook=null,_pageTexts=[],_curPage=0,_isFlipping=false;
var overlay=document.getElementById('book-reader-overlay');

function openBook(id){
  _curBook=BOOKS[id];
  if(!_curBook||_curBook.locked===true)return;
  _pageTexts=[];_curPage=0;
  overlay.classList.add('open');
  requestAnimationFrame(function(){overlay.classList.add('visible');});
  if(_curBook.cover){
    document.getElementById('book-cover-img').src=_curBook.cover;
    document.getElementById('book-cover-page').style.display='flex';
    document.getElementById('book-reading').style.display='none';
  }else{startReading();}
}
function startReading(){
  document.getElementById('book-cover-page').style.display='none';
  document.getElementById('book-reading').style.display='flex';
  _curPage=0;
  // misura immediata su due frame per avere le dimensioni reali
  requestAnimationFrame(function(){requestAnimationFrame(function(){buildLayout();renderSpread();});});
}
function showCover(){
  document.getElementById('book-reading').style.display='none';
  document.getElementById('book-cover-page').style.display='flex';
}
function closeBook(){
  overlay.classList.remove('visible');
  setTimeout(function(){overlay.classList.remove('open');_curBook=null;_pageTexts=[];},280);
}
overlay.addEventListener('click',function(e){if(e.target===this)closeBook();});
document.addEventListener('keydown',function(e){
  if(!overlay.classList.contains('open'))return;
  if(e.key==='Escape')closeBook();
  else if(e.key==='ArrowRight')turnPage(1);
  else if(e.key==='ArrowLeft')goPrev();
});

function buildLayout(){
  if(!_curBook||!_curBook.paragraphs)return;
  var pageEl=document.getElementById('book-page-left');
  var h=pageEl.offsetHeight||Math.round(window.innerHeight*0.74);
  var w=pageEl.offsetWidth||Math.round(window.innerWidth*0.36);
  var availH=h-170;
  var availW=w-110;
  var m=document.createElement('div');
  m.style.cssText='position:fixed;top:-9999px;left:-9999px;width:'+availW+'px;font-family:Georgia,"Times New Roman",serif;font-size:1.05rem;line-height:1.9;';
  document.body.appendChild(m);
  _pageTexts=[];
  var paras=_curBook.paragraphs.slice(),i=0;
  while(i<paras.length){
    var pg=[];
    while(i<paras.length){
      var testHtml=pg.concat(paras[i]).join('\n\n');
      m.innerHTML='<p style="margin:.7rem 0">'+testHtml.replace(/\n\n/g,'</p><p style="margin:.7rem 0">').replace(/\n/g,'<br>')+'</p>';
      if(m.scrollHeight>availH&&pg.length>0)break;
      pg.push(paras[i++]);
    }
    if(pg.length===0&&i<paras.length)pg.push(paras[i++]);
    _pageTexts.push(pg.join('\n\n'));
  }
  document.body.removeChild(m);
}
function fmt(t){return t?'<p>'+t.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>':'';}
function renderSpread(){
  if(!_curBook)return;
  var tot=_pageTexts.length,li=_curPage,ri=_curPage+1;
  document.getElementById('bpl-title').textContent=_curBook.title;
  document.getElementById('bpr-title').textContent=_curBook.title;
  document.getElementById('bpl-text').innerHTML=fmt(_pageTexts[li]||'');
  document.getElementById('bpr-text').innerHTML=ri<tot?fmt(_pageTexts[ri]):'';
  document.getElementById('bpl-num').textContent=li+1;
  document.getElementById('bpr-num').textContent=ri<tot?ri+1:'';
  document.getElementById('book-page-info').textContent=(Math.floor(_curPage/2)+1)+' / '+Math.ceil(tot/2);
  document.getElementById('btn-next').disabled=ri>=tot;
  var prev=document.getElementById('btn-prev');
  prev.disabled=(_curPage===0&&!_curBook.cover);
}
function goPrev(){
  if(_curPage===0){if(_curBook.cover)showCover();return;}
  turnPage(-1);
}
function makeFlipFace(text,num,isBack){
  var d=document.createElement('div');
  d.className='book-page '+(isBack?'book-flip-back':'book-flip-front');
  var t=document.createElement('div');t.className='book-page-title';t.textContent=_curBook.title;
  var c=document.createElement('div');c.className='book-page-content';c.innerHTML=fmt(text);
  var n=document.createElement('div');n.className='book-page-num';n.textContent=num||'';
  d.appendChild(t);d.appendChild(c);d.appendChild(n);
  return d;
}
function turnPage(d){
  if(!_curBook||_isFlipping)return;
  var n=_curPage+d*2;
  if(n<0||n>=_pageTexts.length)return;
  _isFlipping=true;
  var bo=document.getElementById('book-open');
  var fwd=d>0,tot=_pageTexts.length,DUR=420;
  var fw=document.createElement('div');
  fw.className='book-flip-wrap';
  fw.style.cssText=fwd?'left:50%':'left:0';
  var fi=document.createElement('div');
  fi.className='book-flip-inner';
  fi.style.transformOrigin=fwd?'left center':'right center';
  var frontIdx=fwd?_curPage+1:_curPage;
  var backIdx=fwd?n:n+1;
  fi.appendChild(makeFlipFace(_pageTexts[frontIdx]||'',frontIdx+1,false));
  fi.appendChild(makeFlipFace(backIdx<tot?_pageTexts[backIdx]:'',backIdx<tot?backIdx+1:'',true));
  fw.appendChild(fi);bo.appendChild(fw);
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    fi.style.transition='transform '+DUR+'ms cubic-bezier(.4,.0,.2,1)';
    fi.style.transform=fwd?'rotateY(-180deg)':'rotateY(180deg)';
  });});
  setTimeout(function(){_curPage=n;renderSpread();},DUR*0.45);
  setTimeout(function(){if(fw.parentNode)bo.removeChild(fw);_isFlipping=false;},DUR+20);
}
window.addEventListener('resize',function(){if(_curBook&&document.getElementById('book-reading').style.display==='flex'){buildLayout();renderSpread();}});
</script>
