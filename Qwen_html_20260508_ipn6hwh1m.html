<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script>
// 🔑 CONFIG FIREBASE (INCASSA QUI SOLO LE RIGHE TRA { } DELLA TUA CONSOLE)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD...",
  authDomain: "tuo-progetto.firebaseapp.com",
  projectId: "tuo-progetto",
  storageBucket: "tuo-progetto.appspot.com",
  messagingSenderId: "123...",
  appId: "1:123:web:abc..."
};

const DATA = {
  indizi:["Acqua Santa","Ostia","Lapide","Attrezzi","Spazzola","Candele","Rosario","Pentacolo","Veste","Straccio","Colla","Sale","Veleno","Lettere","Tappeto","Corona","Ascia","Cappio","Libri","Trofeo","Incenso","Catene","Cera","Lucchetto","Bambola di Pezza","Lente di Vetro","Forbici","Mannaia","Martello","Diario","Lampada","Gomitolo","Armadio","Pennelli","Mappamondo","Crocifisso","Inchiostro","Armatura","Secchio","Calamaio"],
  malefici:["Osservazione","Rimozione","Sostituzione","Protezione"],
  reliquie:["Grimorio","Maschera","Dipinto","Orologio","Anfora","Pugnale","Chiave","Marionetta","Clessidra","Fotografia","Sfera di Vetro","Bussola","Specchio","Statua","Carillon","Telefono","Pianta","Sarcofago","Matriosca","Tarocchi"],
  missioni:["Il Lutto","Il Tradimento","Il Flashback","La Profezia","Il Riflesso","La Soglia","Il Silenzio","Le Déjà-vu"],
  domini:["Maniero","Cimitero","Manicomio","Luna Park","Orfanotrofio","Villaggio","Castello","Crociera","Albergo","Museo"]
};
const THRESH = {4:{w:22,a1:6,a2:14}};

let db, auth, pid, myName="", game=null, soloMode=true;
const el = id => document.getElementById(id);
const logMsg = msg => { 
  if(!game) return;
  game.log.push(msg); 
  el("logBox").innerHTML = game.log.slice(-12).reverse().map(l=>`<div>${l}</div>`).join(""); 
};
const showError = msg => { el("errorBox").textContent=msg; el("errorBox").style.display="block"; console.error(msg); };
const delay = ms => new Promise(res => setTimeout(res, ms));
const rand = arr => arr[Math.floor(Math.random()*arr.length)];
const genId = () => Date.now().toString(36) + Math.random().toString(36).substr(2,5);
const genCard = () => ({
  id: genId(), 
  name: rand(DATA.indizi), 
  type: "indizio", 
  symbols: Math.random()>.6 ? ["️","☀️"] : Math.random()>.6 ? ["🌙","🌙"] : ["☀️","🌙"]
});

// 🔧 INIT
try {
  const app = firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore(app);
  auth = firebase.auth(app);
  console.log("✅ Firebase caricato");
} catch(e) { showError("Config Firebase mancante."); }

async function init() {
  if(!db || !auth) return;
  try {
    await auth.signInAnonymously();
    pid = auth.currentUser.uid;
    console.log("👤 Auth ok:", pid);
    
    db.collection("games").doc("main").onSnapshot(doc => {
      if(doc.exists) {
        game = {id:doc.id, ...doc.data()};
        render();
      }
    });
  } catch(e) { showError("Auth fallita: " + e.message); }
}

// 🚪 JOIN & START (CORRETTO)
window.joinLobby = async () => {
  myName = el("nameInput").value.trim() || "Giocatore";
  soloMode = el("soloMode").checked;
  
  const btn = el("joinBtn");
  btn.textContent = "Avvio in corso...";
  btn.disabled = true;
  el("statusBox").innerHTML += `<div>⏳ Creazione partita...</div>`;

  try {
    if(!pid) throw new Error("ID giocatore non disponibile. Ricarica la pagina.");
    
    const players = {};
    players[pid] = { name:myName, identity:null, relic:null, mission:null, hand:{indizi:[],malefici:[]}, location:"together", darkPawns:0, hasPlayed:false, isBot:false };

    if(soloMode) {
      const bots = ["Soldato AI","Detective AI","Ramingo AI"];
      bots.forEach(n => {
        players[genId()] = { name:n, identity: Math.random()>.5?"Innocente":"Corrotto", relic:rand(DATA.reliquie), mission:rand(DATA.missioni), hand:{indizi:[genCard(),genCard(),genCard()],malefici:[{id:genId(),name:rand(DATA.malefici),type:"maleficio"}]}, location:"together", darkPawns:0, hasPlayed:false, isBot:true };
      });
    }

    const domain = rand(DATA.domini);
    await db.collection("games").doc("main").set({
      phase:"playing",
      domain: domain,
      players,
      round:1,
      act:1,
      turn:pid,
      scale:{sun:0,moon:0},
      log:[`🌙 Inizio partita. Dominio: ${domain}`]
    });
    
    el("statusBox").innerHTML += `<div>✅ Partita avviata con successo!</div>`;
  } catch(e) {
    showError("Errore avvio: " + e.message);
    console.error(e);
    btn.textContent = "Entra & Avvia";
    btn.disabled = false;
  }
};

// 🔄 RENDER
function render() {
  if(!game) return;
  el("lobby").classList.toggle("hidden", game.phase==="playing");
  el("game").classList.toggle("hidden", game.phase!=="playing");

  if(game.phase==="playing") {
    const p = game.players[pid] || {hand:{indizi:[],malefici:[]}, location:"together", darkPawns:0, hasPlayed:false, identity:"?", mission:"?", relic:"?"};
    const th = THRESH[Object.keys(game.players).length] || THRESH[4];
    el("actInfo").textContent = `Atto ${game.act} | Round ${game.round}`;
    el("turnInfo").textContent = `Turno: ${game.turn===pid?"TUO":game.players[game.turn]?.name}`;
    el("sunVal").textContent = game.scale.sun; el("moonVal").textContent = game.scale.moon;
    el("threshVal").textContent = th.w;
    el("sunBar").style.width = `${(game.scale.sun/th.w)*100}%`;
    el("moonBar").style.width = `${(game.scale.moon/th.w)*100}%`;
    
    el("handIndizi").innerHTML = p.hand.indizi.map(c=>`<div class="hand-item ${p.hasPlayed?'disabled':''}" onclick="selectCard('${c.id}')">${c.name}<div class="text-xs text-muted">${c.symbols.join("")}</div></div>`).join("") || "<div class='text-muted'>Mano vuota</div>";
    el("handMalefici").innerHTML = p.hand.malefici.map(c=>`<div class="hand-item" onclick="useMaleficio('${c.id}')">💀 ${c.name}</div>`).join("") || "<div class='text-muted'>Nessun maleficio</div>";
    el("pInfo").innerHTML = `Identità: <span class="${p.identity==='Corrotto'?'text-red-400':'text-green-400'}">${p.identity}</span><br>Reliquia: ${p.relic||"-" }<br>Missione: ${p.mission||"-"}<br>Pegni Oscuri: ${p.darkPawns}`;
    el("botList").innerHTML = Object.values(game.players).filter(b=>b.isBot).map(b=>`<div class="bot-tag">${b.name} (${b.identity}) 🌙${b.darkPawns}</div>`).join("");
    el("logStatus").textContent = p.hasPlayed ? "✅ In attesa degli avversari..." : "Seleziona un Indizio e premi Gioca.";
  }
}

window.toggleLoc = async () => {
  if(!game || !game.players[pid]) return;
  const newLoc = game.players[pid].location==="together"?"isolated":"together";
  await db.collection("games").doc("main").update({[`players.${pid}.location`]: newLoc});
  logMsg(`${myName} si ${newLoc==="together"?"riunisce al gruppo":"isola"}`);
};

window.selectCard = id => { console.log("Carta selezionata:", id); };
window.useMaleficio = id => { alert("Maleficio usato (logica da espandere)"); };

// AVVIO
init();
</script>
