<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUSKLORE - Playtest Solitario</title>
<style>
  :root{--bg:#0a0a0f;--card:#15151e;--border:#2a2a3a;--sun:#fbbf24;--moon:#a78bfa;--accent:#7c3aed;--text:#e5e7eb;--muted:#9ca3af}
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding:1rem}
  .container{max-width:1000px;margin:0 auto}
  .btn{background:var(--accent);color:#fff;border:none;padding:.6rem 1.2rem;border-radius:.5rem;cursor:pointer;font-weight:600;font-size:1rem;margin:.5rem}
  .btn:hover{opacity:.9}.btn:disabled{opacity:.4;cursor:not-allowed}
  .card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1rem;margin-bottom:1rem}
  input,select{background:#111827;border:1px solid #374151;color:#fff;padding:.6rem;border-radius:.5rem;width:100%;max-width:300px;margin:.5rem auto;display:block}
  .hidden{display:none}
  .text-sun{color:var(--sun)}.text-moon{color:var(--moon)}.text-muted{color:var(--muted)}
  .log-box{background:#1f2937;border:1px solid #374151;padding:.5rem;border-radius:.5rem;font-size:.85rem;max-height:200px;overflow-y:auto;margin:.5rem 0}
  .log-box div{padding:.25rem 0;border-bottom:1px solid #374151}
  .error{background:#450a0a;color:#fecaca;padding:.8rem;border-radius:.5rem;margin-bottom:1rem;display:none}
  .scale-wrap{height:10px;background:#374151;border-radius:5px;overflow:hidden;display:flex;margin:.5rem 0}
  .sun-bar{background:var(--sun);height:100%;transition:width .3s}
  .moon-bar{background:var(--moon);height:100%;transition:width .3s}
  .hand-item{background:#1f2937;border:1px solid #374151;padding:.5rem;margin:.25rem 0;border-radius:.5rem;cursor:pointer;transition:.2s}
  .hand-item:hover{background:#374151}.hand-item.disabled{opacity:.4;pointer-events:none}
  .bot-tag{display:inline-block;background:#374151;padding:.1rem .4rem;border-radius:.25rem;font-size:.75rem;margin:.2rem}
  .grid{display:grid;gap:1rem}
  @media(min-width:768px){.grid-2{grid-template-columns:1fr 1fr}}
  h1{text-align:center;color:var(--accent);margin-bottom:.5rem}
  .status{background:#1f2937;padding:.5rem;border-radius:.5rem;margin:.5rem 0;font-size:.9rem}
</style>
</head>
<body>
<div class="container">
  <h1>DUSKLORE</h1>
  <p style="text-align:center;color:var(--muted);margin-bottom:1rem">Playtest Solitario con AI</p>
  
  <div id="errorBox" class="error"></div>
  
  <!-- LOBBY -->
  <div id="lobby" class="card" style="text-align:center">
    <h3 style="margin-bottom:1rem">Nuova Partita</h3>
    <input id="nameInput" placeholder="Il tuo nome" value="Giocatore">
    <label style="display:flex;align-items:center;justify-content:center;gap:.5rem;margin:1rem 0;cursor:pointer">
      <input type="checkbox" id="soloMode" checked style="width:auto"> Modalità Solitario (3 AI)
    </label>
    <button class="btn" onclick="startGame()">Inizia Partita</button>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
        <span id="actInfo" style="font-weight:bold">Atto 1 | Round 1</span>
        <span id="domainInfo" class="text-muted"></span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:.5rem">
        <span class="text-sun">☀️ Luce: <span id="sunVal">0</span></span>
        <span class="text-moon">🌙 Ombra: <span id="moonVal">0</span></span>
      </div>
      <div class="scale-wrap">
        <div id="sunBar" class="sun-bar" style="width:0%"></div>
        <div id="moonBar" class="moon-bar" style="width:0%"></div>
      </div>
      <div style="text-align:center;font-size:.85rem" class="text-muted">Soglia vittoria: <span id="threshVal">22</span></div>
      <div id="presagioBox" class="hidden" style="margin-top:.5rem;padding:.5rem;background:#450a0a;border-radius:.5rem;text-align:center">
        🔮 Presagio: <span id="presagioName" class="text-moon"></span>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h4 style="margin-bottom:.5rem">🃏 La tua mano</h4>
        <div id="handIndizi"></div>
        <h5 style="margin:.5rem 0 .25rem;color:#ef4444">💀 Malefici</h5>
        <div id="handMalefici"></div>
        <div id="playerStats" style="margin-top:1rem;padding-top:.5rem;border-top:1px solid var(--border);font-size:.9rem"></div>
      </div>
      
      <div class="card">
        <h4 style="margin-bottom:.5rem">🤖 Avversari AI</h4>
        <div id="botList"></div>
        <div style="margin-top:1rem">
          <button class="btn" onclick="playCard()" id="playBtn" style="width:100%">Gioca Carta & Prosegui</button>
          <button class="btn" onclick="toggleLocation()" style="width:100%;background:#4b5563">Cambia Ubicazione</button>
        </div>
        <div id="turnInfo" style="margin-top:.5rem;text-align:center;font-size:.9rem"></div>
      </div>
    </div>
    
    <div class="card">
      <h4 style="margin-bottom:.5rem">📜 Cronologia</h4>
      <div id="logBox" class="log-box"></div>
    </div>
  </div>
</div>

<script>
// DATI DAL MANUALE
const DATA = {
  indizi:["Acqua Santa","Ostia","Lapide","Attrezzi","Spazzola","Candele","Rosario","Pentacolo","Veste","Straccio","Colla","Sale","Veleno","Lettere","Tappeto","Corona","Ascia","Cappio","Libri","Trofeo","Incenso","Catene","Cera","Lucchetto","Bambola","Lente","Forbici","Mannaia","Martello","Diario","Lampada","Gomitolo","Armadio","Pennelli","Mappamondo","Crocifisso","Inchiostro","Armatura","Secchio","Calamaio"],
  malefici:["Osservazione","Rimozione","Sostituzione","Protezione"],
  reliquie:["Grimorio","Maschera","Dipinto","Orologio","Anfora","Pugnale","Chiave","Marionetta","Clessidra","Fotografia","Sfera","Bussola","Specchio","Statua","Carillon","Telefono","Pianta","Sarcofago","Matriosca","Tarocchi"],
  missioni:["Il Lutto","Il Tradimento","Il Flashback","La Profezia","Il Riflesso","La Soglia","Il Silenzio","Il Déjà-vu"],
  domini:["Maniero","Cimitero","Manicomio","Luna Park","Orfanotrofio","Villaggio","Castello","Crociera","Albergo","Museo"],
  presagi:["Flashback","Confusione","Premonizione","Ferimento","Isolamento","Convergenza","Stallo","Sovversione","Quiete","Panico"]
};

const THRESHOLDS = {4:{win:22,act1:6,act2:14}};

// STATO GIOCO
let game = {
  phase: 'lobby',
  round: 1,
  act: 1,
  domain: '',
  presagio: null,
  scale: { sun: 0, moon: 0 },
  players: {},
  currentPlayer: 'player',
  log: []
};

let playerId = 'player';
let myName = 'Giocatore';

// UTILS
const el = id => document.getElementById(id);
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const log = msg => {
  game.log.push(`[R${game.round}] ${msg}`);
  const logBox = el('logBox');
  if(logBox) logBox.innerHTML = game.log.slice(-15).reverse().map(l => `<div>${l}</div>`).join('');
};

const genCard = (type = 'indizio') => {
  const symbols = Math.random() > 0.6 ? ['☀️','☀️'] : Math.random() > 0.6 ? ['🌙',''] : ['☀️','🌙'];
  return {
    id: Math.random().toString(36).substr(2, 9),
    name: type === 'indizio' ? rand(DATA.indizi) : rand(DATA.malefici),
    type,
    symbols
  };
};

// INIZIO PARTITA
function startGame() {
  try {
    myName = el('nameInput').value || 'Giocatore';
    const soloMode = el('soloMode').checked;
    
    game = {
      phase: 'playing',
      round: 1,
      act: 1,
      domain: rand(DATA.domini),
      presagio: null,
      scale: { sun: 0, moon: 0 },
      players: {},
      currentPlayer: 'player',
      log: [`🌙 Inizio partita nel ${rand(DATA.domini)}`]
    };
    
    // Crea giocatore umano
    game.players[playerId] = {
      name: myName,
      identity: Math.random() > 0.5 ? 'Innocente' : 'Corrotto',
      relic: rand(DATA.reliquie),
      mission: rand(DATA.missioni),
      hand: {
        indizi: [genCard(), genCard(), genCard()],
        malefici: [genCard('maleficio')]
      },
      location: 'together',
      darkPawns: 0,
      hasPlayed: false,
      isBot: false
    };
    
    // Crea bot se modalità solitaria
    if(soloMode) {
      const botNames = ['Soldato AI', 'Detective AI', 'Ramingo AI'];
      botNames.forEach((name, i) => {
        const botId = `bot${i}`;
        game.players[botId] = {
          name,
          identity: Math.random() > 0.5 ? 'Innocente' : 'Corrotto',
          relic: rand(DATA.reliquie),
          mission: rand(DATA.missioni),
          hand: {
            indizi: [genCard(), genCard(), genCard()],
            malefici: [genCard('maleficio')]
          },
          location: 'together',
          darkPawns: 0,
          hasPlayed: false,
          isBot: true
        };
      });
    }
    
    showGame();
    log(`Partita iniziata! Dominio: ${game.domain}`);
    render();
  } catch(e) {
    showError('Errore avvio: ' + e.message);
    console.error(e);
  }
}

function showGame() {
  el('lobby').classList.add('hidden');
  el('game').classList.remove('hidden');
  el('domainInfo').textContent = game.domain;
}

function showError(msg) {
  const errBox = el('errorBox');
  if(errBox) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
    setTimeout(() => errBox.style.display = 'none', 5000);
  }
  console.error(msg);
}

// GIOCA CARTA
function playCard() {
  try {
    const player = game.players[playerId];
    if(!player) throw new Error('Giocatore non trovato');
    if(player.hasPlayed) {
      alert('Hai già giocato in questo round!');
      return;
    }
    
    if(player.hand.indizi.length === 0) {
      alert('Nessun indizio disponibile!');
      return;
    }
    
    // Prendi prima carta (semplificato)
    const card = player.hand.indizi[0];
    player.hand.indizi.shift();
    
    // Calcola effetto sulla bilancia
    const isPureSun = card.symbols.every(s => s === '☀️');
    const isPureMoon = card.symbols.every(s => s === '🌙');
    
    if(isPureSun) {
      game.scale.sun += 2;
      if(game.scale.moon > 0) game.scale.moon--;
      log(`${myName} gioca ${card.name} (+2 ☀️, -1 🌙)`);
    } else if(isPureMoon) {
      game.scale.moon += 2;
      player.darkPawns++;
      if(game.scale.sun > 0) game.scale.sun--;
      log(`${myName} gioca ${card.name} (+2 🌙, -1 ☀️, +1 Pegno Oscuro)`);
    } else {
      game.scale.sun++;
      game.scale.moon++;
      player.darkPawns++;
      log(`${myName} gioca ${card.name} (+1 ☀️, +1 🌙, +1 Pegno Oscuro)`);
    }
    
    player.hasPlayed = true;
    
    // Pesca nuova carta
    if(player.hand.indizi.length < 3) {
      player.hand.indizi.push(genCard());
    }
    
    // Controlla fine atto
    checkActEnd();
    
    // Esegui turni AI
    setTimeout(() => runAITurns(), 500);
    
    render();
  } catch(e) {
    showError('Errore giocata: ' + e.message);
    console.error(e);
  }
}

// TURNI AI
async function runAITurns() {
  const bots = Object.values(game.players).filter(p => p.isBot && !p.hasPlayed);
  
  for(const bot of bots) {
    await new Promise(r => setTimeout(r, 600));
    
    // AI sceglie carta in base all'identità
    const wantsMoon = bot.identity === 'Corrotto';
    let cardIndex = bot.hand.indizi.findIndex(c => 
      wantsMoon ? c.symbols.includes('🌙') : c.symbols.includes('☀️')
    );
    if(cardIndex === -1) cardIndex = 0;
    
    const card = bot.hand.indizi[cardIndex];
    bot.hand.indizi.splice(cardIndex, 1);
    
    const isPureSun = card.symbols.every(s => s === '☀️');
    const isPureMoon = card.symbols.every(s => s === '🌙');
    
    if(isPureSun) {
      game.scale.sun += 2;
      if(game.scale.moon > 0) game.scale.moon--;
    } else if(isPureMoon) {
      game.scale.moon += 2;
      bot.darkPawns++;
      if(game.scale.sun > 0) game.scale.sun--;
    } else {
      game.scale.sun++;
      game.scale.moon++;
      bot.darkPawns++;
    }
    
    bot.hasPlayed = true;
    if(bot.hand.indizi.length < 3) bot.hand.indizi.push(genCard());
    
    log(`🤖 ${bot.name} (${bot.identity}) gioca ${card.name}`);
    checkActEnd();
  }
  
  // Avanza round
  setTimeout(() => advanceRound(), 500);
}

function advanceRound() {
  game.round++;
  
  // Reset hasPlayed e pesca per tutti
  Object.values(game.players).forEach(p => {
    p.hasPlayed = false;
    while(p.hand.indizi.length < 3) {
      p.hand.indizi.push(genCard());
    }
  });
  
  // Presagio dal round 2
  if(game.round === 2 && !game.presagio) {
    game.presagio = rand(DATA.presagi);
    log(`🔮 Presagio: ${game.presagio}`);
  }
  
  // Controlla atto
  const th = THRESHOLDS[4];
  const total = game.scale.sun + game.scale.moon;
  if(total >= th.act1 && game.act === 1) {
    game.act = 2;
    log(`⚡ ATTO 2 INIZIATO!`);
  } else if(total >= th.act2 && game.act === 2) {
    game.act = 3;
    log(`⚡ ATTO 3 INIZIATO!`);
  }
  
  render();
}

function checkActEnd() {
  const th = THRESHOLDS[4];
  const total = game.scale.sun + game.scale.moon;
  
  if(total >= th.win) {
    const winner = game.scale.sun > game.scale.moon ? 'INNOCENTI' : 'CORROTTI';
    log(`🏆 VITTORIA: ${winner}!`);
    setTimeout(() => {
      alert(`Partita terminata! Vincitori: ${winner}`);
      location.reload();
    }, 1000);
  }
}

function toggleLocation() {
  const player = game.players[playerId];
  player.location = player.location === 'together' ? 'isolated' : 'together';
  log(`${myName} si ${player.location === 'together' ? 'riunisce al gruppo' : 'isola'}`);
  render();
}

// RENDER UI
function render() {
  const player = game.players[playerId];
  if(!player) return;
  
  const th = THRESHOLDS[4];
  const total = game.scale.sun + game.scale.moon;
  
  // Info atto/round
  el('actInfo').textContent = `Atto ${game.act} | Round ${game.round}`;
  el('sunVal').textContent = game.scale.sun;
  el('moonVal').textContent = game.scale.moon;
  el('threshVal').textContent = th.win;
  
  // Barre
  const sunPct = (game.scale.sun / th.win) * 100;
  const moonPct = (game.scale.moon / th.win) * 100;
  el('sunBar').style.width = `${sunPct}%`;
  el('moonBar').style.width = `${moonPct}%`;
  
  // Presagio
  if(game.presagio) {
    el('presagioBox').classList.remove('hidden');
    el('presagioName').textContent = game.presagio;
  }
  
  // Mano indizi
  const handDiv = el('handIndizi');
  if(handDiv) {
    handDiv.innerHTML = player.hand.indizi.map(c => `
      <div class="hand-item ${player.hasPlayed ? 'disabled' : ''}" onclick="selectCard('${c.id}')">
        <div style="font-weight:bold">${c.name}</div>
        <div style="font-size:.85rem;color:var(--muted)">${c.symbols.join(' ')}</div>
      </div>
    `).join('') || '<div class="text-muted">Nessun indizio</div>';
  }
  
  // Malefici
  const malefDiv = el('handMalefici');
  if(malefDiv) {
    malefDiv.innerHTML = player.hand.malefici.map(c => `
      <div class="hand-item" style="border-color:#ef4444">
        <div style="color:#ef4444">💀 ${c.name}</div>
      </div>
    `).join('') || '<div class="text-muted">Nessun maleficio</div>';
  }
  
  // Stats giocatore
  el('playerStats').innerHTML = `
    <div><strong>Identità:</strong> <span class="${player.identity === 'Corrotto' ? 'text-moon' : 'text-sun'}">${player.identity}</span></div>
    <div><strong>Reliquia:</strong> ${player.relic}</div>
    <div><strong>Missione:</strong> ${player.mission}</div>
    <div><strong>Ubicazione:</strong> ${player.location === 'together' ? '👥 Insieme' : '🔒 Isolato'}</div>
    <div><strong>Pegni Oscuri:</strong> ${player.darkPawns}</div>
  `;
  
  // Bot
  const bots = Object.values(game.players).filter(p => p.isBot);
  el('botList').innerHTML = bots.map(b => `
    <div class="bot-tag">${b.name} (${b.identity}) 🌙${b.darkPawns}</div>
  `).join('');
  
  // Turno
  el('turnInfo').textContent = player.hasPlayed ? 
    '✅ Hai giocato. Attendi gli avversari...' : 
    '🎯 Il tuo turno: gioca un indizio';
  
  // Bottone
  el('playBtn').disabled = player.hasPlayed;
}

function selectCard(cardId) {
  // Funzione placeholder per selezione specifica
  console.log('Carta selezionata:', cardId);
}

// Init
window.onload = () => {
  console.log('✅ DUSKLORE caricato');
};
</script>
</body>
</html>
