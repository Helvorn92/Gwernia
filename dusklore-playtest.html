<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dusklore Playtest</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f0518;
            --bg-panel: rgba(20, 10, 35, 0.85);
            --text-main: #e0d8c0;
            --text-muted: #a89f85;
            --accent-gold: #c9a558;
            --accent-gold-light: #e9c97a;
            --accent-purple: #4a2b6e;
            --border-color: rgba(195, 184, 159, 0.3);
            --glow: 0 0 15px rgba(201, 165, 88, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(74, 43, 110, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(201, 165, 88, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, .btn {
            font-family: 'Cinzel', serif;
        }

        /* --- UI Components --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0.5;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-gold), #a68535);
            color: #1a0f00;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(201, 165, 88, 0.4);
            background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
        }

        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* --- Header --- */
        header {
            text-align: center;
            padding: 2rem 0;
            margin-bottom: 1rem;
        }

        header h1 {
            font-size: 3rem;
            color: var(--accent-gold-light);
            text-shadow: 0 0 20px rgba(201, 165, 88, 0.5);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            font-style: italic;
            font-size: 1.2rem;
        }

        /* --- Game Area --- */
        #game-area {
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .turn-indicator {
            font-size: 1.5rem;
            color: var(--accent-gold);
        }

        /* Board */
        .board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .field {
            min-height: 200px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-content: flex-start;
            transition: background 0.3s;
        }

        .field.enemy {
            background: rgba(60, 20, 20, 0.2);
        }

        .field.player {
            background: rgba(20, 40, 60, 0.2);
        }

        .field-label {
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Cards */
        .card {
            width: 100px;
            height: 140px;
            background: linear-gradient(160deg, #2a1f35, #150e20);
            border: 1px solid var(--accent-gold);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 10px 20px rgba(201, 165, 88, 0.3);
            z-index: 10;
            border-color: var(--accent-gold-light);
        }

        .card.selected {
            box-shadow: 0 0 15px var(--accent-gold);
            border-color: #fff;
            transform: translateY(-15px);
        }

        .card-cost {
            position: absolute;
            top: -5px;
            left: -5px;
            background: var(--accent-purple);
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border: 1px solid var(--accent-gold);
            font-size: 0.8rem;
        }

        .card-image {
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .card-name {
            font-size: 0.8rem;
            text-align: center;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.1;
        }

        .card-stats {
            display: flex;
            gap: 5px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .stat-atk { color: #ff6b6b; }
        .stat-hp { color: #51cf66; }

        /* Hand */
        .hand-container {
            margin-top: auto;
        }
        
        .hand {
            display: flex;
            justify-content: center;
            gap: 10px;
            min-height: 150px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        /* Start Screen Overlay */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 24, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .logo-large {
            font-size: 4rem;
            color: var(--accent-gold);
            margin-bottom: 2rem;
            text-shadow: 0 0 30px rgba(201, 165, 88, 0.6);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 20px rgba(201, 165, 88, 0.4); }
            50% { text-shadow: 0 0 40px rgba(201, 165, 88, 0.8); }
            100% { text-shadow: 0 0 20px rgba(201, 165, 88, 0.4); }
        }

        .resource-display {
            font-size: 1.2rem;
            color: var(--accent-gold-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .resource-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: var(--accent-purple);
            border: 1px solid var(--accent-gold);
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .board { grid-template-columns: 1fr; }
            header h1 { font-size: 2rem; }
            .card { width: 80px; height: 110px; }
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1 class="logo-large">DUSKLORE</h1>
        <p style="margin-bottom: 2rem; color: var(--text-muted); font-size: 1.2rem;">Playtest Edition</p>
        <button class="btn" onclick="showNewGame()">Inizia Partita</button>
    </div>

    <div class="container">
        <header>
            <h1>DUSKLORE</h1>
            <p>Battle for the Shattered Realm</p>
        </header>

        <div id="game-area">
            <!-- Top Bar: Resources & Turn -->
            <div class="panel top-bar">
                <div class="resource-display">
                    Mana: <span id="player-mana">0</span>/ <span id="player-max-mana">0</span>
                    <span class="resource-icon">M</span>
                </div>
                <div class="turn-indicator" id="turn-text">Turno del Giocatore</div>
                <button class="btn" id="end-turn-btn" onclick="endTurn()">Termina Turno</button>
            </div>

            <!-- Board -->
            <div class="board">
                <!-- Enemy Field -->
                <div class="field enemy" id="enemy-field">
                    <div class="field-label">Campo Nemico</div>
                    <!-- Cards injected by JS -->
                </div>

                <!-- Player Field -->
                <div class="field player" id="player-field">
                    <div class="field-label">Il Tuo Campo</div>
                    <!-- Cards injected by JS -->
                </div>
            </div>

            <!-- Hand -->
            <div class="panel hand-container">
                <div class="field-label" style="margin-bottom: 10px;">La Tua Mano</div>
                <div class="hand" id="player-hand">
                    <!-- Cards injected by JS -->
                </div>
            </div>

            <!-- Game Log / Info -->
            <div class="panel" style="margin-top: 20px; min-height: 100px;">
                <h3 style="color: var(--accent-gold); margin-bottom: 10px;">Registro di Battaglia</h3>
                <div id="game-log" style="font-size: 0.95rem; color: var(--text-muted); height: 80px; overflow-y: auto;">
                    Benvenuto in Dusklore. La partita è iniziata.
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Game State ---
        const gameState = {
            turn: 1,
            isPlayerTurn: true,
            player: {
                mana: 1,
                maxMana: 1,
                hand: [],
                field: [],
                deck: []
            },
            enemy: {
                mana: 1,
                maxMana: 1,
                hand: [],
                field: [],
                deck: []
            },
            selectedCardIndex: null
        };

        // --- Card Database ---
        const cardDatabase = [
            { id: 1, name: "Guardia d'Ombra", cost: 1, atk: 2, hp: 1, icon: "🗡️" },
            { id: 2, name: "Mago Crepuscolare", cost: 2, atk: 3, hp: 2, icon: "🔮" },
            { id: 3, name: "Golem di Pietra", cost: 3, atk: 2, hp: 5, icon: "🛡️" },
            { id: 4, name: "Spettro Urlante", cost: 2, atk: 1, hp: 3, icon: "👻" },
            { id: 5, name: "Drago Antico", cost: 5, atk: 6, hp: 6, icon: "🐉" },
            { id: 6, name: "Assassino Veloce", cost: 1, atk: 1, hp: 2, icon: "🗡️" },
            { id: 7, name: "Chierica della Luce", cost: 3, atk: 2, hp: 4, icon: "✨" }
        ];

        // --- Core Functions ---

        function showNewGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-area').style.display = 'flex';
            initGame();
        }

        function initGame() {
            // Reset state
            gameState.turn = 1;
            gameState.isPlayerTurn = true;
            gameState.player.mana = 1;
            gameState.player.maxMana = 1;
            gameState.player.hand = [];
            gameState.player.field = [];
            gameState.enemy.hand = [];
            gameState.enemy.field = [];
            
            // Create Decks
            gameState.player.deck = createDeck();
            gameState.enemy.deck = createDeck();

            // Draw initial hands (3 cards)
            for(let i=0; i<3; i++) {
                drawCard('player');
                drawCard('enemy');
            }

            log("Nuova partita iniziata! Sei al turno 1.");
            updateUI();
        }

        function createDeck() {
            let deck = [];
            for(let i=0; i<20; i++) {
                const randomCard = cardDatabase[Math.floor(Math.random() * cardDatabase.length)];
                // Clone object to avoid reference issues
                deck.push({ ...randomCard, uid: Math.random().toString(36).substr(2, 9) });
            }
            return deck;
        }

        function drawCard(who) {
            const deck = gameState[who].deck;
            const hand = gameState[who].hand;
            
            if(deck.length > 0 && hand.length < 6) {
                const card = deck.pop();
                hand.push(card);
                if(who === 'player') log(`Hai pescato: ${card.name}`);
            } else if (deck.length === 0) {
                if(who === 'player') log("Il tuo mazzo è esaurito! Subisci danno da fatica (non implementato).");
            }
        }

        function playCard(index) {
            if(!gameState.isPlayerTurn) return;

            const card = gameState.player.hand[index];
            
            if(gameState.player.mana >= card.cost) {
                // Pay cost
                gameState.player.mana -= card.cost;
                
                // Move to field
                gameState.player.hand.splice(index, 1);
                gameState.player.field.push(card);
                
                gameState.selectedCardIndex = null;
                
                log(`Hai giocato: ${card.name}`);
                updateUI();
                
                // Simple AI response trigger could go here, but we wait for End Turn
            } else {
                log("Mana insufficiente!");
            }
        }

        function endTurn() {
            if(!gameState.isPlayerTurn) return;

            gameState.isPlayerTurn = false;
            document.getElementById('end-turn-btn').disabled = true;
            log("Turno terminato. Tocca al nemico...");
            
            // Enemy Turn Logic (Simulated)
            setTimeout(enemyTurn, 1000);
        }

        function enemyTurn() {
            // 1. Increase Mana
            if(gameState.enemy.maxMana < 10) gameState.enemy.maxMana++;
            gameState.enemy.mana = gameState.enemy.maxMana;

            // 2. Draw Card
            drawCard('enemy');
            updateUI();

            // 3. Simple AI: Play cards if possible
            setTimeout(() => {
                const hand = gameState.enemy.hand;
                // Sort hand by cost descending to play big cards first (dumb AI)
                // We iterate backwards because we might splice
                for(let i = hand.length - 1; i >= 0; i--) {
                    if(gameState.enemy.mana >= hand[i].cost && gameState.enemy.field.length < 5) {
                        const card = hand[i];
                        gameState.enemy.mana -= card.cost;
                        gameState.enemy.hand.splice(i, 1);
                        gameState.enemy.field.push(card);
                        log(`Il nemico ha giocato: ${card.name}`);
                        updateUI();
                    }
                }

                // 4. End Enemy Turn
                setTimeout(() => {
                    startPlayerTurn();
                }, 1000);

            }, 1000);
        }

        function startPlayerTurn() {
            gameState.turn++;
            gameState.isPlayerTurn = true;
            
            if(gameState.player.maxMana < 10) gameState.player.maxMana++;
            gameState.player.mana = gameState.player.maxMana;

            drawCard('player');
            
            log(`--- Turno ${gameState.turn} ---`);
            updateUI();
        }

        function log(msg) {
            const logEl = document.getElementById('game-log');
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            logEl.innerHTML += `<div>[${time}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // --- UI Rendering ---

        function updateUI() {
            // Update Resources
            document.getElementById('player-mana').textContent = gameState.player.mana;
            document.getElementById('player-max-mana').textContent = gameState.player.maxMana;
            document.getElementById('turn-text').textContent = gameState.isPlayerTurn ? `Turno ${gameState.turn}: Tu` : `Turno ${gameState.turn}: Nemico`;
            document.getElementById('end-turn-btn').disabled = !gameState.isPlayerTurn;

            // Render Fields
            renderField('player-field', gameState.player.field, true);
            renderField('enemy-field', gameState.enemy.field, false);

            // Render Hand
            renderHand();
        }

        function renderField(elementId, cards, isPlayer) {
            const container = document.getElementById(elementId);
            // Keep the label
            const label = container.querySelector('.field-label');
            container.innerHTML = '';
            container.appendChild(label);

            cards.forEach(card => {
                const cardEl = createCardElement(card, false, -1);
                container.appendChild(cardEl);
            });
        }

        function renderHand() {
            const container = document.getElementById('player-hand');
            container.innerHTML = '';

            gameState.player.hand.forEach((card, index) => {
                const cardEl = createCardElement(card, true, index);
                
                // Highlight if selected
                if(gameState.selectedCardIndex === index) {
                    cardEl.classList.add('selected');
                }

                // Click event
                cardEl.onclick = () => {
                    if(gameState.isPlayerTurn) {
                        if(gameState.selectedCardIndex === index) {
                            gameState.selectedCardIndex = null; // Deselect
                        } else {
                            gameState.selectedCardIndex = index; // Select
                        }
                        updateUI();
                        
                        // Auto play on second click logic handled by a separate button or double click?
                        // Let's add a "Play Selected" logic or just play on click if valid?
                        // For this simple version: Click selects, then click "Play" button? 
                        // Or simpler: Click plays immediately if affordable.
                        
                        // Let's change behavior: Click plays immediately if affordable.
                        playCard(index);
                    }
                };

                container.appendChild(cardEl);
            });
        }

        function createCardElement(card, isClickable, index) {
            const el = document.createElement('div');
            el.className = 'card';
            if(isClickable && gameState.player.mana < card.cost) {
                el.style.opacity = '0.6';
                el.style.cursor = 'not-allowed';
            }

            el.innerHTML = `
                <div class="card-cost">${card.cost}</div>
                <div class="card-image">${card.icon}</div>
                <div class="card-name">${card.name}</div>
                <div class="card-stats">
                    <span class="stat-atk">⚔️${card.atk}</span>
                    <span class="stat-hp">❤️${card.hp}</span>
                </div>
            `;
            return el;
        }

    </script>
</body>
</html>
