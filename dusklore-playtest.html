
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DUSKLORE - App Playtest</title>
<style>
  :root{
    --bg:#08070a;--panel:#151116;--panel2:#211922;--line:#3b2e3e;--text:#f5efe6;--muted:#b7a9b6;
    --sun:#f5c95b;--moon:#8eb7ff;--blood:#b44444;--green:#5cc18a;--gold:#c69b54;--violet:#8f61ff;
    --felt:#183b32;--felt2:#102820;--card:#eadfcb;--ink:#211b18;--shadow:0 18px 50px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 20% 0,#2b1f31 0,#08070a 34rem);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.35}
  button,input,select,textarea{font:inherit}
  button{border:0;cursor:pointer}
  .app{min-height:100svh;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#120f14,#08070a);position:relative;overflow:hidden}
  .screen{min-height:100svh;padding:18px 14px 96px}
  .hidden{display:none!important}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brand{letter-spacing:.18em;font-weight:900;font-size:18px;color:#fff;text-shadow:0 0 22px rgba(142,97,255,.45)}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}
  .btn{border-radius:12px;background:var(--violet);color:#fff;padding:12px 14px;font-weight:800;box-shadow:var(--shadow)}
  .btn.secondary{background:#2a222d;color:var(--text);border:1px solid var(--line);box-shadow:none}
  .btn.good{background:#19704a}.btn.danger{background:#8f3333}.btn.gold{background:#8a632d}.btn:disabled{opacity:.45;cursor:not-allowed}
  .setup-card{margin-top:10svh;border:1px solid var(--line);background:rgba(21,17,22,.92);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
  .setup-card h1{margin:0 0 8px;font-size:32px;letter-spacing:.12em}.setup-card p{margin:0 0 18px;color:var(--muted)}
  .field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
  input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#0f0d11;color:var(--text);padding:12px}
  .slot-list{display:grid;gap:8px;margin:10px 0}.slot-row{display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:center;border:1px solid var(--line);background:#100d12;border-radius:12px;padding:9px}.slot-row b{font-size:13px}.slot-row span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.join-box{border:1px dashed var(--gold);background:rgba(198,155,84,.08);border-radius:14px;padding:10px;margin:10px 0}
  .layout{display:grid;gap:12px}
  .status{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;border:1px solid var(--line);background:rgba(21,17,22,.8);border-radius:16px;padding:10px}
  .score{text-align:center}.score strong{display:block;font-size:23px}.score.sun strong{color:var(--sun)}.score.moon strong{color:var(--moon)}
  .act{text-align:center}.act b{display:block;font-size:12px;color:var(--muted)}.act span{font-weight:900}
  .track{height:10px;background:#28202b;border-radius:99px;overflow:hidden;display:flex;margin-top:7px}.sunbar{background:var(--sun)}.moonbar{background:var(--moon)}
  .table{position:relative;min-height:330px;border:1px solid #285548;border-radius:28px;background:
    radial-gradient(circle at 50% 45%,rgba(255,255,255,.08),transparent 16rem),
    linear-gradient(145deg,var(--felt),var(--felt2));box-shadow:inset 0 0 70px rgba(0,0,0,.45),var(--shadow);padding:14px;overflow:hidden}
  .domain{font-size:12px;color:#d9c7b4;text-align:center;margin-bottom:10px}.domain strong{display:block;font-size:17px;color:#fff}
  .decks{display:flex;justify-content:center;gap:10px;margin:4px 0 12px}
  .deck{width:72px;height:98px;border-radius:10px;border:2px solid rgba(255,255,255,.18);display:grid;place-items:center;text-align:center;font-weight:900;font-size:12px;box-shadow:0 10px 24px rgba(0,0,0,.32);padding:6px}
  .deck.indizi{background:linear-gradient(145deg,#d8c291,#7c5d2f);color:#23160a}.deck.malefici{background:linear-gradient(145deg,#3b1533,#0c0a10);color:#f5d6ff}.deck.reliquie{background:linear-gradient(145deg,#efe5c9,#856739);color:#1c1309}
  .players{display:block}
  .groups-layout{display:grid;gap:8px}
  .group-section{border-radius:14px;padding:8px 10px;border:1px solid rgba(255,255,255,.1)}
  .group-section.together{border-color:rgba(90,200,120,.3);background:rgba(30,70,45,.2)}
  .group-section.isolated-section{border-color:rgba(180,68,68,.28);background:rgba(55,15,15,.18)}
  .group-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:7px;font-weight:800}
  .group-players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
  .player{border:1px solid rgba(255,255,255,.12);background:rgba(7,10,9,.45);border-radius:12px;padding:8px;position:relative}
  .player.active{outline:2px solid var(--gold)}.player.human{background:rgba(56,43,63,.5)}
  .pname{font-weight:900;font-size:13px}.pmeta{color:var(--muted);font-size:11px;margin-top:3px}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.badge{font-size:10px;border:1px solid rgba(255,255,255,.13);border-radius:99px;padding:3px 6px;background:rgba(0,0,0,.22)}
  .table-center{margin:12px auto 0;width:84%;border:1px dashed rgba(255,255,255,.18);border-radius:16px;padding:10px;text-align:center;background:rgba(0,0,0,.14)}
  .covered-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}.mini-card{width:42px;height:58px;border-radius:7px;background:#1d1720;border:1px solid #5e4a64;display:grid;place-items:center;font-size:18px}
  .panel{border:1px solid var(--line);background:rgba(21,17,22,.92);border-radius:16px;padding:12px;box-shadow:0 12px 28px rgba(0,0,0,.22)}
  .panel h3{margin:0 0 8px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}.small{font-size:12px;color:var(--muted)}
  .mission-phase{display:flex;gap:8px;margin:8px 0;align-items:flex-start}.tick{width:26px;height:26px;min-width:26px;border-radius:50%;display:grid;place-items:center;background:#2a222d;border:1px solid var(--line);font-weight:900;cursor:pointer;padding:0;transition:background .15s}.tick:hover{background:#3d2e42}.tick.done{background:var(--green);color:#07140d}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .wide{grid-column:1/-1}
  .hand-wrap{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100vw);background:linear-gradient(180deg,rgba(8,7,10,0),#08070a 16px,#08070a);padding:20px 10px 10px;z-index:5}
  .hand-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px}.hand-head strong{font-size:13px}.hand-tabs{display:none}.tabbtn{border:1px solid var(--line);background:#19131b;color:var(--muted);border-radius:99px;padding:6px 9px;font-size:12px}.tabbtn.active{background:var(--violet);color:#fff}
  .hand{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
  .card{flex:0 0 122px;height:172px;border-radius:12px;background:var(--card);color:var(--ink);padding:10px;box-shadow:0 10px 22px rgba(0,0,0,.38);border:2px solid #f4ead8;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start}
  .card.selected{outline:3px solid var(--violet)}.card.maleficio{background:linear-gradient(160deg,#2a1229,#0d0a10);color:#f6e6ff;border-color:#5f3a65}.card.reaction{outline:3px solid var(--green)}.card.over-limit{border-color:var(--blood)!important;box-shadow:0 0 12px rgba(180,68,68,.4)}
  .card-title{font-weight:900;font-size:15px}.card-type{font-size:10px;color:inherit;opacity:.75;text-transform:uppercase;letter-spacing:.08em}.symbols{font-size:26px;letter-spacing:4px}.card-text{font-size:11px;opacity:.86}
  .toastlog{max-height:150px;overflow:auto;display:grid;gap:6px}.logitem{font-size:12px;color:#d5cad4;border-left:3px solid #5a465e;padding-left:8px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:grid;place-items:end center;z-index:20;padding:14px}
  .sheet{width:min(520px,100%);max-height:86svh;overflow:auto;background:#151116;border:1px solid var(--line);border-radius:20px 20px 14px 14px;padding:16px;box-shadow:var(--shadow)}
  .sheet h2{margin:0 0 8px}.option{width:100%;text-align:left;background:#231b25;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.option:disabled{opacity:.45}.option b{display:block}.option span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  .target-grid{display:grid;gap:8px}.target{background:#241c27;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
  .footer-space{height:224px}
  @media (min-width:760px){.app{max-width:980px}.screen{padding:22px 18px 96px}.layout{grid-template-columns:1.25fr .9fr}.hand-wrap{width:min(980px,100vw)}.card{flex-basis:138px;height:188px}.table{min-height:500px}.players{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
  <section id="setup" class="screen">
    <div class="setup-card">
      <h1>DUSKLORE</h1>
      <p>App solitaria da playtest: tavolo, mano, mazzi, AI, Malefici, Pegni Oscuri, Missioni e fine Atto.</p>
      <div class="field"><label>Nome</label><input id="nameInput" value="Vincenzo"></div>
      <div class="field"><label>Protagonista</label><select id="heroSelect"></select></div>
      <div class="field"><label>Numero giocatori</label><select id="playerCount" onchange="renderSlotSetup()"><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
      <div class="field"><label>Posti al tavolo</label><div id="slotSetup" class="slot-list"></div></div>
      <div id="joinBox" class="join-box hidden"></div>
      <button class="btn wide" style="width:100%" onclick="startGame()">Inizia partita</button>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <div class="topbar">
      <div><div class="brand">DUSKLORE</div><div id="turnLine" class="small"></div></div>
      <div style="display:flex;gap:6px"><button class="pill" onclick="showRoomLink()">Link</button><button class="pill" onclick="openRules()">Regole</button><button class="pill" onclick="resetGame()">Nuova</button></div>
    </div>

    <div class="layout">
      <main>
        <div class="status">
          <div class="score sun"><strong id="sunScore">0</strong><span>Sole</span><div class="track"><div id="sunBar" class="sunbar" style="width:0%"></div></div></div>
          <div class="act"><b id="roundLabel">Round 1</b><span id="actLabel">Prefazione</span><div class="small">Soglia <span id="winThreshold">22</span></div></div>
          <div class="score moon"><strong id="moonScore">0</strong><span>Luna</span><div class="track"><div id="moonBar" class="moonbar" style="width:0%"></div></div></div>
        </div>

        <div class="table" data-testid="table">
          <div class="domain"><strong id="domainName"></strong><span id="domainText"></span></div>
          <div class="decks">
            <button class="deck indizi" onclick="showDeckInfo('indizi')">Mazzo<br>Indizi<br><span id="indiziCount"></span></button>
            <button class="deck malefici" onclick="showDeckInfo('malefici')">Mazzo<br>Malefici<br><span id="maleficiCount"></span></button>
            <button class="deck reliquie" onclick="showDeckInfo('reliquie')">Reliquiario<br><span id="relicCount"></span></button>
            <button class="deck" style="background:linear-gradient(145deg,#2e2020,#100808);color:#c9a8a8;border-color:rgba(180,68,68,.4)" onclick="showDiscard()">Scarti<br>Indizi<br><span id="discardCount">0</span></button>
            <button class="deck" style="background:linear-gradient(145deg,#1a0d2e,#0a0810);color:#d0aaff;border-color:rgba(143,97,255,.4)" onclick="showDiscardMalefici()">Scarti<br>Malefici<br><span id="discardMaleficiCount">0</span></button>
          </div>
          <div id="players" class="players"></div>
          <div class="table-center">
            <div><strong id="presageName">Nessun Presagio</strong></div>
            <div id="presageText" class="small">Il primo round è solo introduzione dei Protagonisti.</div>
            <div class="covered-row" id="coveredRow"></div>
          </div>
        </div>
      </main>

      <aside class="side">
        <div class="panel">
          <h3>Missione segreta</h3>
          <div id="missionTitle" style="font-weight:900"></div>
          <div id="missionRelic" class="small"></div>
          <div id="missionPhases"></div>
        </div>

        <div class="panel">
          <h3>Azioni</h3>
          <div class="actions">
            <button id="playBtn" class="btn good wide" onclick="mainAction()">Prosegui</button>
            <button id="curseBtn" class="btn danger" onclick="openCurse()">Usa Maleficio</button>
            <button id="darkBtn" class="btn gold" onclick="openDarkPawns()">Pegni Oscuri</button>
            <button id="abilityBtn" class="btn wide" style="background:#4a2060" onclick="openAbility()">⚡ Potere</button>
            <button id="scartaBtn" class="btn danger wide hidden" onclick="discardSelected()">🗑 Scarta Indizio Selezionato</button>
          </div>
          <div id="abilityDesc" class="small" style="margin-top:6px;color:var(--muted);font-style:italic;min-height:14px"></div>
          <div id="actionHint" class="small" style="margin-top:4px"></div>
        </div>

        <div class="panel">
          <h3>Cronologia</h3>
          <div id="log" class="toastlog"></div>
        </div>
      </aside>
    </div>
    <div class="footer-space"></div>
  </section>

  <div id="handWrap" class="hand-wrap hidden">
    <div class="hand-head">
      <strong id="handTitle">La tua mano</strong>
      <div class="hand-tabs">
        <button id="tabIndizi" class="tabbtn active" onclick="setHandTab('indizi')">Indizi</button>
        <button id="tabMalefici" class="tabbtn" onclick="setHandTab('malefici')">Malefici</button>
      </div>
    </div>
    <div id="hand" class="hand"></div>
  </div>

  <div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
const DATA={
  indizi:["Acqua Santa","Ostia","Lapide","Attrezzi","Spazzola","Candele","Rosario","Pentacolo","Veste","Straccio","Colla","Sale","Veleno","Lettere","Tappeto","Corona","Ascia","Cappio","Libri","Trofeo","Incenso","Catene","Cera","Lucchetto","Bambola di Pezza","Lente di Vetro","Forbici","Mannaia","Martello","Diario","Lampada","Gomitolo","Armadio","Pennelli","Mappamondo","Crocifisso","Inchiostro","Armatura","Secchio","Calamaio"],
  malefici:{
    "Osservazione":"Guarda la Missione segreta di un Protagonista.",
    "Rimozione":"Sottrai una carta dalla mano di un Protagonista.",
    "Sostituzione":"Scambia la tua Reliquia con quella di un Protagonista.",
    "Protezione":"Reazione: annulla un Maleficio scagliato contro di te."
  },
  reliquie:["Grimorio","Maschera","Dipinto","Orologio","Anfora","Pugnale","Chiave","Marionetta","Clessidra","Fotografia","Sfera di Vetro","Bussola","Specchio","Statua","Carillon","Telefono","Pianta","Sarcofago","Matriosca","Tarocchi"],
  domini:[
    ["Maniero","Un guscio di velluto e polvere dove il silenzio pesa più dell'oro."],["Cimitero","Un giardino di marmo che culla un sonno senza sogni."],["Manicomio","Un labirinto di urla cucite sui muri della mente."],["Luna Park","Un miraggio di neon che maschera il ghigno della ruggine."],["Orfanotrofio","Un nido di brandine fredde, dove il pianto si condensa sulle pareti."],["Villaggio","Un groviglio di case cieche che mastica segreti e sputa sospetti."],["Castello","Una corona di pietra innalzata per difendere paure più antiche dei suoi re."],["Crociera","Un'isola di ferro sospesa su un profondo abisso."],["Albergo","Una prigione di chiavi d'oro e stanze vuote."],["Museo","Un santuario di vetro dove il passato resta immobile per giudicare."]
  ],
  presagi:{
    "Flashback":"Ogni giocatore deve usare il primo Indizio nella pila degli scarti, se presente.",
    "Confusione":"Per questo round l'ordine di narrazione procede in senso contrario.",
    "Premonizione":"Le carte Indizio restano scoperte sul tavolo.",
    "Ferimento":"Per tutto il round, ogni giocatore non può avere più di due Indizi nella mano.",
    "Isolamento":"Chi è insieme deve isolarsi nel proprio turno.",
    "Convergenza":"Chi è isolato deve unirsi nel proprio turno.",
    "Stallo":"Il round va narrato senza usare carte Indizio.",
    "Sovversione":"Pura Luce e Pura Ombra vengono lette al contrario.",
    "Quiete":"Nulla accade.",
    "Panico":"Per tutto il round non possono essere lanciati Malefici."
  },
  heroes:["SOLDATO","DETECTIVE","RAMINGO","MEDIUM","GIORNALISTA","SACERDOTE","FANCIULLO","TURISTA"],
  heroAbilities:{
    "SOLDATO":"Affiancamento: una volta per round puoi unirti o separarti durante il turno altrui.",
    "DETECTIVE":"Ispezione: quando peschi dal Reliquiario guardi 2 carte e ne scegli 1.",
    "RAMINGO":"Recupero: quando peschi Indizi puoi scegliere dalla pila degli scarti.",
    "MEDIUM":"Veggenza: spendi 2 Pegni Oscuri per guardare un'Identità o mostrare la tua.",
    "GIORNALISTA":"Fiuto: quando peschi Indizi guardi 2 carte e ne scegli 1.",
    "SACERDOTE":"Grazia: inizi con Protezione; quando peschi Malefici puoi scegliere Protezione.",
    "FANCIULLO":"Complicità: se sei insieme ad altri puoi scambiare un tuo Indizio con uno casuale.",
    "TURISTA":"Baratto: puoi sacrificare Malefici per ottenere Indizi."
  },
  missions:{
    "Il Lutto":["Introduci una Comparsa e legala emotivamente a un Protagonista.","Usa la Reliquia per causare la morte della Comparsa in presenza di quel Protagonista."],
    "Il Tradimento":["Crea un legame di complicità con un altro Protagonista.","Usa la Reliquia per spezzare quel legame."],
    "Il Flashback":["Narra una scena di almeno cinquant'anni prima con un atto irreparabile.","Nel presente fai compiere a un Protagonista un atto irreparabile con la Reliquia."],
    "La Profezia":["Usa la Reliquia per pronunciare una profezia che coinvolge il gruppo.","Fai in modo che uno dei Protagonisti avveri la profezia."],
    "Il Riflesso":["Usa la Reliquia per clonare la Comparsa di un altro Protagonista.","Spingi quel Protagonista a uccidere la Comparsa invece del clone."],
    "La Soglia":["Usa la Reliquia per aprire un varco surreale ed entraci con un altro Protagonista.","Convinci quel Protagonista a chiuderti in quel luogo."],
    "Il Silenzio":["Usa la Reliquia per convincere un Protagonista a tacere durante tutto il suo turno.","Convinci quel Protagonista che l'unico modo per parlare è rompere la Reliquia."],
    "Il Déjà-vu":["Spingi un Protagonista a fare due volte la stessa azione.","Usa la Reliquia per nullificare l'azione e fargliela ripetere una terza volta."]
  },
  thresholds:{4:[22,6,14],5:[24,7,16],6:[26,8,18],7:[28,9,20],8:[30,10,22]}
};

const FIREBASE_CONFIG={apiKey:"AIzaSyC_KzUfb-6HKFxtN4cRG5DmsjRXtvBlGzg",authDomain:"dusklore-play.firebaseapp.com",projectId:"dusklore-play",storageBucket:"dusklore-play.firebasestorage.app",messagingSenderId:"72568019209",appId:"1:72568019209:web:6dbe34cbebc8ddafc2dbd8"};
let game=null, handTab="all", selectedCard=null, selectedCurse=null, awaitingReaction=null, pendingTurnStart=false, db=null, roomId=null, syncing=false;
const $=id=>document.getElementById(id);
const rand=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const uid=()=>Math.random().toString(36).slice(2,9);
const clientId=localStorage.getItem("dusklore-client")||uid();
localStorage.setItem("dusklore-client",clientId);

function makeDeck(list){return shuffle(list.map(name=>({id:uid(),name})));}
function maleficiPool(){return Array(5).fill(0).flatMap(()=>Object.keys(DATA.malefici));}
function makeIndizio(name){const roll=Math.random();return {id:uid(),type:"indizio",name,symbols:roll<.34?["☀️","☀️"]:roll<.67?["🌙","🌙"]:["☀️","🌙"]};}
function makeMaleficio(name){return {id:uid(),type:"maleficio",name,text:DATA.malefici[name]};}
function drawIndizio(){if(!game.decks.indizi.length) game.decks.indizi=makeDeck(DATA.indizi);return makeIndizio(game.decks.indizi.pop().name);}
function drawMaleficio(name=null){if(name)return makeMaleficio(name); if(!game.decks.malefici.length) game.decks.malefici=makeDeck(maleficiPool()); return makeMaleficio(game.decks.malefici.pop().name);}
function drawRelic(){if(!game.decks.reliquie.length) game.decks.reliquie=makeDeck(DATA.reliquie);return game.decks.reliquie.pop().name;}
function log(msg){game.log.unshift(msg);game.log=game.log.slice(0,60);save();render();}
function save(){
  localStorage.setItem("dusklore-app",JSON.stringify(game));
  if(db&&game?.roomId&&!syncing) db.collection("duskloreRooms").doc(game.roomId).set(game).catch(console.warn);
}

async function initSetup(){
  $("heroSelect").innerHTML=DATA.heroes.map(h=>`<option value="${h}">${h} - ${DATA.heroAbilities[h]}</option>`).join("");
  renderSlotSetup();
  await initRoomSync();
  if(roomId)return;
  const saved=localStorage.getItem("dusklore-app");
  if(saved){try{const parsed=JSON.parse(saved); if(parsed.version===3&&!parsed.ended){game=parsed;showGame();render();beginTurn();} else if(parsed.version===3&&parsed.ended){localStorage.removeItem("dusklore-app");}}catch{}}
}

async function initRoomSync(){
  roomId=new URLSearchParams(location.hash.slice(1)).get("room");
  try{
    if(window.firebase&&!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    if(window.firebase)db=firebase.firestore();
  }catch(e){console.warn("Firebase non disponibile",e)}
  if(roomId){
    $("joinBox").classList.remove("hidden");
    $("joinBox").innerHTML=`<b>Stanza: ${roomId}</b><div class='small'>Caricamento in corso…</div>`;
    if(db){
      db.collection("duskloreRooms").doc(roomId).onSnapshot(doc=>{
        if(!doc.exists){
          $("joinBox").innerHTML=`<b>Stanza non trovata</b><div class='small'>La stanza <code>${roomId}</code> non esiste o è scaduta. Chiedi al host di ricrearne una.</div>`;
          return;
        }
        syncing=true;game=doc.data();syncing=false;
        if(!game.discardMalefici)game.discardMalefici=[];
        localStorage.setItem("dusklore-app",JSON.stringify(game));
        if(game.players.some(p=>p.controller===clientId)){showGame();render();beginTurn();}
        else renderJoinRoom();
      },err=>{
        $("joinBox").innerHTML=`<b>Errore connessione</b><div class='small'>${err.message}</div>`;
      });
    } else {
      $("joinBox").innerHTML=`<b>Firebase non disponibile</b><div class='small'>Il join online richiede una connessione a Firebase. Assicurati di essere online e ricarica la pagina.</div>`;
    }
  }
}

function renderJoinRoom(){
  const open=game.players.filter(p=>p.controller==="open");
  $("joinBox").classList.remove("hidden");
  const startBtn=document.querySelector('#setup .btn.wide');
  if(startBtn)startBtn.style.display="none";
  // Heroes locked by real players already in the game
  const takenByReal=game.players.filter(p=>p.controller!=="open"&&p.controller!=="ai").map(p=>p.hero);
  const heroOptions=DATA.heroes.map(h=>{
    const lockedByReal=takenByReal.includes(h);
    const usedByAI=!lockedByReal&&game.players.some(p=>p.controller==="ai"&&p.hero===h);
    if(lockedByReal)return `<option value="${h}" disabled>${h} (occupato)</option>`;
    if(usedByAI)return `<option value="${h}">${h} (AI → verrà riassegnata)</option>`;
    return `<option value="${h}">${h}</option>`;
  }).join("");
  $("joinBox").innerHTML=`<b>Entra nella stanza</b>
  <div class="small" style="margin:6px 0 10px">Inserisci il tuo nome e scegli un Protagonista libero, poi seleziona un posto.</div>
  <div class="field" style="margin-bottom:8px"><label>Il tuo nome</label><input id="joinName" placeholder="Nome" value="Giocatore"></div>
  <div class="field" style="margin-bottom:10px"><label>Protagonista</label><select id="joinHero">${heroOptions}</select></div>
  ${open.length?open.map(p=>`<button class="option" onclick="joinSeat('${p.id}')"><b>${escape(p.name)}</b><span>posto libero · clicca per occuparlo</span></button>`).join(""):"<div class='small' style='color:var(--blood)'>Non ci sono posti liberi in questa stanza.</div>"}`;
}

function joinSeat(id){
  const p=game.players.find(x=>x.id===id); if(!p)return;
  const nameVal=($("joinName")||$("nameInput")).value.trim()||"Giocatore";
  const heroVal=($("joinHero")||$("heroSelect")).value;
  // Block if another real player already has this hero
  const blockedBy=game.players.find(x=>x.id!==id&&x.controller!=="open"&&x.controller!=="ai"&&x.hero===heroVal);
  if(blockedBy)return openMsg("Protagonista occupato",`${heroVal} è già scelto da ${escape(blockedBy.name)}. Seleziona un altro Protagonista.`);
  // If an AI has this hero, reassign the AI to the next available hero
  const aiWithHero=game.players.find(x=>x.controller==="ai"&&x.hero===heroVal);
  if(aiWithHero){
    const allHeroes=game.players.filter(x=>x.id!==aiWithHero.id).map(x=>x.hero);
    const newHero=DATA.heroes.find(h=>!allHeroes.includes(h));
    if(newHero){aiWithHero.hero=newHero;aiWithHero.name=newHero;}
  }
  p.controller=clientId;p.isHuman=true;p.name=nameVal;p.hero=heroVal;
  if(heroVal==="SACERDOTE"&&!p.hand.malefici.some(c=>c.name==="Protezione"))p.hand.malefici.push(drawMaleficio("Protezione"));
  log(`${p.name} (${p.hero}) entra nella partita.`);
  save();showGame();render();beginTurn();
}

function renderSlotSetup(){
  const count=Number($("playerCount").value||4);
  $("slotSetup").innerHTML=Array.from({length:count-1},(_,i)=>`
    <div class="slot-row">
      <div><b>Posto ${i+2}</b><span>Può essere controllato dal computer o lasciato libero per un amico.</span></div>
      <select id="slot${i+2}"><option value="ai">AI</option><option value="open">Amico con link</option></select>
    </div>`).join("");
}

function startGame(){
  const count=Number($("playerCount").value||4);
  const corrupt={4:2,5:2,6:2,7:3,8:3}[count], innocents=count-corrupt;
  const identities=shuffle([...Array(innocents).fill("Innocente"),...Array(corrupt).fill("Corrotto")]);
  const domain=rand(DATA.domini);
  game={version:3,roomId:roomId||uid(),hostId:clientId,round:1,act:1,turn:0,phase:"preface",scale:{sun:0,moon:0},domain:{name:domain[0],text:domain[1]},presage:null,log:[],covered:[],discard:[],discardMalefici:[],ended:false,decks:{indizi:makeDeck(DATA.indizi),malefici:makeDeck(maleficiPool()),reliquie:makeDeck(DATA.reliquie)},players:[]};
  const heroes=[$("heroSelect").value,...shuffle(DATA.heroes.filter(h=>h!==$("heroSelect").value))];
  Array.from({length:count},(_,i)=>{
    const kind=i===0?"local":($(`slot${i+1}`)?.value||"ai");
    const name=i===0?($("nameInput").value.trim()||"Giocatore"):kind==="ai"?heroes[i]:`Posto ${i+1} libero`;
    const mission=rand(Object.keys(DATA.missions));
    const p={id:uid(),name,hero:heroes[i],controller:kind==="local"?clientId:kind,isHuman:kind!=="ai",identity:identities.pop(),mission,missionDone:[false,false],missionDoneThisAct:0,relic:drawRelic(),location:"insieme",dark:0,hasPlayed:false,hasDrawn:false,abilityUsed:false,protected:false,known:false,hand:{indizi:[drawIndizio(),drawIndizio(),drawIndizio()],malefici:[drawMaleficio(heroes[i]==="SACERDOTE"?"Protezione":null)]}};
    game.players.push(p);
  });
  log(`Dominio scelto: ${game.domain.name}. Round 1 di prefazione: niente carte, pesca o isolamento.`);
  if(!location.hash.includes("room=")) location.hash="room="+game.roomId;
  showShareLink();
  showGame();
}

function showGame(){$("setup").classList.add("hidden");$("game").classList.remove("hidden");$("handWrap").classList.remove("hidden");}
function human(){return game.players.find(p=>p.controller===clientId)||game.players[0]}
function current(){return game.players[game.turn]}
function threshold(){return DATA.thresholds[game.players.length]}
function actFromScale(){const m=Math.max(game.scale.sun,game.scale.moon),t=threshold();return m>t[2]?3:m>t[1]?2:1}
function isHumanTurn(){return current()?.controller===clientId}
function handLimit(){return game.presage==="Ferimento"?2:3;}
function canUseCurses(){return game.presage!=="Panico" && human().location!=="isolato" && human().hand.malefici.some(c=>c.name!=="Protezione")}
function escape(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function showShareLink(){
  game.roomId=game.roomId||uid();
  roomId=game.roomId;
  const url=location.href.split("#")[0]+"#room="+game.roomId;
  $("joinBox").classList.remove("hidden");
  $("joinBox").innerHTML=`<b>Link stanza</b><div class="small">Condividi questo link con chi deve occupare un posto libero: ${escape(url)}</div>`;
}

function render(){
  if(!game)return;
  const h=human(),t=threshold(),act=actFromScale();
  $("sunScore").textContent=game.scale.sun;$("moonScore").textContent=game.scale.moon;$("winThreshold").textContent=t[0];
  $("sunBar").style.width=Math.min(100,game.scale.sun/t[0]*100)+"%";$("moonBar").style.width=Math.min(100,game.scale.moon/t[0]*100)+"%";
  $("roundLabel").textContent=`Round ${game.round}`;$("actLabel").textContent=game.round===1?"Prefazione":`Atto ${act}`;
  $("domainName").textContent=game.domain.name;$("domainText").textContent=game.domain.text;
  $("presageName").textContent=game.presage||"Nessun Presagio";$("presageText").textContent=game.presage?DATA.presagi[game.presage]:"Il primo round è solo introduzione dei Protagonisti.";
  $("turnLine").textContent=`Turno: ${current().name}${isHumanTurn()?" (tu)":""}`;
  $("indiziCount").textContent=game.decks.indizi.length;$("maleficiCount").textContent=game.decks.malefici.length;$("relicCount").textContent=game.decks.reliquie.length;
  {
    const grps={};
    game.players.forEach((p,i)=>{const k=p.location||"isolato";if(!grps[k])grps[k]=[];grps[k].push({p,i});});
    const mkCard=({p,i})=>`<div class="player ${i===game.turn?'active':''} ${p.controller===clientId?'human':''}">
      <div class="pname">${escape(p.name)}</div>
      <div class="pmeta" style="font-size:10px">${p.hero} · ${p.controller===clientId?`<b style="color:${p.identity==='Corrotto'?'var(--blood)':'var(--green)'}">${p.identity}</b>`:(p.known?p.identity:(p.controller==="open"?"posto libero":"?"))}</div>
      <div class="badges" style="margin-top:4px"><span class="badge">🌑${p.dark}</span><span class="badge" style="font-size:9px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.relic}</span></div>
      <div style="margin-top:4px;font-size:11px;color:var(--muted)">📜<b style="color:var(--text)">${p.hand.indizi.length}</b> ✦<b style="color:var(--text)">${p.hand.malefici.length}</b></div>
    </div>`;
    let html='<div class="groups-layout">';
    if(grps["isolato"]&&grps["isolato"].length){
      html+=`<div class="group-section isolated-section"><div class="group-section-label">Isolati — ${grps["isolato"].length}</div><div class="group-players-grid">${grps["isolato"].map(mkCard).join("")}</div></div>`;
    }
    const groupKeys=Object.keys(grps).filter(k=>k!=="isolato");
    const multiGroup=groupKeys.length>1;
    groupKeys.forEach((gid,idx)=>{
      const members=grps[gid];
      const label=multiGroup?`Gruppo ${String.fromCharCode(65+idx)} — ${members.length} giocatori`:`In Gruppo — ${members.length} ${members.length===1?"giocatore":"giocatori"}`;
      html+=`<div class="group-section together"><div class="group-section-label">${label}</div><div class="group-players-grid">${members.map(mkCard).join("")}</div></div>`;
    });
    html+='</div>';
    $("players").innerHTML=html;
  }
  $("coveredRow").innerHTML=game.covered.length?game.covered.map(c=>`<div class="mini-card">${c.revealed?c.symbols.join(""):"?"}</div>`).join(""):`<span class="small">Carte coperte di fine Atto</span>`;
  $("missionTitle").textContent=h.mission;$("missionRelic").textContent=`Reliquia: ${h.relic}`;
  $("missionPhases").innerHTML=DATA.missions[h.mission].map((txt,i)=>`<div class="mission-phase"><button class="tick ${h.missionDone[i]?'done':''}" onclick="completeMissionPhase(${i})" title="Clicca per segnare/deselezionare">${h.missionDone[i]?'✓':i+1}</button><div><b>Fase ${i+1}</b><div class="small">${escape(txt)}</div></div></div>`).join("");
  $("log").innerHTML=game.log.map(x=>`<div class="logitem">${escape(x)}</div>`).join("");
  if($("discardCount"))$("discardCount").textContent=game.discard.length;
  if($("discardMaleficiCount"))$("discardMaleficiCount").textContent=(game.discardMalefici||[]).length;
  const ended=game.ended;
  const isR1=game.round===1;
  const overLimit=h.hand.indizi.length>handLimit();
  $("playBtn").disabled=ended||!isHumanTurn()||overLimit;
  $("curseBtn").disabled=ended||isR1||!isHumanTurn()||!canUseCurses();
  $("darkBtn").disabled=ended||isR1||h.dark<1;
  {const sb=$("scartaBtn");if(sb){if(overLimit&&isHumanTurn()&&!ended){sb.classList.remove("hidden");sb.disabled=!selectedCard||selectedCard.type!=="indizio";}else{sb.classList.add("hidden");sb.disabled=true;}}}
  try{
    const ab=ABILITIES[h.hero];
    const btn=$("abilityBtn");
    const descEl=$("abilityDesc");
    if(ab&&btn){
      const isActive=ab.type==="active";
      const canUse=isActive&&!isR1&&ab.canUse(h);
      btn.textContent=`⚡ ${ab.name}${h.abilityUsed?" ✓":""}`;
      btn.disabled=ended||isR1||(isActive&&!canUse);
      btn.style.opacity=(isR1||(isActive&&!canUse))?"0.5":"1";
      btn.style.background=isActive&&canUse?"#6a2fa0":ab.type==="passive"?"#2d2040":"#3d1f5a";
      if(descEl)descEl.textContent=ab.desc;
    }
  }catch(e){console.warn("Ability render error:",e);}
  $("playBtn").textContent=game.round===1?"Presenta Protagonista":h.hasPlayed?"Finisci il Turno":!h.hasDrawn?"Pesca carta":game.presage==="Stallo"?"Narra senza Indizio":"Gioca Indizio";
  $("playBtn").style.background=h.hasPlayed&&game.round>1?"#2a4a6a":"";
  $("actionHint").textContent=hintText();
  renderHand();
}

function hintText(){
  const h=human();
  if(!isHumanTurn())return "Attendi: stanno agendo gli avversari.";
  if(game.round===1)return "Round di prefazione: presenta il Protagonista, senza carte o spostamenti.";
  if(!h.hasDrawn)return "All'inizio del turno scegli se pescare un Indizio o un Maleficio.";
  {const lim=handLimit();if(h.hand.indizi.length>lim)return `Hai ${h.hand.indizi.length} Indizi (limite${game.presage==="Ferimento"?" Ferimento":""}: ${lim}). Seleziona un Indizio e premi 🗑 Scarta prima di continuare.`;}
  if(h.hasPlayed)return "Indizio giocato. Puoi ancora usare Pegni Oscuri o abilità, poi premi 'Finisci il Turno'.";
  if(game.presage==="Stallo")return "Presagio Stallo: narra il turno senza giocare Indizi, poi premi 'Finisci il Turno'.";
  if(!selectedCard)return "Scegli un Indizio dalla mano, poi giocalo sulla Bilancia.";
  return `Pronto a giocare: ${selectedCard.name}.`;
}

function renderHand(){
  const h=human(),lim=handLimit(),overLimit=h.hand.indizi.length>lim,list=[...h.hand.indizi,...h.hand.malefici];
  $("handTitle").textContent=overLimit?`La tua mano — troppi Indizi (${h.hand.indizi.length}/${lim})`:"La tua mano - Indizi e Malefici";
  $("hand").innerHTML=list.map(c=>{
    const isSel=selectedCard&&selectedCard.id===c.id;
    const isOL=overLimit&&c.type==="indizio";
    const cls=`card ${c.type==="maleficio"?"maleficio":""} ${isSel?"selected":""} ${c.name==="Protezione"?"reaction":""} ${isOL?"over-limit":""}`.trim();
    const body=c.type==="indizio"?`<div class="symbols">${c.symbols.join("")}</div><div class="card-text">${isOL?"Seleziona e premi Scarta.":"Giocala per inclinare la Bilancia."}</div>`:`<div class="symbols">✦</div><div class="card-text">${escape(c.text)}</div>`;
    return `<button class="${cls}" onclick="selectHandCard('${c.id}','${c.type==='indizio'?'indizi':'malefici'}')"><div><div class="card-type">${c.type}</div><div class="card-title">${escape(c.name)}</div></div>${body}</button>`;
  }).join("") || `<div class="small">Nessuna carta in questa sezione.</div>`;
}
function setHandTab(tab){handTab="all";selectedCard=null;render()}
function selectHandCard(id,tab){const c=human().hand[tab].find(x=>x.id===id);selectedCard=c;if(tab==="malefici"&&c.name!=="Protezione")selectedCurse=c;render()}
function discardSelected(){
  const h=human();
  if(!selectedCard||selectedCard.type!=="indizio")return;
  h.hand.indizi=h.hand.indizi.filter(c=>c.id!==selectedCard.id);
  game.discard.push(selectedCard);
  log(`${h.name} scarta ${selectedCard.name}.`);
  selectedCard=null;
  save();render();
  if(isHumanTurn()&&!h.hasDrawn&&!h.hasPlayed&&h.hand.indizi.length<=handLimit())promptDrawChoice();
}

function drawTurnCard(choice){
  const h=human(); if(h.hasDrawn||game.round===1)return;
  if(choice==="indizio") h.hand.indizi.push(drawIndizio()); else h.hand.malefici.push(drawMaleficio());
  h.hasDrawn=true; enforceHandLimit(h);
  log(`${h.name} pesca una carta ${choice}.`);
}

function promptDrawChoice(){
  const h=human();
  if(!isHumanTurn()||h.hasDrawn||h.hasPlayed||game.round===1)return;
  const lim=handLimit();
  if(h.hand.indizi.length>lim){
    $("modal").classList.remove("hidden");
    $("sheet").innerHTML=`<h2>⚠️ Ferimento</h2><p class="small">Il Presagio limita la mano a <b>${lim} Indizi</b>. Hai ${h.hand.indizi.length}: devi scartare prima di poter pescare.</p><button class="option" onclick="closeModal()">Chiudi e Scarta</button>`;
    return;
  }
  const indiziHint={
    "GIORNALISTA":"⚡ Fiuto: vedrai 2 Indizi e ne terrai 1.",
    "RAMINGO":game.discard.length>0?"⚡ Recupero: potrai scegliere dagli Scarti o dal mazzo.":"Aggiungi un Indizio alla mano (gli Scarti sono vuoti)."
  }[h.hero]||"Aggiungi un Indizio alla mano (max 3).";
  const maleficoHint={
    "SACERDOTE":"⚡ Grazia: potrai scegliere Protezione al posto di un Maleficio casuale."
  }[h.hero]||"Aggiungi un Maleficio alla mano.";
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>Pesca di inizio turno</h2><p class="small">Cosa peschi questo turno?</p>
  <button class="option" onclick="chooseTurnDraw('indizio')"><b>Pesca Indizio</b><span>${indiziHint}</span></button>
  <button class="option" onclick="chooseTurnDraw('maleficio')"><b>Pesca Maleficio</b><span>${maleficoHint}</span></button>`;
}
function chooseTurnDraw(choice){
  closeModal();
  const h=human();
  if(choice==="indizio"){
    if(h.hero==="RAMINGO"&&game.discard.length>0) return promptRamingoChoice();
    if(h.hero==="GIORNALISTA") return promptGiornalistaChoice();
  } else {
    if(h.hero==="SACERDOTE") return promptSacerdoteChoice();
  }
  drawTurnCard(choice);
  promptLocationChoice();
}
function promptLocationChoice(){
  const h=human();
  if(game.presage==="Isolamento"){h.location="isolato";log(`${h.name} è costretto all'Isolamento dal Presagio.`);render();return;}
  if(game.presage==="Convergenza"){
    const gid=game.players.find(p=>p.id!==h.id&&p.location!=="isolato")?.location||("g_"+uid());
    h.location=gid;log(`${h.name} è costretto In Gruppo dal Presagio.`);render();return;
  }
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>Dove sei questo turno?</h2><p class="small">La posizione determina cosa puoi fare e cosa gli altri vedono di te.</p>
  <button class="option" onclick="promptGroupWith()"><b>In Gruppo</b><span>Scegli con chi stare. Puoi lanciare Malefici contro i membri del tuo gruppo.</span></button>
  <button class="option" onclick="chooseIsolato()"><b>Isolato</b><span>Non puoi usare Malefici. La tua carta va coperta: gli altri non sanno quale Indizio hai giocato.</span></button>`;
}
function chooseIsolato(){const h=human();h.location="isolato";closeModal();log(`${h.name} è Isolato.`);render();}
function promptGroupWith(){
  const h=human();
  const others=game.players.filter(p=>p.id!==h.id);
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>Con chi sei In Gruppo?</h2><p class="small">Scegli il giocatore con cui unirti.</p>
  <div style="display:grid;gap:7px">${others.map(p=>`<button class="option" onclick="joinPlayerGroup('${p.id}')"><b>${escape(p.name)}</b><span>${p.hero} · ${p.location==="isolato"?"Isolato":"In Gruppo"}</span></button>`).join("")}</div>
  <button class="option" style="margin-top:6px" onclick="chooseIsolato()">Vai Isolato invece</button>`;
}
function joinPlayerGroup(id){
  const h=human(),target=game.players.find(p=>p.id===id);if(!target)return;
  let gid=target.location==="isolato"?"g_"+uid():target.location;
  if(target.location==="isolato")target.location=gid;
  h.location=gid;
  closeModal();log(`${h.name} è In Gruppo con ${target.name}.`);render();
}
function enforceHandLimit(p){
  if(p.controller===clientId)return;
  const limit=handLimit();
  while(p.hand.indizi.length>limit)game.discard.push(p.hand.indizi.pop());
}
function toggleLocation(){
  const h=human(); if(game.round===1)return;
  if(game.presage==="Isolamento")h.location="isolato"; else if(game.presage==="Convergenza")h.location="insieme"; else h.location=h.location==="insieme"?"isolato":"insieme";
  log(`${h.name} ora è ${h.location}.`);
}

function mainAction(){
  if(!isHumanTurn())return;
  const h=human();
  if(game.round===1){h.hasPlayed=true;log(`${h.name} presenta ${h.hero} nel Dominio.`);nextTurn();return;}
  if(h.hasPlayed){nextTurn();return;}
  if(!h.hasDrawn){promptDrawChoice();return;}
  if(game.presage==="Stallo"){h.hasPlayed=true;log(`${h.name} narra il turno senza usare Indizi per effetto di Stallo.`);save();render();return;}
  if(!h.hand.indizi.length){h.hand.indizi.push(drawIndizio());log(`${h.name} non aveva Indizi: ne pesca uno automaticamente.`)}
  const card=selectedCard&&selectedCard.type==="indizio"?selectedCard:h.hand.indizi[0];
  playIndizio(h,card,h.location==="isolato");
  h.hasPlayed=true;selectedCard=null;
  if(game.ended||game.resolvingAct){save();render();return}
  save();render();
}

function playIndizio(p,card,covered){
  p.hand.indizi=p.hand.indizi.filter(c=>c.id!==card.id);
  if(covered){game.covered.push({...card,owner:p.name,revealed:false,coveredType:"isolation"});log(`${p.name} mette un Indizio coperto sul tavolo.`);return}
  let symbols=[...card.symbols];
  if(game.presage==="Sovversione"&&symbols[0]===symbols[1]) symbols=symbols[0]==="☀️"?["🌙","🌙"]:["☀️","☀️"];
  applySymbols(p,symbols);
  game.discard.push(card);
  log(`${p.name} gioca ${card.name} (${symbols.join("")}).`);
  checkActOrEnd();
}
function applySymbols(p,symbols){
  const sun=symbols.filter(s=>s==="☀️").length, moon=symbols.filter(s=>s==="🌙").length;
  game.scale.sun+=sun; game.scale.moon+=moon; p.dark+=moon;
  if(sun===2&&game.scale.moon>0)game.scale.moon--;
  if(moon===2&&game.scale.sun>0)game.scale.sun--;
}

function nextTurn(){
  if(game.ended)return;
  save();render();
  if(game.players.every(p=>p.hasPlayed)){endRound();return}
  game.turn=(game.turn+1)%game.players.length;
  beginTurn();
}
function endRound(){
  if(game.ended)return;
  game.round++; game.turn=0; game.players.forEach(p=>{p.hasPlayed=false;p.hasDrawn=false;p.abilityUsed=false;});
  game.presage=game.round>=2?rand(Object.keys(DATA.presagi)):null;
  if(game.presage==="Ferimento")game.players.forEach(enforceHandLimit);
  log(`Inizia il Round ${game.round}. Presagio: ${game.presage||"nessuno"}.`);
  beginTurn();
}

function beginTurn(){
  if(!game||game.ended||pendingTurnStart)return;
  render();
  const p=current();
  if(p.controller==="open")return openMsg("Posto libero",`${p.name} non è ancora occupato. Usa un posto AI oppure fai entrare un amico prima di continuare.`);
  askDarkInterrupt(()=>{
    if(isHumanTurn()){promptDrawChoice();}
    else if(p.controller==="ai"&&game.hostId===clientId){
      const h=human();
      if(h.hero==="SOLDATO"&&!h.abilityUsed&&game.round>1&&!game.ended){
        promptSoldatoInterject(()=>setTimeout(aiTurn,450));
      }else{
        setTimeout(aiTurn,450);
      }
    }
  });
}

function askDarkInterrupt(continueTurn){
  const h=human(), p=current();
  if(game.round===1||p.id===h.id||h.dark<3)return continueTurn();
  pendingTurnStart=true;
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>Interrompere il racconto?</h2><p>Sta per iniziare il turno di <b>${p.name}</b>. Hai ${h.dark} Pegni Oscuri: puoi spenderne 3 per interrompere il suo racconto.</p>
  <button class="option" onclick="resolveInterrupt(true)"><b>Spendi 3 Pegni Oscuri</b><span>Il turno di ${p.name} termina immediatamente.</span></button>
  <button class="option" onclick="resolveInterrupt(false)"><b>Non interrompere</b><span>Lascia iniziare il turno.</span></button>`;
  window._continueTurn=continueTurn;
}
function resolveInterrupt(use){
  const h=human(), p=current();
  closeModal();pendingTurnStart=false;
  if(use){h.dark-=3;p.hasPlayed=true;log(`${h.name} spende 3 Pegni Oscuri e interrompe ${p.name}.`);nextTurn();return}
  const cont=window._continueTurn;window._continueTurn=null;if(cont)cont();
}

function aiTurn(){
  const p=current(); if(p.controller!=="ai")return;
  if(game.round===1){p.hasPlayed=true;log(`${p.name} presenta il proprio Protagonista.`);nextTurn();return}
  aiDrawCard(p);
  maybeAiAbility(p,()=>{
    maybeAiCurse(p,()=>{
      if(game.presage==="Stallo"){p.hasPlayed=true;log(`${p.name} narra senza Indizi.`);nextTurn();return}
      aiChooseLocation(p);
      if(!p.hand.indizi.length)p.hand.indizi.push(drawIndizio());
      const card=aiBestCard(p);
      playIndizio(p,card,p.location==="isolato");
      p.hasPlayed=true;
      if(game.ended||game.resolvingAct){save();render();return}
      nextTurn();
    });
  });
}
function aiDrawCard(p){
  if(p.hasDrawn)return;
  const wantsMoon=p.identity==="Corrotto";
  const pref=c=>wantsMoon?c.symbols.filter(s=>s==="🌙").length:c.symbols.filter(s=>s==="☀️").length;
  if(p.hero==="GIORNALISTA"&&Math.random()<.65){
    const c1=drawIndizio(),c2=drawIndizio();
    const [keep,ret]=pref(c1)>=pref(c2)?[c1,c2]:[c2,c1];
    game.decks.indizi.unshift({id:uid(),name:ret.name});
    p.hand.indizi.push(keep);p.hasDrawn=true;enforceHandLimit(p);
    log(`${p.name} usa Fiuto e sceglie ${keep.name}.`);return;
  }
  if(p.hero==="RAMINGO"&&game.discard.length>0&&Math.random()<.55){
    const pool=game.discard.slice(-5);
    const best=pool.reduce((a,b)=>pref(a)>=pref(b)?a:b);
    game.discard=game.discard.filter(c=>c.id!==best.id);
    p.hand.indizi.push(best);p.hasDrawn=true;enforceHandLimit(p);
    log(`${p.name} usa Recupero: prende ${best.name} dagli Scarti.`);return;
  }
  if(p.hero==="SACERDOTE"&&Math.random()<.38&&!p.hand.malefici.some(c=>c.name==="Protezione")){
    p.hand.malefici.push(drawMaleficio("Protezione"));p.hasDrawn=true;
    log(`${p.name} usa Grazia e prende Protezione.`);return;
  }
  const drawIdx=wantsMoon?Math.random()<.62:Math.random()<.68;
  if(drawIdx)p.hand.indizi.push(drawIndizio()); else p.hand.malefici.push(drawMaleficio());
  p.hasDrawn=true;enforceHandLimit(p);
}
function aiChooseLocation(p){
  const wantsMoon=p.identity==="Corrotto";
  if(wantsMoon&&Math.random()<.38){p.location="isolato";return;}
  if(!wantsMoon&&Math.random()<.22){p.location="isolato";return;}
  const existingGrp=game.players.find(x=>x.id!==p.id&&x.location!=="isolato");
  if(existingGrp)p.location=existingGrp.location;
  else p.location="g_"+uid();
}
function aiBestCard(p){
  const wantsMoon=p.identity==="Corrotto";
  return p.hand.indizi.find(c=>wantsMoon?c.symbols[0]==="🌙"&&c.symbols[1]==="🌙":c.symbols[0]==="☀️"&&c.symbols[1]==="☀️")
    ||p.hand.indizi.find(c=>wantsMoon?c.symbols.includes("🌙"):c.symbols.includes("☀️"))
    ||p.hand.indizi[0];
}
function maybeAiAbility(p,done){
  if(game.round===1||p.abilityUsed||game.ended)return done();
  const ab=ABILITIES[p.hero];
  if(!ab||ab.type!=="active")return done();
  if(p.hero==="MEDIUM"&&p.dark>=2&&Math.random()<.42){
    const h=human();p.dark-=2;h.known=true;p.abilityUsed=true;
    log(`${p.name} usa Veggenza su ${h.name}.`);return done();
  }
  if(p.hero==="FANCIULLO"&&p.location!=="isolato"&&p.hand.indizi.length>0&&Math.random()<.4){
    const comp=game.players.filter(x=>x.id!==p.id&&x.location===p.location&&x.location!=="isolato"&&x.hand.indizi.length>0);
    if(comp.length){
      const target=rand(comp),myCard=rand(p.hand.indizi),theirCard=rand(target.hand.indizi);
      p.hand.indizi=p.hand.indizi.filter(c=>c.id!==myCard.id);
      target.hand.indizi=target.hand.indizi.filter(c=>c.id!==theirCard.id);
      p.hand.indizi.push(theirCard);target.hand.indizi.push(myCard);
      enforceHandLimit(p);p.abilityUsed=true;
      log(`${p.name} usa Complicità con ${target.name}.`);return done();
    }
  }
  if(p.hero==="TURISTA"&&p.hand.malefici.length>0&&p.hand.indizi.length<handLimit()&&Math.random()<.5){
    const sac=p.hand.malefici.find(c=>c.name!=="Protezione");
    if(sac){
      p.hand.malefici=p.hand.malefici.filter(c=>c.id!==sac.id);
      if(!game.discardMalefici)game.discardMalefici=[];
      game.discardMalefici.push(sac);
      const card=drawIndizio();p.hand.indizi.push(card);enforceHandLimit(p);
      p.abilityUsed=true;
      log(`${p.name} usa Baratto: sacrifica ${sac.name} e pesca ${card.name}.`);return done();
    }
  }
  done();
}
function maybeAiCurse(ai,done){
  if(game.presage==="Panico"||ai.location==="isolato"||Math.random()>.36)return done();
  const curses=ai.hand.malefici.filter(c=>c.name!=="Protezione"); if(!curses.length)return done();
  const sameGrp=game.players.filter(p=>p.id!==ai.id&&p.location===ai.location&&p.location!=="isolato");
  if(!sameGrp.length)return done();
  const curse=rand(curses), target=sameGrp.includes(human())&&Math.random()<.7?human():rand(sameGrp);
  ai.hand.malefici=ai.hand.malefici.filter(c=>c.id!==curse.id);
  if(target.isHuman && target.hand.malefici.some(c=>c.name==="Protezione")){
    awaitingReaction={source:ai,curse,target,done};
    openProtectionPrompt(ai,curse);
  }else{applyCurse(ai,target,curse);done();}
}

}
function useProtection(use){

function openCurse(){

function castHumanCurse(targetId){

function applyCurse(source,target,curse){
  if(!game.discardMalefici)game.discardMalefici=[];
  game.discardMalefici.push(curse);
  if(curse.name==="Osservazione"){
    target.known=true;
    if(source.controller===clientId) openMsg(`Missione di ${target.name}`,`<b>${target.mission}</b><br>${DATA.missions[target.mission].map((x,i)=>`Fase ${i+1}: ${escape(x)}`).join("<br>")}`);
    log(`${source.name} usa Osservazione su ${target.name}.`);
  }
  if(curse.name==="Rimozione"){
    const pile=target.hand.indizi.length?"indizi":"malefici";const card=target.hand[pile].shift();
    if(card){source.hand[pile].push(card); if(source.controller===clientId) openMsg("Carta sottratta",`Hai preso <b>${card.name}</b> dalla mano di ${target.name}.`); log(`${source.name} usa Rimozione e sottrae ${card.name} a ${target.name}.`)}
    else log(`${source.name} usa Rimozione, ma ${target.name} non ha carte.`);
  }
  if(curse.name==="Sostituzione"){const old=source.relic,tmp=source.relic;source.relic=target.relic;target.relic=tmp; if(source.controller===clientId) openMsg("Reliquia scambiata",`Hai ceduto <b>${old}</b> e ottenuto <b>${source.relic}</b> da ${target.name}.`); log(`${source.name} usa Sostituzione e scambia Reliquia con ${target.name}.`)}
}

function darkInterrupt(){const h=human(); if(h.dark<3)return; h.dark-=3; const next=game.players[(game.turn+1)%game.players.length]; next.hasPlayed=true; closeModal();log(`${h.name} spende 3 Pegni Oscuri: ${next.name} viene interrotto.`)}

function completeMissionPhase(i){
  const h=human();
  if(i===1&&!h.missionDone[0])return openMsg("Fase bloccata","La Fase 2 richiede prima la Fase 1.");
  if(!h.missionDone[i]){
    if((h.missionDoneThisAct||0)>=1)return openMsg("Fase bloccata","Puoi completare solo una Fase Missione per Atto. Aspetta il prossimo Atto.");
    h.missionDone[i]=true;

    h.hand.malefici.push(drawMaleficio(),drawMaleficio());

  } else {

    h.missionDoneThisAct=Math.max(0,(h.missionDoneThisAct||0)-1);

function checkActOrEnd(){
  const [win,a1,a2]=threshold(),m=Math.max(game.scale.sun,game.scale.moon),newAct=actFromScale();

}
function finishAct(){

function revealCovered(){

  save();render();
  $("modal").classList.remove("hidden");

  <div style="margin:10px 0 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--blood)">Fase 1 — Carte Isolamento (${isoCards.length})</div>

    <div style="border-top:1px solid rgba(180,68,68,.25);margin:6px 0"></div>
    <div>☀️ Sole aggiunti: <b style="color:var(--sun)">+${isoSun}</b> &nbsp;·&nbsp; 🌙 Luna aggiunti: <b style="color:var(--moon)">+${isoMoon}</b></div>
  </div>`:""}
  <div style="margin:14px 0 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--violet)">Fase 2 — Carte Fine Atto (${actCards.length})</div>

function epilogue(){

  const winner=game.scale.sun>=game.scale.moon?"Innocenti":"Corrotti";
  game.ended=true;
  log(`Epilogo: vincono ${winner}. Identità rivelate.`);
  save();render();
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>⚖️ Epilogo — Fine Partita</h2>
  <p>Bilancia finale: ☀️ <b>${game.scale.sun}</b> · 🌙 <b>${game.scale.moon}</b> — Vincono: <b>${winner}</b></p>
  <h3 style="margin:12px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em">Identità rivelate</h3>
  ${game.players.map(p=>`<div style="background:#1e1620;border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0"><b>${escape(p.name)}</b> — <span style="color:${p.identity==="Corrotto"?'var(--blood)':'var(--green)'}">${p.identity}</span><div class="small" style="margin-top:4px">${p.hero} · Missione: <i>${escape(p.mission)}</i> (${p.missionDone[1]?"completa":p.missionDone[0]?"fase 1/2":"non completata"})</div></div>`).join("")}
  <h3 style="margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em">Chi narra l'Epilogo?</h3>
  <p class="small">Votate chi tra i presenti narrerà il finale della storia.</p>
  <div class="target-grid">${game.players.map(p=>`<button class="target" onclick="voteNarrator('${p.id}')"><b>${escape(p.name)}</b><div class="small">${p.hero} · ${p.identity}</div></button>`).join("")}</div>`;
}
function voteNarrator(id){
  const narrator=game.players.find(p=>p.id===id);
  $("modal").classList.add("hidden");
  log(`${narrator?escape(narrator.name):"?"} narrerà l'Epilogo. La partita è conclusa.`);
  save();render();
}

function openTargets(title,filter,callbackName){
  const targets=game.players.filter(filter);
  const locLabel=human().location==="isolato"?"Isolato":`nel tuo gruppo`;
  const noTargetMsg=callbackName==="castHumanCurse"
    ?`<p style="color:var(--muted)">Nessun bersaglio valido.<br><span style="font-size:12px">I Malefici colpiscono solo chi è ${locLabel}. In questo momento nessun altro condivide la tua posizione.</span></p>`
    :`<p>Nessun bersaglio valido.</p>`;
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>${title}</h2><div class="target-grid">${targets.map(p=>`<button class="target" onclick="${callbackName}('${p.id}')"><b>${p.name}</b><div class="small">${p.hero} · ${p.location} · Reliquia ${p.relic}</div></button>`).join("")||noTargetMsg}</div><button class="option" onclick="closeModal()">Annulla</button>`;
}
function showDeckInfo(type){openMsg("Mazzo",`Carte rimaste in ${type}: ${game.decks[type].length}.`)}
function showDiscard(){
  const d=game.discard||[];
  if(!d.length)return openMsg("Scarti Indizi vuoti","Nessuna carta nella pila degli scarti Indizi.");
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>Scarti Indizi (${d.length})</h2><div style="display:grid;gap:6px;max-height:55svh;overflow:auto">${[...d].reverse().map(c=>`<div style="background:#1a1015;border:1px solid var(--line);border-radius:10px;padding:9px"><b>${escape(c.name)}</b><div class="small">${c.symbols?c.symbols.join(""):"—"}</div></div>`).join("")}</div><button class="option" style="margin-top:10px" onclick="closeModal()">Chiudi</button>`;
}
function showDiscardMalefici(){
  const d=game.discardMalefici||[];
  if(!d.length)return openMsg("Scarti Malefici vuoti","Nessun Maleficio nella pila degli scarti.");
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>Scarti Malefici (${d.length})</h2><div style="display:grid;gap:6px;max-height:55svh;overflow:auto">${[...d].reverse().map(c=>`<div style="background:#140d1e;border:1px solid var(--line);border-radius:10px;padding:9px"><b>${escape(c.name)}</b><div class="small">${escape(c.text||DATA.malefici[c.name]||"")}</div></div>`).join("")}</div><button class="option" style="margin-top:10px" onclick="closeModal()">Chiudi</button>`;
}
function showRoomLink(){const url=location.href.split("#")[0]+"#room="+game.roomId;openMsg("Link stanza",`Condividi questo link con gli amici che devono occupare un posto libero:<br><br><b>${escape(url)}</b>`)}
function openRules(){openMsg("Promemoria regole","Round 1: prefazione. Dal Round 2: pesca a inizio turno, gioca un Indizio, usa Malefici solo se nello stesso luogo, Presagio attivo fino a fine round. Alla fine di ogni Atto tutti mettono un Indizio coperto e i simboli opposti si annullano.")}
function resetGame(){localStorage.removeItem("dusklore-app");history.replaceState(null,"",location.href.split("#")[0]);roomId=null;game=null;$("game").classList.add("hidden");$("handWrap").classList.add("hidden");$("setup").classList.remove("hidden");closeModal()}
function openMsg(title,body){$("modal").classList.remove("hidden");$("sheet").innerHTML=`<h2>${title}</h2><p>${body}</p><button class="option" onclick="closeModal()">Ok</button>`}
function closeModal(){$("modal").classList.add("hidden")}

// ===== SISTEMA POTERI =====
const ABILITIES={
  "SOLDATO":{name:"Affiancamento",type:"active",
    desc:"Una volta per round puoi cambiare la tua posizione (gruppo o isolamento) anche durante il turno di un altro giocatore.",
    canUse:h=>!isHumanTurn()&&!h.abilityUsed&&game.round>1&&!game.ended},
  "DETECTIVE":{name:"Ispezione",type:"passive",
    desc:"Quando spendi Pegni Oscuri per ottenere una Reliquia, vedi 2 carte e ne scegli 1. Si attiva automaticamente."},
  "RAMINGO":{name:"Recupero",type:"passive",
    desc:"Quando peschi un Indizio a inizio turno, puoi sceglierlo dalla pila degli Scarti invece che dal mazzo. Si attiva automaticamente."},
  "MEDIUM":{name:"Veggenza",type:"active",
    desc:"Spendi 2 Pegni Oscuri per guardare in segreto l'Identità di un altro Protagonista, oppure rivela la tua a tutti.",
    canUse:h=>h.dark>=2&&!h.abilityUsed&&!game.ended},
  "GIORNALISTA":{name:"Fiuto",type:"passive",
    desc:"Quando peschi un Indizio a inizio turno, peschi 2 carte e ne tieni 1 (l'altra torna nel mazzo). Si attiva automaticamente."},
  "SACERDOTE":{name:"Grazia",type:"passive",
    desc:"Quando peschi un Maleficio, puoi scegliere di ricevere Protezione al suo posto. Si attiva automaticamente."},
  "FANCIULLO":{name:"Complicità",type:"active",
    desc:"Se sei In Gruppo, scegli uno dei tuoi Indizi da cedere a un compagno casuale e ricevi in cambio uno dei suoi.",
    canUse:h=>isHumanTurn()&&!h.abilityUsed&&h.location!=="isolato"&&h.hand.indizi.length>0&&game.players.some(p=>p.id!==h.id&&p.location===h.location&&p.location!=="isolato"&&p.hand.indizi.length>0)&&!game.ended},
  "TURISTA":{name:"Baratto",type:"active",
    desc:"Scarta un Maleficio dalla tua mano per pescare un Indizio dal mazzo. Puoi farlo in qualsiasi momento del tuo turno.",
    canUse:h=>isHumanTurn()&&!h.abilityUsed&&h.hand.malefici.length>0&&!game.ended}
};

function openAbility(){
  const h=human(); const ab=ABILITIES[h.hero]; if(!ab)return;
  const isActive=ab.type==="active";
  const canUse=isActive&&ab.canUse(h);
  const reasonDisabled=isActive&&!canUse?getAbilityDisabledReason(h,ab):"";
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`
    <h2>${h.hero}</h2>
    <div style="background:#1a0d2e;border:1px solid rgba(142,97,255,.4);border-radius:14px;padding:14px;margin:8px 0">
      <div style="font-weight:900;font-size:15px;margin-bottom:6px">⚡ ${ab.name}</div>
      <div class="small" style="line-height:1.6">${ab.desc}</div>
    </div>
    <div style="font-size:12px;color:var(--muted);margin:10px 0">
      Tipo: <b style="color:var(--text)">${isActive?"Attivo — clicca per usare":"Passivo — si attiva da solo"}</b>
      ${h.abilityUsed?` · <span style="color:var(--blood)">Già usato questo round</span>`:""}
    </div>
    ${isActive
      ?`<button class="btn ${canUse?"":"secondary"}" style="width:100%;${canUse?"background:#6a2fa0":""}" ${canUse?"":"disabled"} onclick="activateAbility('${h.hero}')">
          ${canUse?"Attiva Potere":"Non disponibile"}
        </button>
        ${reasonDisabled?`<div style="margin-top:8px;font-size:12px;color:var(--muted);text-align:center">${reasonDisabled}</div>`:""}`
      :`<div style="background:rgba(142,97,255,.08);border:1px solid rgba(142,97,255,.2);border-radius:10px;padding:10px;font-size:12px;color:var(--muted)">
          Il potere si attiva automaticamente al momento opportuno, senza bisogno di premere nulla.
        </div>`}
    <button class="option" style="margin-top:10px" onclick="closeModal()">Chiudi</button>`;
}
function getAbilityDisabledReason(h,ab){
  const map={
    "SOLDATO":h.abilityUsed?"Già usato questo round.":isHumanTurn()?"Funziona solo durante il turno altrui.":game.round===1?"Non disponibile nel round di prefazione.":"",
    "MEDIUM":h.dark<2?`Ti servono 2 Pegni Oscuri (ne hai ${h.dark}).`:"",
    "FANCIULLO":h.location==="isolato"?"Devi essere In Gruppo.":!h.hand.indizi.length?"Non hai Indizi da cedere.":"Nessun compagno di gruppo con Indizi.",
    "TURISTA":!h.hand.malefici.length?"Non hai Malefici da sacrificare.":!isHumanTurn()?"Funziona solo durante il tuo turno.":""
  };
  return map[h.hero]||"";
}
function activateAbility(hero){
  closeModal();
  const fns={SOLDATO:abilitySoldato,MEDIUM:abilityMedium,FANCIULLO:abilityFanciullo,TURISTA:abilityTurista};
  if(fns[hero])fns[hero]();
}

// --- SOLDATO ---
function abilitySoldato(){
  const h=human();
  const others=game.players.filter(p=>p.id!==h.id);
  const gruppiAltrui=[...new Set(others.filter(p=>p.location!=="isolato").map(p=>p.location))];
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>⚡ Affiancamento</h2><p class="small">Scegli la tua nuova posizione per questo momento.</p>
  ${h.location!=="isolato"?`<button class="option" onclick="soldatoMove('isolato')"><b>Isolati</b><span>Esci dal gruppo attuale.</span></button>`:""}
  ${gruppiAltrui.map(gid=>{
    const members=others.filter(p=>p.location===gid);
    return `<button class="option" onclick="soldatoMove('${gid}')"><b>Unisciti a: ${members.map(p=>escape(p.name)).join(", ")}</b><span>${members.map(p=>p.hero).join(" · ")}</span></button>`;
  }).join("")}
  ${h.location==="isolato"&&!gruppiAltrui.length?`<p class="small">Tutti sono Isolati: nessun gruppo a cui unirti.</p>`:""}
  <button class="option" onclick="closeModal()">Annulla</button>`;
}
function soldatoMove(gid){
  const h=human();
  if(gid==="isolato"){h.location="isolato";}
  else{
    const stillThere=game.players.some(p=>p.id!==h.id&&p.location===gid);
    h.location=stillThere?gid:"g_"+uid();
  }
  h.abilityUsed=true;
  closeModal();
  log(`${h.name} usa Affiancamento: ora è ${h.location==="isolato"?"Isolato":"In Gruppo"}.`);
  save();render();
}
function promptSoldatoInterject(done){
  const h=human(),p=current();
  pendingTurnStart=true;
  const others=game.players.filter(x=>x.id!==h.id);
  const gruppiAltrui=[...new Set(others.filter(x=>x.location!=="isolato").map(x=>x.location))];
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>⚡ Affiancamento</h2>
  <p class="small">Prima che <b>${escape(p.name)}</b> agisca: vuoi cambiare la tua posizione?</p>
  ${h.location!=="isolato"?`<button class="option" onclick="soldatoInterjectMove('isolato')"><b>Isolati</b><span>Esci dal gruppo attuale.</span></button>`:""}
  ${gruppiAltrui.map(gid=>{const members=others.filter(x=>x.location===gid);return `<button class="option" onclick="soldatoInterjectMove('${gid}')"><b>Unisciti a: ${members.map(x=>escape(x.name)).join(", ")}</b><span>${members.map(x=>x.hero).join(" · ")}</span></button>`;}).join("")}
  ${h.location==="isolato"&&!gruppiAltrui.length?`<p class="small">Tutti sono Isolati: nessun gruppo a cui unirti.</p>`:""}
  <button class="option" onclick="soldatoInterjectSkip()"><b>Salta — non usare il Potere ora</b></button>`;
  window._soldatoInterjectDone=done;
}
function soldatoInterjectMove(gid){
  const h=human();
  if(gid==="isolato"){h.location="isolato";}
  else{const stillThere=game.players.some(p=>p.id!==h.id&&p.location===gid);h.location=stillThere?gid:"g_"+uid();}
  h.abilityUsed=true;pendingTurnStart=false;closeModal();
  log(`${h.name} usa Affiancamento: ora è ${h.location==="isolato"?"Isolato":"In Gruppo"}.`);
  save();render();
  const done=window._soldatoInterjectDone;window._soldatoInterjectDone=null;if(done)done();
}
function soldatoInterjectSkip(){
  pendingTurnStart=false;closeModal();
  const done=window._soldatoInterjectDone;window._soldatoInterjectDone=null;if(done)done();
}

// --- MEDIUM ---
function abilityMedium(){
  const h=human();
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>⚡ Veggenza (2 Pegni Oscuri)</h2>
  <button class="option" onclick="mediumPeekIdentity()"><b>Guarda l'Identità di qualcuno</b><span>Scopri in segreto l'Identità di un altro Protagonista.</span></button>
  <button class="option" onclick="mediumRevealSelf()"><b>Rivela la tua Identità</b><span>Mostra la tua Identità a tutti i presenti al tavolo.</span></button>
  <button class="option" onclick="closeModal()">Annulla</button>`;
}
function mediumPeekIdentity(){
  const targets=game.players.filter(p=>p.controller!==clientId);
  $("sheet").innerHTML=`<h2>Di chi vuoi vedere l'Identità?</h2>
  <div class="target-grid">${targets.map(p=>`<button class="target" onclick="mediumReveal('${p.id}')"><b>${escape(p.name)}</b><div class="small">${p.hero}</div></button>`).join("")}</div>
  <button class="option" style="margin-top:8px" onclick="closeModal()">Annulla</button>`;
}
function mediumReveal(id){
  const h=human(),t=game.players.find(p=>p.id===id); if(!t)return;
  h.dark-=2; t.known=true; closeModal();
  openMsg(`⚡ Veggenza — ${escape(t.name)}`,`L'Identità di <b>${escape(t.name)}</b> è:<br><br><b style="font-size:22px;color:${t.identity==="Corrotto"?"var(--blood)":"var(--green)"}">${t.identity}</b>`);
  log(`${h.name} usa Veggenza e scopre l'Identità di ${t.name}.`); save();render();
}
function mediumRevealSelf(){
  const h=human();
  const targets=game.players.filter(p=>p.controller!==clientId);
  $("sheet").innerHTML=`<h2>⚡ Veggenza — A chi ti riveli?</h2><p class="small">Solo quel Protagonista vedrà la tua Identità.</p>
  <div class="target-grid">${targets.map(p=>`<button class="target" onclick="mediumRevealSelfTo('${p.id}')"><b>${escape(p.name)}</b><div class="small">${p.hero}</div></button>`).join("")}</div>
  <button class="option" style="margin-top:8px" onclick="closeModal()">Annulla</button>`;
}
function mediumRevealSelfTo(targetId){
  const h=human(),t=game.players.find(p=>p.id===targetId);if(!t)return;
  h.dark-=2;closeModal();
  openMsg(`⚡ Veggenza — Solo per ${escape(t.name)}`,`Mostra questo schermo <b>solo</b> a <b>${escape(t.name)}</b>.<br><br>${escape(h.name)} rivela la propria Identità:<br><br><b style="font-size:26px;color:${h.identity==="Corrotto"?"var(--blood)":"var(--green)"}">${h.identity}</b>`);
  log(`${h.name} usa Veggenza e rivela la propria Identità a ${t.name}.`);save();render();
}

// --- FANCIULLO ---
function abilityFanciullo(){
  const h=human();
  if(!h.hand.indizi.length)return openMsg("Complicità","Non hai Indizi da cedere.");
  const companions=game.players.filter(p=>p.id!==h.id&&p.location===h.location&&p.location!=="isolato"&&p.hand.indizi.length>0);
  if(!companions.length)return openMsg("Complicità","Nessun compagno di gruppo con Indizi disponibili.");
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>⚡ Complicità</h2><p class="small">Con chi vuoi scambiare un Indizio?</p>
  <div style="display:grid;gap:7px">${companions.map(p=>`<button class="option" onclick="fanciulloPickCompanion('${p.id}')"><b>${escape(p.name)}</b><span>${p.hero} · ${p.hand.indizi.length} Indizi disponibili</span></button>`).join("")}</div>
  <button class="option" style="margin-top:6px" onclick="closeModal()">Annulla</button>`;
}
function fanciulloPickCompanion(companionId){
  const h=human();
  $("sheet").innerHTML=`<h2>⚡ Complicità</h2><p class="small">Quale tuo Indizio vuoi cedere?</p>
  ${h.hand.indizi.map(c=>`<button class="option" onclick="fanciulloSwap('${c.id}','${companionId}')"><b>${escape(c.name)}</b><span>${c.symbols.join("")}</span></button>`).join("")}
  <button class="option" style="margin-top:6px" onclick="abilityFanciullo()">← Torna</button>`;
}
function fanciulloSwap(cardId,companionId){
  const h=human(),companion=game.players.find(p=>p.id===companionId);
  if(!companion||!companion.hand.indizi.length)return openMsg("Complicità","Nessun Indizio disponibile.");
  const myCard=h.hand.indizi.find(c=>c.id===cardId);if(!myCard)return closeModal();
  const theirCard=rand(companion.hand.indizi);
  h.hand.indizi=h.hand.indizi.filter(c=>c.id!==myCard.id);
  companion.hand.indizi=companion.hand.indizi.filter(c=>c.id!==theirCard.id);
  h.hand.indizi.push(theirCard);companion.hand.indizi.push(myCard);
  closeModal();
  openMsg("⚡ Complicità",`Hai ceduto <b>${escape(myCard.name)}</b> a ${escape(companion.name)}<br>e ricevuto <b>${escape(theirCard.name)}</b> (${theirCard.symbols.join("")}).`);
  log(`${h.name} usa Complicità con ${companion.name}.`); save();render();
}

// --- TURISTA ---
function abilityTurista(){
  const h=human();
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>⚡ Baratto</h2><p class="small">Scegli un Maleficio da sacrificare. Pescherai un Indizio dal mazzo in cambio.</p>
  ${h.hand.malefici.map(c=>`<button class="option" onclick="turistaSwap('${c.id}')"><b>${escape(c.name)}</b><span>${escape(DATA.malefici[c.name]||c.text||"")}</span></button>`).join("")}
  <button class="option" onclick="closeModal()">Annulla</button>`;
}
function turistaSwap(cardId){
  const h=human(); const curse=h.hand.malefici.find(c=>c.id===cardId); if(!curse)return;
  h.hand.malefici=h.hand.malefici.filter(c=>c.id!==cardId);
  if(!game.discardMalefici)game.discardMalefici=[];
  game.discardMalefici.push(curse);
  const newCard=drawIndizio(); h.hand.indizi.push(newCard); enforceHandLimit(h);
  closeModal();
  log(`${h.name} usa Baratto: sacrifica ${escape(curse.name)} e pesca ${newCard.name} (${newCard.symbols.join("")}).`);
  save();render();
}

// --- RAMINGO (passivo) ---
function promptRamingoChoice(){
  $("modal").classList.remove("hidden");
  const discardOptions=game.discard.slice(-5).reverse();
  $("sheet").innerHTML=`<h2>⚡ Recupero (Ramingo)</h2><p class="small">Puoi scegliere un Indizio dagli Scarti oppure pescarne uno dal mazzo.</p>
  <div style="display:grid;gap:6px;margin-bottom:10px">${discardOptions.map(c=>`<button class="option" onclick="ramingoPickDiscard('${c.id}')"><b>${escape(c.name)}</b><span>${c.symbols.join("")} · dagli Scarti</span></button>`).join("")}</div>
  <button class="option" onclick="ramingoPickDeck()"><b>Pesca dal mazzo</b><span>Indizio casuale dal mazzo.</span></button>
  <button class="option" onclick="closeModal()" style="margin-top:4px">Annulla pesca</button>`;
}
function ramingoPickDiscard(id){
  const h=human(); const card=game.discard.find(c=>c.id===id); if(!card)return;
  game.discard=game.discard.filter(c=>c.id!==id);
  h.hand.indizi.push(card); h.hasDrawn=true; enforceHandLimit(h);
  closeModal(); log(`${h.name} usa Recupero e prende ${card.name} dagli Scarti.`); promptLocationChoice();
}
function ramingoPickDeck(){
  const h=human(); drawTurnCard("indizio"); closeModal(); promptLocationChoice();
}

// --- GIORNALISTA (passivo) ---
function promptGiornalistaChoice(){
  if(!game.decks.indizi.length)game.decks.indizi=makeDeck(DATA.indizi);
  const c1=makeIndizio(game.decks.indizi.pop().name);
  if(!game.decks.indizi.length)game.decks.indizi=makeDeck(DATA.indizi);
  const c2=makeIndizio(game.decks.indizi.pop().name);
  window._giornalistaCards=[c1,c2];
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>⚡ Fiuto (Giornalista)</h2><p class="small">Hai pescato 2 Indizi: tienine uno, l'altro torna nel mazzo.</p>
  <button class="option" onclick="giornalistaPick(0)"><b>${escape(c1.name)}</b><span>${c1.symbols.join("")}</span></button>
  <button class="option" onclick="giornalistaPick(1)"><b>${escape(c2.name)}</b><span>${c2.symbols.join("")}</span></button>`;
}
function giornalistaPick(keepIdx){
  const h=human(); const cards=window._giornalistaCards||[];
  const keep=cards[keepIdx]; const ret=cards[1-keepIdx];
  if(ret)game.decks.indizi.unshift({id:uid(),name:ret.name});
  if(keep){h.hand.indizi.push(keep); h.hasDrawn=true; enforceHandLimit(h);}
  window._giornalistaCards=null; closeModal();
  log(`${h.name} usa Fiuto e sceglie ${escape(keep.name)} (${keep.symbols.join("")}).`);
  promptLocationChoice();
}

// --- SACERDOTE (passivo) ---
function promptSacerdoteChoice(){
  $("modal").classList.remove("hidden");
  $("sheet").innerHTML=`<h2>⚡ Grazia (Sacerdote)</h2><p class="small">Stai per pescare un Maleficio. Puoi scegliere Protezione invece.</p>
  <button class="option" onclick="sacerdotePickProtection()"><b>Prendi Protezione</b><span>Reazione: annulla un Maleficio scagliato contro di te.</span></button>
  <button class="option" onclick="sacerdotePickRandom()"><b>Pesca un Maleficio casuale</b><span>Dal mazzo, come di norma.</span></button>`;
}
function sacerdotePickProtection(){
  const h=human();
  h.hand.malefici.push(drawMaleficio("Protezione")); h.hasDrawn=true;
  closeModal(); log(`${h.name} usa Grazia e prende Protezione.`); promptLocationChoice();
}
function sacerdotePickRandom(){
  drawTurnCard("maleficio"); closeModal(); promptLocationChoice();
}
