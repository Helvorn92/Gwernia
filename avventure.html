
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avventure — Le Cronache di Gwernia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:#9a7535;
  --bg:#06060f;--cream:#f0e6d3;--cream-dim:#bba98c;
  --border:rgba(201,168,76,.42);--glow:rgba(201,168,76,.65);
  --panel:rgba(10,9,24,.88);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:'Lora',Georgia,'Times New Roman',serif;font-size:17px;overflow-x:hidden;min-height:100vh;font-variant-numeric:lining-nums;text-rendering:optimizeLegibility}
a{color:inherit}
button{font-family:inherit}

#stars-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ═══ TOP BAR ═══ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:300;height:56px;display:flex;align-items:center;justify-content:center;padding:0 1.4rem;background:linear-gradient(180deg,rgba(4,3,12,.92),rgba(4,3,12,.6) 70%,transparent);pointer-events:none}
.topbar>*{pointer-events:auto}
.top-login-btn{position:absolute;right:1.4rem;top:50%;transform:translateY(-50%)}
.back-btn{background:rgba(6,4,16,.9);border:1px solid rgba(201,168,76,.35);color:var(--gold-dim);font-family:'Cormorant Garamond','Palatino Linotype',serif;font-weight:600;font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;padding:.48rem 1.2rem;cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}
.top-login-btn{background:rgba(6,4,16,.9);border:1px solid rgba(201,168,76,.35);color:var(--gold-dim);font-size:1rem;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.top-login-btn:hover{border-color:var(--gold);color:var(--gold)}
.top-login-btn.logged{color:#7fd87f;border-color:rgba(127,216,127,.5)}

/* ═══ LAYOUT ═══ */
.wrap{position:relative;z-index:10;max-width:1340px;margin:0 auto;padding:5.2rem 2rem 4rem}

/* ═══ BACHECA A SCHERMO INTERO (senza scroll) ═══ */
#board-view{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;padding:4.1rem 2rem 1.2rem}

/* ═══ INSEGNA ═══ */
.marquee{text-align:center;margin-bottom:1.1rem;flex-shrink:0}
.marquee-eyebrow{font-family:'Cormorant Garamond','Palatino Linotype',serif;font-weight:600;font-size:.66rem;letter-spacing:.55em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:.5rem}
.marquee-title{font-family:'Cormorant Garamond','Palatino Linotype',serif;font-size:clamp(1.9rem,4vw,3rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:transparent;background:linear-gradient(165deg,#f0e6d3 0%,#e8c97a 30%,#c9a84c 55%,#fff3d6 65%,#a07828 90%);-webkit-background-clip:text;background-clip:text}
.marquee-sub{font-style:italic;color:var(--cream-dim);font-size:.92rem;margin-top:.4rem}
.marquee-lights{display:flex;justify-content:center;gap:.85rem;margin-top:.8rem}
.marquee-lights span{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle,#ffe9ad,#c9a84c 70%);box-shadow:0 0 10px rgba(232,201,122,.8);animation:bulb 2.2s ease-in-out infinite}
.marquee-lights span:nth-child(2n){animation-delay:.55s}
.marquee-lights span:nth-child(3n){animation-delay:1.1s}
@keyframes bulb{0%,100%{opacity:1}50%{opacity:.25}}

/* ═══ BACHECA ═══ */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,auto);grid-template-rows:auto auto;gap:19px;justify-content:center;align-content:center}
.poster{
  position:relative;cursor:pointer;height:var(--ph,340px);width:auto;
  background:var(--panel);
  border:1px solid rgba(201,168,76,.3);
  box-shadow:0 0 0 4px rgba(4,3,12,.9),0 0 0 5px rgba(201,168,76,.18),0 14px 34px rgba(0,0,0,.7);
  transition:transform .32s cubic-bezier(.2,.7,.2,1),box-shadow .32s,border-color .32s;
  overflow:hidden;
  opacity:0;transform:translateY(20px);animation:postIn .55s forwards;
}
@keyframes postIn{to{opacity:1;transform:translateY(0)}}
.poster:hover{transform:translateY(-8px) scale(1.025);border-color:var(--gold);box-shadow:0 0 0 4px rgba(4,3,12,.9),0 0 0 5px rgba(201,168,76,.5),0 24px 54px rgba(0,0,0,.85),0 0 40px rgba(201,168,76,.16)}
/* la cornice segue il formato dell'immagine: niente tagli, niente bande */
.poster img{display:block;height:100%;width:auto;transition:transform .5s ease}
.poster:hover img{transform:scale(1.05)}
.poster::after{content:'';position:absolute;top:0;bottom:0;left:-80%;width:50%;background:linear-gradient(105deg,transparent,rgba(255,240,190,.13),transparent);transform:skewX(-18deg);transition:left .55s ease;z-index:3}
.poster:hover::after{left:135%}
/* slot vuoto */
.poster.empty{cursor:default;aspect-ratio:2/3;border-style:dashed;border-color:rgba(201,168,76,.3);box-shadow:none;background:linear-gradient(165deg,rgba(12,10,28,.9),rgba(6,5,16,.95))}
.poster.empty:hover{transform:none;box-shadow:none;border-color:rgba(201,168,76,.45)}
.poster.empty .empty-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem}
.poster.empty .empty-star{font-family:'Cormorant Garamond',serif;font-size:2.4rem;color:rgba(201,168,76,.28)}
.poster.empty .empty-label{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(187,169,140,.4)}
body.is-admin .poster.empty{cursor:pointer}
body.is-admin .poster.empty:hover .empty-star{color:var(--gold)}
/* matita admin */
.poster-edit{position:absolute;top:8px;left:8px;z-index:4;width:28px;height:28px;background:rgba(4,3,12,.88);border:1px solid rgba(201,168,76,.5);color:var(--gold);font-size:.8rem;cursor:pointer;display:none;align-items:center;justify-content:center}
body.is-admin .poster:hover .poster-edit{display:flex}
.poster-edit:hover{background:rgba(201,168,76,.2)}

/* ═══ DETTAGLIO ═══ */
#detail-view{display:none}
.detail-topline{display:flex;align-items:center;gap:.8rem;margin-bottom:1.6rem}
.detail-back{display:inline-flex;align-items:center;gap:.5rem;background:rgba(6,4,16,.7);border:1px solid rgba(201,168,76,.3);color:var(--gold-dim);font-family:'Cormorant Garamond',serif;font-weight:600;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;padding:.55rem 1.2rem;cursor:pointer;transition:all .2s}
.detail-back:hover{border-color:var(--gold);color:var(--gold)}
.detail{display:grid;grid-template-columns:minmax(300px,500px) 1fr;gap:2.8rem;align-items:start;animation:detIn .45s ease}
@keyframes detIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.detail-poster{position:relative;border:1px solid rgba(201,168,76,.35);box-shadow:0 0 0 5px rgba(4,3,12,.9),0 0 0 6px rgba(201,168,76,.22),0 26px 60px rgba(0,0,0,.85);overflow:hidden;background:var(--panel)}
.detail-poster img{width:100%;height:auto;display:block}
.detail-poster.noimg{aspect-ratio:3/4}
.detail-poster .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:5rem;color:rgba(201,168,76,.2)}
.detail-info{min-width:0}
.detail-title{font-family:'Cormorant Garamond','Palatino Linotype',serif;font-weight:700;font-size:clamp(2.2rem,4.2vw,3.4rem);line-height:1.08;letter-spacing:.04em;color:transparent;background:linear-gradient(165deg,#f0e6d3,#e8c97a 35%,#c9a84c 60%,#fff3d6 70%,#a07828);-webkit-background-clip:text;background-clip:text}
.detail-chips{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:1.2rem}
.dchip{display:flex;flex-direction:column;gap:.2rem;border:1px solid rgba(201,168,76,.4);background:rgba(4,3,12,.78);padding:.55rem 1.05rem;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.dchip-l{font-family:'Lora',Georgia,serif;font-weight:700;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.dchip-v{font-family:'Lora',Georgia,serif;font-weight:700;font-size:1.02rem;letter-spacing:.03em;color:var(--cream)}
.dchip-v .skull-on{color:#e8c97a;text-shadow:0 0 8px rgba(232,181,58,.5)}
.dchip-v .skull-off{color:rgba(187,169,140,.28)}
.detail-edit{background:rgba(201,168,76,.13);border:1px solid rgba(201,168,76,.5);color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;padding:.55rem 1.2rem;cursor:pointer;transition:background .2s;display:none}
body.is-admin .detail-edit{display:inline-block}
.detail-edit:hover{background:rgba(201,168,76,.26)}
.detail-desc{margin-top:1.5rem;background:var(--panel);border:1px solid rgba(201,168,76,.22);border-left:3px solid var(--gold-dim);padding:1.5rem 1.7rem;line-height:1.9;font-size:1.12rem;font-weight:500;color:var(--cream)}
.detail-desc p{margin:.7rem 0;text-align:justify}
.detail-desc p:first-child{margin-top:0}
.detail-desc p:last-child{margin-bottom:0}
.detail-desc .empty{font-style:italic;color:rgba(187,169,140,.45)}

/* ═══ MODALI ═══ */
.ov{position:fixed;inset:0;z-index:9980;background:rgba(2,1,8,.86);backdrop-filter:blur(10px);display:none}
.ov.open{display:block}
.modal{position:fixed;z-index:9981;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(8,5,20,.97);border:2px solid var(--border);border-top:3px solid var(--gold-dim);max-width:560px;width:94%;max-height:88vh;overflow-y:auto;padding:1.9rem 2rem;display:none;box-shadow:0 24px 64px rgba(0,0,0,.9)}
.modal.open{display:block}
.modal-title{font-family:'Cormorant Garamond','Palatino Linotype',serif;font-weight:700;font-size:1.15rem;letter-spacing:.08em;color:var(--gold-light);margin-bottom:1rem}
.modal-close{position:absolute;top:.7rem;right:.95rem;background:none;border:none;color:var(--gold-dim);font-size:1.3rem;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--gold)}
.field{margin-bottom:.85rem}
.field label{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dim);display:block;margin-bottom:.32rem}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.3);padding:.5rem .65rem;color:var(--cream);font-family:'Lora',Georgia,serif;font-size:.92rem;outline:none;resize:vertical;transition:border-color .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(201,168,76,.7)}
.field select{cursor:pointer}
.field select option{background:#0b0a1c}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.hint{font-size:.72rem;color:var(--cream-dim);font-style:italic;margin-top:.25rem}
.modal-actions{display:flex;gap:.8rem;margin-top:1rem}
.btn{flex:1;padding:.65rem;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.5);color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{background:rgba(201,168,76,.28);border-color:var(--gold)}
.btn-danger{border-color:rgba(255,80,80,.5);color:#ff8080}
.btn-danger:hover{background:rgba(255,80,80,.15);border-color:#ff8080}
#login-error{color:#ff8080;font-size:.8rem;display:none;margin:.4rem 0 0}
.save-msg{font-size:.8rem;color:#7fd87f;display:none;margin-top:.5rem;text-align:center}

/* ═══ RESPONSIVE ═══ */
@media(max-width:900px){
  #board-view{position:static;display:block;padding:4.6rem 1.2rem 2.5rem}
  .board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto;gap:1rem}
  .poster{height:auto}
  .detail{grid-template-columns:1fr}
  .detail-poster{max-width:380px;margin:0 auto}
}
@media(max-width:600px){
  .wrap{padding:4.6rem 1rem 3rem}
  .board{grid-template-columns:repeat(2,1fr);gap:.9rem}
  .field-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<div class="topbar">
  <a class="back-btn" href="https://helvorn92.github.io/World/gwernia">Torna al Sito</a>
  <button class="top-login-btn" id="login-btn" onclick="openLogin()" title="Accedi">⚿</button>
</div>

<div class="wrap">

  <!-- ═══ BACHECA ═══ -->
  <div id="board-view">
    <div class="marquee">
      <p class="marquee-eyebrow">✦ &nbsp; Ora in scena su Gwernia &nbsp; ✦</p>
      <h1 class="marquee-title">Le Avventure</h1>
      <p class="marquee-sub">Dieci locandine, dieci storie. Scegli quella che fa per te.</p>
      <div class="marquee-lights"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="board" id="board"></div>
  </div>

  <!-- ═══ DETTAGLIO ═══ -->
  <div id="detail-view">
    <div class="detail-topline">
      <button class="detail-back" onclick="showBoard()">← La Bacheca</button>
      <button class="detail-edit" onclick="openEdit(currentId)">✎ &nbsp; Modifica</button>
    </div>
    <div class="detail">
      <div class="detail-poster" id="d-poster"></div>
      <div class="detail-info">
        <h1 class="detail-title" id="d-title"></h1>
        <div class="detail-chips" id="d-chips"></div>
        <div class="detail-desc" id="d-desc"></div>
      </div>
    </div>
  </div>

</div>

<!-- ═══ LOGIN ═══ -->
<div class="ov" id="login-ov" onclick="if(event.target===this)closeLogin()"></div>
<div class="modal" id="login-modal">
  <button class="modal-close" onclick="closeLogin()">✕</button>
  <div class="modal-title" id="login-title">Accesso</div>
  <div id="login-form">
    <div class="field"><label>Email</label><input type="email" id="login-email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="login-password" autocomplete="current-password"></div>
    <p id="login-error"></p>
    <div class="modal-actions"><button class="btn" onclick="doLogin()">✦ &nbsp; Entra</button></div>
  </div>
  <div id="logged-box" style="display:none">
    <p class="hint" id="logged-email" style="margin-bottom:1rem"></p>
    <div class="modal-actions"><button class="btn" onclick="doLogout()">⎋ &nbsp; Esci</button></div>
  </div>
</div>

<!-- ═══ EDIT ═══ -->
<div class="ov" id="edit-ov" onclick="if(event.target===this)closeEdit()"></div>
<div class="modal" id="edit-modal">
  <button class="modal-close" onclick="closeEdit()">✕</button>
  <div class="modal-title" id="edit-title">Locandina</div>
  <div class="field"><label>Titolo dell'avventura</label><input type="text" id="f-title"></div>
  <div class="field"><label>Locandina (URL immagine)</label><input type="text" id="f-img" placeholder="https://..."><div class="hint">Consiglio: immagine verticale 2:3, come una locandina da cinema.</div></div>
  <div class="field-row">
    <div class="field"><label>Tipo di campagna</label><input type="text" id="f-type" placeholder="Esplorazione, Investigazione…"></div>
    <div class="field"><label>Mood</label><input type="text" id="f-mood" placeholder="Horror, Comico, Epico…"></div>
  </div>
  <div class="field"><label>Letalità (0 = non mostrata)</label>
    <select id="f-lethal">
      <option value="0">— nessuna —</option>
      <option value="1">★ (1) Passeggiata</option>
      <option value="2">★★ (2) Impegnativa</option>
      <option value="3">★★★ (3) Pericolosa</option>
      <option value="4">★★★★ (4) Spietata</option>
      <option value="5">★★★★★ (5) Mortale</option>
    </select>
  </div>
  <div class="field"><label>Descrizione</label><textarea id="f-desc" rows="7" placeholder="Le informazioni sull'avventura. Lascia una riga vuota tra un paragrafo e l'altro."></textarea></div>
  <div class="modal-actions">
    <button class="btn btn-danger" id="f-clear" onclick="clearAdv()">🗑 &nbsp; Svuota slot</button>
    <button class="btn" onclick="saveAdv()">✦ &nbsp; Salva</button>
  </div>
  <p class="save-msg" id="save-msg">Salvato ✦</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCCfucSV5KmGd4M9Bg7mD4UPhbBK4ce0-k",
    authDomain: "gwernia.firebaseapp.com",
    projectId: "gwernia",
    storageBucket: "gwernia.firebasestorage.app",
    messagingSenderId: "442880358118",
    appId: "1:442880358118:web:71b180258d8dc98d786d27",
    measurementId: "G-4TEN29F7HG"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  setPersistence(auth, browserLocalPersistence).catch(()=>{});

  onAuthStateChanged(auth, user => {
    document.body.classList.toggle('is-admin', !!user);
    window.dispatchEvent(new CustomEvent('auth-changed', { detail: { uid: user?user.uid:null, email: user?user.email:null } }));
  });

  window.fbLogin = (e,p) => signInWithEmailAndPassword(auth,e,p);
  window.fbLogout = () => signOut(auth);
  window.fbSaveAdv = (id,data) => setDoc(doc(db,'adventures',id), data, { merge:false });
  window.fbSubscribeAdvs = cb => onSnapshot(collection(db,'adventures'), snap => {
    const out={}; snap.forEach(d=>{ out[d.id]=d.data(); }); cb(out);
  }, err => console.error('Firestore adventures error:', err));
</script>

<script>
/* ═══ STELLE ═══ */
const canvas=document.getElementById('stars-canvas'),ctx=canvas.getContext('2d');
let W,H,stars=[];
function resizeStars(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;stars=[];var count=Math.floor((W*H)/4200);for(var i=0;i<count;i++){var bright=Math.random()<0.12;stars.push({x:Math.random()*W,y:Math.random()*H,r:bright?Math.random()*.8+1:Math.random()*.9+.2,pulse:Math.random()*Math.PI*2,speed:Math.random()*.8+.4,bright:bright});}}
function drawStars(){ctx.clearRect(0,0,W,H);var t=Date.now()*.001;stars.forEach(function(s){var a=s.bright?.55+.45*Math.sin(t*s.speed+s.pulse):.25+.35*Math.sin(t*s.speed*.6+s.pulse);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,245,210,'+a+')';ctx.fill();});requestAnimationFrame(drawStars);}
window.addEventListener('resize',resizeStars);resizeStars();drawStars();

/* ═══ DATI ═══ */
const SLOTS=['adv1','adv2','adv3','adv4','adv5','adv6','adv7','adv8','adv9','adv10'];
let ADVS={}, currentId=null, isAdmin=false;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function skulls(n){
  n=Math.max(0,Math.min(5,parseInt(n,10)||0));
  if(!n)return '';
  let out='';for(let i=1;i<=5;i++)out+='<span class="'+(i<=n?'skull-on':'skull-off')+'">★</span>';
  return out;
}

/* ═══ ADATTAMENTO ALLO SCHERMO ═══ */
/* calcola l'altezza delle locandine perché 5×2 riempiano esattamente lo spazio, senza scroll */
function fitBoard(){
  const board=document.getElementById('board');
  if(window.innerWidth<=900){board.style.removeProperty('--ph');return;}
  const gap=19;
  const availW=board.clientWidth, availH=board.clientHeight;
  if(availW<10||availH<10){requestAnimationFrame(fitBoard);return;}
  const byHeight=(availH-gap)/2;
  const byWidth=((availW-4*gap)/5)*1.5;
  board.style.setProperty('--ph',Math.floor(Math.min(byHeight,byWidth))+'px');
}
window.addEventListener('resize',fitBoard);
window.addEventListener('load',fitBoard);

/* ═══ BACHECA ═══ */
function renderBoard(){
  const el=document.getElementById('board');
  el.innerHTML=SLOTS.map((id,i)=>{
    const a=ADVS[id];
    const delay='style="animation-delay:'+(i*70)+'ms"';
    if(!a||!a.title){
      return '<div class="poster empty" '+delay+' onclick="if(isAdmin)openEdit(\''+id+'\')">'+
        '<div class="empty-inner"><div class="empty-star">✧</div><div class="empty-label">Prossimamente</div></div></div>';
    }
    const img=a.img?'<img src="'+esc(a.img)+'" alt="'+esc(a.title)+'" loading="lazy">':'';
    return '<div class="poster" '+delay+' onclick="showAdv(\''+id+'\')">'+img+
      '<button class="poster-edit" title="Modifica" onclick="event.stopPropagation();openEdit(\''+id+'\')">✎</button></div>';
  }).join('');
  fitBoard();
}

/* ═══ DETTAGLIO ═══ */
function showAdv(id){
  const a=ADVS[id]; if(!a||!a.title) return;
  currentId=id;
  document.getElementById('board-view').style.display='none';
  document.getElementById('detail-view').style.display='block';
  window.scrollTo(0,0);
  const dp=document.getElementById('d-poster');
  dp.innerHTML=a.img?'<img src="'+esc(a.img)+'" alt="">':'<div class="ph">✧</div>';
  dp.classList.toggle('noimg',!a.img);
  document.getElementById('d-title').textContent=a.title;
  let chips='';
  if(a.type) chips+='<span class="dchip"><span class="dchip-l">Campagna</span><span class="dchip-v">'+esc(a.type)+'</span></span>';
  if(a.mood) chips+='<span class="dchip"><span class="dchip-l">Mood</span><span class="dchip-v">'+esc(a.mood)+'</span></span>';
  if(a.lethal>0) chips+='<span class="dchip"><span class="dchip-l">Letalità</span><span class="dchip-v">'+skulls(a.lethal)+'</span></span>';
  document.getElementById('d-chips').innerHTML=chips;
  const d=document.getElementById('d-desc');
  d.innerHTML=a.desc?String(a.desc).split(/\n\s*\n/).map(p=>'<p>'+esc(p.trim())+'</p>').join(''):'<p class="empty">Nessuna descrizione… per ora.</p>';
}
function showBoard(){
  currentId=null;
  document.getElementById('detail-view').style.display='none';
  document.getElementById('board-view').style.display='';
  fitBoard();
}

/* ═══ LOGIN ═══ */
function openLogin(){document.getElementById('login-ov').classList.add('open');document.getElementById('login-modal').classList.add('open');document.getElementById('login-error').style.display='none';}
function closeLogin(){document.getElementById('login-ov').classList.remove('open');document.getElementById('login-modal').classList.remove('open');}
function doLogin(){
  const e=document.getElementById('login-email').value.trim(),p=document.getElementById('login-password').value;
  if(!e||!p)return;
  window.fbLogin(e,p).then(()=>{document.getElementById('login-password').value='';closeLogin();})
  .catch(()=>{const er=document.getElementById('login-error');er.textContent='Credenziali non valide.';er.style.display='block';});
}
function doLogout(){window.fbLogout();closeLogin();}

window.addEventListener('auth-changed',ev=>{
  isAdmin=!!ev.detail.uid;
  const btn=document.getElementById('login-btn');
  btn.classList.toggle('logged',isAdmin);
  document.getElementById('login-form').style.display=isAdmin?'none':'block';
  document.getElementById('logged-box').style.display=isAdmin?'block':'none';
  document.getElementById('login-title').textContent=isAdmin?'Narratore':'Accesso';
  if(isAdmin)document.getElementById('logged-email').textContent=ev.detail.email;
  renderBoard();
});

/* ═══ EDIT ═══ */
let editingId=null;
function openEdit(id){
  if(!isAdmin)return;
  editingId=id;
  const a=ADVS[id]||{};
  document.getElementById('edit-title').textContent='Locandina '+(SLOTS.indexOf(id)+1)+' di 10';
  document.getElementById('f-title').value=a.title||'';
  document.getElementById('f-img').value=a.img||'';
  document.getElementById('f-type').value=a.type||'';
  document.getElementById('f-mood').value=a.mood||'';
  document.getElementById('f-lethal').value=a.lethal||'0';
  document.getElementById('f-desc').value=a.desc||'';
  document.getElementById('save-msg').style.display='none';
  document.getElementById('edit-ov').classList.add('open');
  document.getElementById('edit-modal').classList.add('open');
}
function closeEdit(){document.getElementById('edit-ov').classList.remove('open');document.getElementById('edit-modal').classList.remove('open');editingId=null;}
function saveAdv(){
  if(!isAdmin||!editingId)return;
  const data={
    title:document.getElementById('f-title').value.trim(),
    img:document.getElementById('f-img').value.trim(),
    type:document.getElementById('f-type').value.trim(),
    mood:document.getElementById('f-mood').value.trim(),
    lethal:parseInt(document.getElementById('f-lethal').value,10)||0,
    desc:document.getElementById('f-desc').value.trim()
  };
  if(!data.title){alert('Il titolo è obbligatorio.');return;}
  const id=editingId;
  window.fbSaveAdv(id,data).then(()=>{
    const m=document.getElementById('save-msg');m.style.display='block';
    setTimeout(()=>{closeEdit();if(currentId===id)showAdv(id);},550);
  }).catch(err=>{alert('Errore nel salvataggio: '+err.message);});
}
function clearAdv(){
  if(!isAdmin||!editingId)return;
  if(!confirm('Svuotare questa locandina?'))return;
  const id=editingId;
  window.fbSaveAdv(id,{}).then(()=>{closeEdit();if(currentId===id)showBoard();});
}

/* ═══ AVVIO ═══ */
renderBoard();
(function waitFb(){
  if(!window.fbSubscribeAdvs){setTimeout(waitFb,30);return;}
  window.fbSubscribeAdvs(advs=>{
    ADVS=advs;
    renderBoard();
    if(currentId){ if(ADVS[currentId]&&ADVS[currentId].title) showAdv(currentId); else showBoard(); }
  });
})();
</script>
</body>
</html>
